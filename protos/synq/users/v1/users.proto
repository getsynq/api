syntax = "proto3";

package synq.users.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/getsynq/api/users/v1";

message User {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;

  // Canonical identity strings for this user.
  // Includes "synq:<user_id>" and all linked aliases (email, slack, msteams).
  // Can be passed to ListIssues(interacted_by_identities) to filter issues this user interacted with.
  repeated string identities = 5;
}

message UserAlias {
  string user_id = 1 [(buf.validate.field).string.uuid = true];

  oneof type {
    SlackUser slack = 30;
    EmailUser email = 31;
    MsTeamsUser ms_teams = 32;
  }
}

message SlackUser {
  string user_id = 1 [(buf.validate.field) = {
    string: {min_len: 1}
    required: true
  }];

  // True when the mapping was established by the user proving ownership of the
  // Slack account through "Sign in with Slack" (OIDC), rather than being
  // self-asserted. Server-set only — never trusted from client input. Empty
  // (unset/false) means the mapping is self-asserted.
  optional bool verified = 2;

  // Slack workspace/team the user_id belongs to. Set when the mapping was
  // established via sign-in (a Slack user_id is only unique within a team).
  // Empty for self-asserted mappings.
  optional string team_id = 3;

  // How the mapping was established: "manual" (self-asserted selection) or
  // "slack_oauth" (verified sign-in). Empty is treated as "manual".
  optional string linked_via = 4;
}

message MsTeamsUser {
  string member_id = 1 [(buf.validate.field) = {
    string: {min_len: 1}
    required: true
  }];
}

message EmailUser {
  string user_email = 1 [(buf.validate.field) = {
    string: {
      min_len: 1
      email: true
    }
    required: true
  }];
}
