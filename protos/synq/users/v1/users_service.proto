syntax = "proto3";

package synq.users.v1;

import "buf/validate/validate.proto";
import "synq/users/v1/users.proto";
import "synq/v1/scope_authorization.proto";

option go_package = "github.com/getsynq/api/users/v1";

service UsersService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_USER_READ,
        SCOPE_MCP_READ
      ]
    };
  }

  rpc BatchGetUsers(BatchGetUsersRequest) returns (BatchGetUsersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_USER_READ]
    };
  }

  rpc GetByAlias(GetByAliasRequest) returns (GetByAliasResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_USER_READ]
    };
  }

  rpc GetByEmail(GetByEmailRequest) returns (GetByEmailResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_USER_READ,
        SCOPE_MCP_READ
      ]
    };
  }

  rpc UpsertUserAliases(UpsertUserAliasesRequest) returns (UpsertUserAliasesResponse) {
    option idempotency_level = IDEMPOTENT;
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_USER_EDIT]
    };
  }

  rpc DeleteUserAliases(DeleteUserAliasesRequest) returns (DeleteUserAliasesResponse) {
    option idempotency_level = IDEMPOTENT;
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_USER_EDIT]
    };
  }

  // Grants a role to a user in the workspace.
  // Granting a role the user already holds succeeds without change. Granting a
  // role to a user who is not a member of the workspace makes them a member;
  // such a user can only be named by their synq or email identity.
  rpc AddUserRole(AddUserRoleRequest) returns (AddUserRoleResponse) {
    option idempotency_level = IDEMPOTENT;
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_USER_EDIT]
    };
  }

  // Withdraws a role from a user in the workspace.
  // Withdrawing a role the user does not hold succeeds without change.
  // Withdrawing the user's last role removes them from the workspace, together
  // with their linked aliases.
  rpc RemoveUserRole(RemoveUserRoleRequest) returns (RemoveUserRoleResponse) {
    option idempotency_level = IDEMPOTENT;
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_USER_EDIT]
    };
  }

  rpc GetUserAliases(GetUserAliasesRequest) returns (GetUserAliasesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_USER_READ]
    };
  }

  // Returns all canonical identity strings for a user.
  // If user_id is omitted, returns identities for the currently authenticated user.
  // These identity strings can be passed to ListIssues(interacted_by_identities)
  // to filter issues the user has interacted with.
  // Format: "synq:<user_id>", "email:<email>", "slack:<slack_user_id>", "msteams:<member_id>", etc.
  rpc GetUserIdentities(GetUserIdentitiesRequest) returns (GetUserIdentitiesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_USER_READ,
        SCOPE_MCP_READ
      ]
    };
  }
}

message GetByEmailRequest {
  string email = 1 [(buf.validate.field).string.email = true];
}

message GetByEmailResponse {
  User user = 1;
}

message GetByAliasRequest {
  UserAlias alias = 1;
}

message GetByAliasResponse {
  User user = 1;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

message UpsertUserAliasesRequest {
  repeated UserAlias aliases = 1;
}

message UpsertUserAliasesResponse {}

message DeleteUserAliasesRequest {
  repeated UserAlias aliases = 1;
}

message DeleteUserAliasesResponse {}

message GetUserAliasesRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetUserAliasesResponse {
  repeated UserAlias aliases = 1;
}

message BatchGetUsersRequest {
  repeated string user_ids = 1;
}

message BatchGetUsersResponse {
  repeated User users = 1;
}

message AddUserRoleRequest {
  // One of the user's identities, as listed in User.identities or returned by
  // GetUserIdentities: "synq:<user_id>", "email:<email>", "slack:<slack_user_id>"
  // or "msteams:<member_id>".
  string identity = 1 [(buf.validate.field).string.min_len = 1];
  UserRole role = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message AddUserRoleResponse {
  // The user as stored after the call.
  User user = 1;
}

message RemoveUserRoleRequest {
  // One of the user's identities, as listed in User.identities or returned by
  // GetUserIdentities: "synq:<user_id>", "email:<email>", "slack:<slack_user_id>"
  // or "msteams:<member_id>".
  string identity = 1 [(buf.validate.field).string.min_len = 1];
  UserRole role = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message RemoveUserRoleResponse {
  // The user as stored after the call. Unset when the call removed the user
  // from the workspace, or the user was not a member.
  User user = 1;
}

message GetUserIdentitiesRequest {
  // User ID to resolve identities for. If omitted, uses the currently authenticated user.
  optional string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetUserIdentitiesResponse {
  // Canonical identity strings for the user.
  // Always includes "synq:<user_id>" and all linked aliases.
  repeated string identities = 1;
}
