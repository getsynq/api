syntax = "proto3";

package synq.users.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "synq/users/v1/users.proto";
import "synq/v1/scope_authorization.proto";

option go_package = "github.com/getsynq/api/users/v1";

service UsersService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/api/users/v1"};
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_USER_READ,
        SCOPE_MCP_READ
      ]
    };
  }

  rpc BatchGetUsers(BatchGetUsersRequest) returns (BatchGetUsersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      post: "/api/users/v1/batch-get"
      body: "*"
    };
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_USER_READ]
    };
  }

  rpc GetByAlias(GetByAliasRequest) returns (GetByAliasResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      post: "/api/users/v1/by-alias"
      body: "*"
    };
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_USER_READ]
    };
  }

  rpc GetByEmail(GetByEmailRequest) returns (GetByEmailResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/api/users/v1/by-email"};
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_USER_READ,
        SCOPE_MCP_READ
      ]
    };
  }

  // Links aliases to users.
  // A platform user alias needs SCOPE_PLATFORM_USER_LINK, every other alias type
  // SCOPE_USER_EDIT. A request holding an alias the caller may not write is
  // refused as a whole, and nothing is written.
  rpc UpsertUserAliases(UpsertUserAliasesRequest) returns (UpsertUserAliasesResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {
      put: "/api/users/v1/aliases"
      body: "*"
    };
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_USER_EDIT,
        SCOPE_PLATFORM_USER_LINK
      ]
    };
  }

  // Removes aliases from users.
  // A platform user alias removes only that login, every other alias type removes
  // the user's alias of that type. The scopes are checked per alias, as for
  // UpsertUserAliases.
  rpc DeleteUserAliases(DeleteUserAliasesRequest) returns (DeleteUserAliasesResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {
      post: "/api/users/v1/aliases/delete"
      body: "*"
    };
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_USER_EDIT,
        SCOPE_PLATFORM_USER_LINK
      ]
    };
  }

  // Grants a role to a user in the workspace.
  // Granting a role the user already holds succeeds without change. Granting a
  // role to a user who is not a member of the workspace makes them a member;
  // such a user can only be named by their synq or email identity.
  rpc AddUserRole(AddUserRoleRequest) returns (AddUserRoleResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {
      post: "/api/users/v1/roles"
      body: "*"
    };
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_USER_EDIT]
    };
  }

  // Withdraws a role from a user in the workspace.
  // Withdrawing a role the user does not hold succeeds without change.
  // Withdrawing the user's last role removes them from the workspace, together
  // with their linked aliases.
  rpc RemoveUserRole(RemoveUserRoleRequest) returns (RemoveUserRoleResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {
      post: "/api/users/v1/roles/remove"
      body: "*"
    };
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_USER_EDIT]
    };
  }

  // Sets the roles of up to 100 users in the workspace in one call.
  //
  // Each entry names a user and the full set of roles they hold after the call.
  // An "email:" identity of a person who is not a member adds them to the
  // workspace, and creates the user when the email has none, so roles can be
  // set before a person's first sign-in. No invitation email is sent. Members
  // that no entry names keep their roles; use RemoveUserRole to remove one.
  // The call does not keep an Admin in the workspace: an entry can demote the
  // last one.
  //
  // A person the call adds to the workspace has the status
  // USER_STATUS_SETUP_PENDING until their sign-in is set up, which takes a few
  // minutes for a large list. The response does not wait for it. Sending the
  // same list again starts the setup again for every listed user with the
  // status USER_STATUS_SETUP_PENDING or USER_STATUS_SETUP_FAILED.
  //
  // The call changes every listed user or none. It is refused with:
  // - INVALID_ARGUMENT: an unsupported identity prefix, two entries that name
  //   the same user, or an invalid email for a person who is not a member.
  // - NOT_FOUND: an identity other than "email:" that names no member.
  // - FAILED_PRECONDITION: an "email:" identity that matches several members;
  //   name the member by a "synq:" identity.
  // - PERMISSION_DENIED: the caller is not an Admin of the workspace, or would
  //   change their own roles.
  // - ABORTED: a listed user changed while the call ran. Send the same request
  //   again.
  rpc BatchSetUserRoles(BatchSetUserRolesRequest) returns (BatchSetUserRolesResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {
      post: "/api/users/v1/roles/batch-set"
      body: "*"
    };
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_USER_EDIT]
    };
  }

  rpc GetUserAliases(GetUserAliasesRequest) returns (GetUserAliasesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/api/users/v1/aliases"};
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_USER_READ]
    };
  }

  // Returns all canonical identity strings for a user.
  // If user_id is omitted, returns identities for the currently authenticated user.
  // These identity strings can be passed to ListIssues(interacted_by_identities)
  // to filter issues the user has interacted with.
  // Format: "synq:<user_id>", "email:<email>", "slack:<slack_user_id>", "msteams:<member_id>",
  // and the "platform_user:" id of every linked platform user.
  rpc GetUserIdentities(GetUserIdentitiesRequest) returns (GetUserIdentitiesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/api/users/v1/identities"};
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_USER_READ,
        SCOPE_MCP_READ
      ]
    };
  }
}

message GetByEmailRequest {
  string email = 1 [(buf.validate.field).string.email = true];
}

message GetByEmailResponse {
  User user = 1;
}

message GetByAliasRequest {
  UserAlias alias = 1;
}

message GetByAliasResponse {
  User user = 1;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

message UpsertUserAliasesRequest {
  repeated UserAlias aliases = 1;
}

message UpsertUserAliasesResponse {}

message DeleteUserAliasesRequest {
  repeated UserAlias aliases = 1;
}

message DeleteUserAliasesResponse {}

message GetUserAliasesRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetUserAliasesResponse {
  repeated UserAlias aliases = 1;
}

message BatchGetUsersRequest {
  repeated string user_ids = 1;
}

message BatchGetUsersResponse {
  repeated User users = 1;
}

message AddUserRoleRequest {
  // One of the user's identities, as listed in User.identities or returned by
  // GetUserIdentities: "synq:<user_id>", "email:<email>", "slack:<slack_user_id>"
  // or "msteams:<member_id>".
  string identity = 1 [(buf.validate.field).string.min_len = 1];
  UserRole role = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message AddUserRoleResponse {
  // The user as stored after the call.
  User user = 1;
}

message RemoveUserRoleRequest {
  // One of the user's identities, as listed in User.identities or returned by
  // GetUserIdentities: "synq:<user_id>", "email:<email>", "slack:<slack_user_id>"
  // or "msteams:<member_id>".
  string identity = 1 [(buf.validate.field).string.min_len = 1];
  UserRole role = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message RemoveUserRoleResponse {
  // The user as stored after the call. Unset when the call removed the user
  // from the workspace, or the user was not a member.
  User user = 1;
}

message BatchSetUserRolesRequest {
  // The users to set. Each user may appear only once.
  repeated UserRolesEntry users = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
  }];
  // When true, nothing is written and the response reports what the call
  // would do. A dry run reports every person who is not a member as
  // USER_ROLES_OUTCOME_ADDED_TO_WORKSPACE, with only the email and names the
  // entry lists.
  bool dry_run = 2;
}

message UserRolesEntry {
  // One of the user's identities, as listed in User.identities or returned by
  // GetUserIdentities: "synq:<user_id>", "email:<email>", "slack:<slack_user_id>"
  // or "msteams:<member_id>". Only an "email:" identity can name a person who
  // is not a member.
  string identity = 1 [(buf.validate.field).string.min_len = 1];
  // The full set of roles the user holds in the workspace after the call.
  repeated UserRole roles = 2 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
  // First name of a user the call creates. Ignored when the user exists.
  string first_name = 3 [(buf.validate.field).string.max_len = 255];
  // Last name of a user the call creates. Ignored when the user exists.
  string last_name = 4 [(buf.validate.field).string.max_len = 255];
}

message BatchSetUserRolesResponse {
  // One result for each entry of the request, in the same order.
  repeated UserRolesResult results = 1;
}

message UserRolesResult {
  // The identity of the request entry.
  string identity = 1;
  // The user after the call. In a dry run, a user who is not yet a member has
  // no id.
  User user = 2;
  UserRolesOutcome outcome = 3;
}

// UserRolesOutcome is what BatchSetUserRoles did, or in a dry run would do,
// for one user.
enum UserRolesOutcome {
  USER_ROLES_OUTCOME_UNSPECIFIED = 0;
  // The user was already a member with exactly these roles.
  USER_ROLES_OUTCOME_UNCHANGED = 1;
  // The user was a member, and their roles were replaced.
  USER_ROLES_OUTCOME_ROLES_CHANGED = 2;
  // The user existed and became a member.
  USER_ROLES_OUTCOME_ADDED_TO_WORKSPACE = 3;
  // No user had this email. The user was created and became a member.
  USER_ROLES_OUTCOME_USER_CREATED = 4;
}

message GetUserIdentitiesRequest {
  // User ID to resolve identities for. If omitted, uses the currently authenticated user.
  optional string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetUserIdentitiesResponse {
  // Canonical identity strings for the user.
  // Always includes "synq:<user_id>" and all linked aliases.
  repeated string identities = 1;
}
