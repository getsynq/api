syntax = "proto3";

package synq.ingest.cube.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "synq/ingest/git/v1/git_context.proto";
import "synq/v1/scope_authorization.proto";

option go_package = "github.com/getsynq/api/ingest/cube/v1";

// CubeService receives snapshots of a Cube deployment.
//
// A snapshot has the data model of the deployment, the SQL that Cube generates for its members,
// and what the caller knows about the deployment. Coalesce Quality builds one entity for each
// cube and each view from it, with the measures, the dimensions and the segments, the joins, and
// the lineage to the warehouse tables.
//
// The token of the call is the token of a Cube integration. One integration is one Cube
// deployment, so a snapshot does not name the deployment. A deployment that compiles another data
// model for each security context sends the other data models as `variants` of the snapshot.
service CubeService {
  // IngestSnapshot accepts one snapshot of a Cube deployment.
  //
  // A snapshot is the whole data model. It replaces the snapshot before it: a cube or a view
  // that is not in the snapshot is removed. Coalesce Quality does not merge a snapshot with the
  // snapshot before it, so send each part (the SQL, the data sources, the git repository) in
  // each snapshot.
  //
  // Send the complete snapshot in one request. Do not split a snapshot across calls.
  //
  // The call is safe to send again with the same request. A response means that Coalesce
  // Quality accepted the snapshot. The processing ends some time after the response.
  rpc IngestSnapshot(IngestSnapshotRequest) returns (IngestSnapshotResponse) {
    option idempotency_level = IDEMPOTENT;
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_INGEST_CUBE]
    };
  }
}

// IngestSnapshotRequest is one snapshot of a Cube deployment. It has three parts:
//
//   - The data model, as Cube returns it.
//   - The SQL that Cube generates for the members of the data model.
//   - What the caller knows about the deployment: its data sources and its git repository.
//
// Only `data_model` and `collected_at` are required. Each other part adds detail: without the SQL
// the cubes have no lineage to the warehouse tables.
//
// Read all parts from the same deployment, with the same security context.
message IngestSnapshotRequest {
  // The data model: the complete response body of `GET /cubejs-api/v1/meta?extended`, as Cube
  // returned it (JSON). It has the cubes and the views with their measures, dimensions, segments,
  // joins, hierarchies, folders and pre-aggregations.
  //
  // Do not send an error response or a part of a response. With a protobuf SDK, set the field to
  // the bytes of the response. In ProtoJSON, the value is these bytes in base64.
  bytes data_model = 1 [(buf.validate.field).bytes.min_len = 2];

  // The private cubes, views and members, and more settings: the complete response body of
  // `POST /v1/model-export` of the Cube Cloud Metadata API (JSON), for all cubes and all views.
  //
  // A Cube deployment in production returns only the public cubes, views and members in
  // `data_model`. This response has each of them, also those with `public: false`. Coalesce
  // Quality takes each cube, view and member that `data_model` has from `data_model`. It adds the
  // cubes, the views and the members that only this response has, with a mark that they are
  // private, and it adds the settings of this response.
  //
  // Send the SQL of the members that only this response has in `generated_sql` too, as for each
  // other member. Without it they have no lineage.
  //
  // Cube Core does not have this endpoint. Do not set the field if the response is not
  // available. The cubes, the views and the members are then those of `data_model` only.
  optional bytes model_export = 2 [(buf.validate.field).bytes.min_len = 2];

  // The SQL that Cube generates for the members, from `/cubejs-api/v1/sql`. Cube compiles a query
  // and does not run it. Coalesce Quality reads the lineage of each member from this SQL.
  //
  // Send each member in one entry only. A member that is in no entry and not in `member_errors`
  // has no lineage, and Coalesce Quality reports no error for it.
  repeated GeneratedSql generated_sql = 3;

  // The members for which Cube generated no SQL, each with the error text. Such a member has no
  // lineage. Do not send a member that is in `generated_sql`.
  repeated MemberError member_errors = 4;

  // What each data source of the deployment is. Coalesce Quality uses it to find the warehouse
  // that a data source reads, so the integration needs no setting for that data source. Send one
  // entry for each data source, with what the caller knows. Each name must be in the list one
  // time only.
  repeated DataSource data_sources = 5;

  // The git repository that holds the files of the data model. Coalesce Quality then links each
  // cube and each view to its file in the repository. Set `clone_url` with no user name and no
  // password in it. Do not set the field if the caller does not know the repository.
  optional synq.ingest.git.v1.GitContext git_context = 6;

  // The path of the directory of the data model, from the root of the repository (`model`). The
  // file name of a cube in the data model is relative to this directory. Use `/` between the
  // parts. An empty value means the root of the repository. Do not set the field if the caller
  // does not know the directory.
  optional string model_path = 7;

  // The time at which the caller started to read the snapshot from Cube. Coalesce Quality reads
  // a time in the future as the time at which it got the snapshot.
  google.protobuf.Timestamp collected_at = 8 [(buf.validate.field).required = true];

  // The version of Cube (`1.3.30`). Do not set the field if the caller does not know it.
  optional string cube_version = 9 [(buf.validate.field).string.min_len = 1];

  // A name for the security context of the token that read the snapshot (`full-read`). It only
  // describes the snapshot: Cube compiles one data model for each security context that changes
  // it, and the name says which data model this is. Never send a token or the security context
  // itself.
  optional string security_context_label = 10 [(buf.validate.field).string.min_len = 1];

  // The version of the tool that collected the snapshot.
  optional string uploader_version = 11 [(buf.validate.field).string.min_len = 1];

  // The build time of the tool that collected the snapshot, in RFC 3339 format
  // (`2026-01-31T10:00:00Z`).
  optional string uploader_build_time = 12 [(buf.validate.field).string.min_len = 1];

  // The data models of more security contexts, for a deployment that compiles another data model
  // for each security context (`context_to_app_id`). The fields above are the data model of the
  // default security context.
  //
  // Coalesce Quality compares each cube and each view of a variant with the default data model. A
  // cube or a view that differs becomes its own entity, with the label in its path. A cube or a
  // view that is equal adds nothing. Each label must be in the list one time only.
  repeated SnapshotVariant variants = 13 [(buf.validate.field).repeated.max_items = 50];

  option (buf.validate.message).cel = {
    id: "cube.variants_unique"
    message: "Each variant must have its own label"
    expression: "this.variants.map(v, v.label).unique()"
  };
}

// SnapshotVariant is the data model of a Cube deployment for one more security context.
message SnapshotVariant {
  // The name of the security context (`tenant_42`). It is a part of the path of each entity of the
  // variant, so send the same label in each snapshot. Never send the security context itself.
  string label = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50
    pattern: "^[A-Za-z0-9_-]+$"
  }];

  // The complete response body of `GET /cubejs-api/v1/meta?extended` for the security context of
  // the variant, as `data_model` of the snapshot.
  bytes data_model = 2 [(buf.validate.field).bytes.min_len = 2];

  // The complete response body of `POST /v1/model-export` for the security context of the variant,
  // as `model_export` of the snapshot. Send it if the snapshot has `model_export`: without it, the
  // private cubes and views of the variant are not compared.
  optional bytes model_export = 3 [(buf.validate.field).bytes.min_len = 2];

  // The SQL that Cube generates for the members of the cubes and the views of the variant that
  // differ from the default data model, as `generated_sql` of the snapshot. Coalesce Quality reads
  // no other entry.
  repeated GeneratedSql generated_sql = 4;

  // The members of the cubes and the views that differ and that have no SQL, as `member_errors` of
  // the snapshot.
  repeated MemberError member_errors = 5;
}

// GeneratedSql is the SQL statement that Cube generates for one query. The query can have one
// member or many members of one cube or of one view. The statement has one output column for
// each member.
//
// Put many members in one query: Cube then needs one request for all measures of a cube, and one
// request for all its dimensions. A segment is a filter and has no output column, so do not list
// it.
message GeneratedSql {
  // The SQL text in the dialect of the data source, from `sql.sql[0]` of the response. Send it as
  // Cube returned it, with its parameter marks.
  string sql = 1 [(buf.validate.field).string.min_len = 1];

  // The measures and the dimensions of the query, each with its output column. All of them are
  // members of one cube or of one view.
  repeated GeneratedSqlMember members = 2 [(buf.validate.field).repeated.min_items = 1];

  // The name of the data source that Cube runs the query on (`default`), from `sql.dataSource`.
  // It is the `name` of an entry of `data_sources`. Do not set the field if the response does
  // not have it.
  optional string data_source = 3 [(buf.validate.field).string.min_len = 1];

  // The value of `ungrouped` of the query. An ungrouped query reads the tables of the cube. A
  // grouped query can read a pre-aggregation table, and Coalesce Quality then reads no lineage
  // from it. Not set means that the caller does not know the value, and Coalesce Quality reads
  // the statement as a grouped one.
  optional bool ungrouped = 4;
}

// GeneratedSqlMember is one member of a query, and where its value is in the statement.
message GeneratedSqlMember {
  // The member with its cube or view, as the data model spells it (`orders.revenue`,
  // `orders_overview.revenue`).
  string member = 1 [(buf.validate.field).string.min_len = 1];

  // The name of the output column of the member in the statement (`orders__revenue`). It is the
  // key of the entry of `sql.aliasNameToMember` whose value is the member. Copy the key as it is.
  // Do not build it from the name of the member: a cube with `sql_alias` has another prefix. If
  // the response has no entry for the member, send the member in `member_errors`.
  string column = 2 [(buf.validate.field).string.min_len = 1];
}

// MemberError is a member for which the caller has no SQL.
message MemberError {
  // The member with its cube or view, as the data model spells it (`orders.revenue`).
  string member = 1 [(buf.validate.field).string.min_len = 1];

  // Why there is no SQL: the error text that Cube returned, or what the caller could not read.
  // Never send a token, a password or a key in the text.
  string error = 2 [(buf.validate.field).string.min_len = 1];
}

// DataSource says what one data source of the Cube deployment is: the database type and the
// database that it connects to. It never has a user name, a password or a key.
//
// The `CUBEJS_DB_*` variables in the comments are the variables of the data source `default`.
// Another data source has the same variables with its name in them (`CUBEJS_DS_<NAME>_DB_TYPE`).
message DataSource {
  // The name of the data source in Cube, as in `data_source` of a cube and in
  // `CUBEJS_DATASOURCES`. The data source that a cube with no `data_source` uses is `default`.
  string name = 1 [(buf.validate.field).string.min_len = 1];

  // The database type, as Cube spells it in `CUBEJS_DB_TYPE`: `snowflake`, `bigquery`,
  // `postgres`, `redshift`, `clickhouse`, `databricks-jdbc`, `mysql`, `mssql`, `athena`, `trino`,
  // `duckdb`. Another value is permitted, and Coalesce Quality ignores a type that it does not
  // know. Do not set the field if the caller does not know the type.
  optional string type = 2 [(buf.validate.field).string.min_len = 1];

  // The database that the data source connects to, the value of `CUBEJS_DB_NAME`
  // (`ANALYTICS`). A table name with no database in the SQL of Cube is in this database.
  optional string database = 3 [(buf.validate.field).string.min_len = 1];

  // The host of the database, the value of `CUBEJS_DB_HOST` (`db.example.com`), with no scheme
  // and no port. For Snowflake, the account, the value of `CUBEJS_DB_SNOWFLAKE_ACCOUNT`
  // (`xy12345.eu-west-1`).
  optional string host = 4 [(buf.validate.field).string.min_len = 1];

  // The Google Cloud project of a BigQuery data source, the value of `CUBEJS_DB_BQ_PROJECT_ID`.
  optional string project = 5 [(buf.validate.field).string.min_len = 1];
}

// IngestSnapshotResponse says that Coalesce Quality accepted the snapshot. It does not say that
// the processing of the snapshot ended.
message IngestSnapshotResponse {}
