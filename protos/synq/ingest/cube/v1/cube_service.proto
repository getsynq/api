syntax = "proto3";

package synq.ingest.cube.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "synq/v1/scope_authorization.proto";

option go_package = "github.com/getsynq/api/ingest/cube/v1";

// CubeService receives the data model of a Cube deployment.
//
// A snapshot is what two endpoints of the Cube REST API return, the same on Cube Core and on
// Cube Cloud. Coalesce Quality builds one entity for each cube and each view from it, with the
// measures, dimensions and segments, the joins, and the lineage to the warehouse tables.
//
// The token of the call is the token of a Cube integration. The integration names the
// deployment, so a snapshot does not.
service CubeService {
  // IngestSnapshot stores one snapshot of the data model of a Cube deployment. A snapshot holds
  // the whole data model: a cube or a view that is not in the newest snapshot is removed.
  rpc IngestSnapshot(IngestSnapshotRequest) returns (IngestSnapshotResponse) {
    option idempotency_level = IDEMPOTENT;
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_INGEST_CUBE]
    };
  }
}

message IngestSnapshotRequest {
  // The response body of `GET /cubejs-api/v1/meta?extended`, as Cube returned it (JSON). It is the
  // compiled data model: the cubes and the views with their measures, dimensions, segments,
  // joins, hierarchies, folders and pre-aggregations.
  bytes meta = 1 [(buf.validate.field).bytes.min_len = 2];

  // The SQL that Cube generates for each measure and each dimension, from `/cubejs-api/v1/sql`.
  // Cube compiles the query and does not run it.
  repeated MemberSql member_sql = 2;

  // The response body of `POST /v1/model-export` of the Cube Cloud Metadata API (JSON). Cube Core
  // does not have this endpoint.
  optional bytes model_export = 3;

  // The time at which the snapshot was read from Cube.
  google.protobuf.Timestamp collected_at = 4 [(buf.validate.field) = {
    timestamp: {
      lt_now: true
      gt: {seconds: 1640995200}
    }
    required: true
  }];

  // The version of Cube, if the caller knows it (`1.3.30`).
  optional string cube_version = 5;

  // A name for the security context of the token that read the snapshot (`full-read`). Never
  // the security context itself. Cube compiles one data model for each security context that
  // changes it, so the name says which one this is.
  optional string security_context_label = 6;

  // The version of the tool that collected the snapshot.
  string uploader_version = 7;
  // The build time of the tool that collected the snapshot.
  string uploader_build_time = 8;

  // What each data source of the deployment is. Optional. Coalesce Quality uses it to find the
  // warehouse that a data source reads, so the integration needs no setting for that data source.
  // Send one entry for each data source, with what the caller knows.
  repeated DataSource data_sources = 9;
}

// DataSource says what one data source of the Cube deployment is: the database type and the
// database that it connects to. It never has a user name, a password or a key.
message DataSource {
  // The name of the data source in Cube, as in `data_source` of a cube and in
  // `CUBEJS_DATASOURCES`. A deployment with one data source names it `default`.
  string name = 1 [(buf.validate.field).string.min_len = 1];

  // The database type, as Cube spells it in `CUBEJS_DB_TYPE`: `snowflake`, `bigquery`,
  // `postgres`, `redshift`, `clickhouse`, `databricks-jdbc`, `mysql`, `mssql`, `athena`, `trino`,
  // `duckdb`. Coalesce Quality ignores a type that it does not know.
  string type = 2;

  // The database that the data source connects to, the value of `CUBEJS_DB_NAME`
  // (`ANALYTICS`). A table name with no database in the SQL of Cube is in this database.
  optional string database = 3;

  // The host of the database, the value of `CUBEJS_DB_HOST` (`db.example.com`). For Snowflake,
  // the account, the value of `CUBEJS_DB_SNOWFLAKE_ACCOUNT` (`xy12345.eu-west-1`).
  optional string host = 4;

  // The Google Cloud project of a BigQuery data source, the value of `CUBEJS_DB_BQ_PROJECT_ID`.
  optional string project = 5;
}

// MemberSql is the SQL that Cube generates for a query of one member.
message MemberSql {
  // The member with its cube or view (`orders.revenue`, `orders_overview.revenue`).
  string member = 1 [(buf.validate.field).string.min_len = 1];

  // The data source that Cube runs the query on (`default`), from `sql.dataSource`.
  optional string data_source = 2;

  // The SQL text, in the dialect of the data source, from `sql.sql[0]`.
  optional string sql = 3;

  // The error text, if Cube did not generate SQL for the member.
  optional string error = 4;

  // True if the query had `"ungrouped": true`. An ungrouped query reads the tables of the cube.
  // A grouped query can read a pre-aggregation table.
  bool ungrouped = 5;
}

message IngestSnapshotResponse {}
