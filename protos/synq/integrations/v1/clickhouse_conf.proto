syntax = "proto3";

package synq.integrations.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/getsynq/api/integrations/v1";

// ClickHouse cloud-managed connection.
//
// Fields are optional so an update can carry only what changes (omit = leave
// unchanged). Secret fields are write-only (masked on reads); omit to keep or
// send a new value to rotate.
message ClickhouseCloudConf {
  // Host address or IP.
  optional string host = 1 [(buf.validate.field).string.min_len = 1];
  // Port (e.g. "8123" for HTTP, "9440" for HTTPS).
  optional string port = 2;
  // Username.
  optional string username = 3;
  // Password. Write-only — masked on reads.
  optional string password = 4;
  // Database the connection opens with, so unqualified table names in a query
  // resolve against it. It is not a scrape filter: metadata is read from system
  // tables and covers every database the credentials can see, whatever this says.
  optional string default_dataset = 5;
  // Additional connection parameters as key/value pairs (e.g.
  // "max_execution_time": "30").
  map<string, string> additional_parameters = 6;
  // Enable SSL/TLS.
  optional bool ssl = 7;
  // Name this ClickHouse is published under, and the top element of every path
  // and breadcrumb its tables appear in — `prod`, `staging`, `eu-analytics`.
  // ClickHouse has no container above a database, so something has to name the
  // service; left empty that is the connection host, which is correct but
  // unreadable for a ClickHouse Cloud endpoint. It is not a database and does not
  // restrict what is scraped. Changing it republishes every table under new
  // paths, so pick one per service and keep it.
  optional string database_name = 8;
  // Ingest query logs from system.query_log.
  optional bool fetch_query_logs = 9;
  // Fully-qualified table for storing SQL test audit logs.
  optional string audit_table_fqn = 10;
  // How ClickHouse system tables are read. Omit to keep reading across a cluster
  // named "default", which every ClickHouse Cloud service provides.
  optional ClickhouseClusterConf cluster = 11;
}

// How metadata reads address ClickHouse system tables.
//
// System tables are per-node, so on a service with more than one replica a plain
// read reflects whichever replica answered rather than the whole warehouse.
message ClickhouseClusterConf {
  ClickhouseClusterMode mode = 1;
  // Cluster to read through, as named under remote_servers in the ClickHouse
  // configuration. `SELECT DISTINCT cluster FROM system.clusters` lists what a
  // server has. Empty means "default". Ignored in single-node mode.
  string name = 2 [(buf.validate.field).string = {
    max_len: 256
    pattern: "^([A-Za-z_][A-Za-z0-9_.\\-]*)?$"
  }];
}

enum ClickhouseClusterMode {
  // Treated as CLICKHOUSE_CLUSTER_MODE_ALL_REPLICAS. Reading across a cluster is
  // the behaviour of an integration that has never set this, so single-node
  // reads have to be asked for rather than inherited from an unset field.
  CLICKHOUSE_CLUSTER_MODE_UNSPECIFIED = 0;
  // Read system tables across the named cluster, so metadata covers every
  // replica. Requires `GRANT REMOTE ON *.*`.
  CLICKHOUSE_CLUSTER_MODE_ALL_REPLICAS = 1;
  // Read system tables on the connected node only. The one option that works on
  // a ClickHouse whose remote_servers defines no cluster, and it needs no REMOTE
  // grant — but on a service that does have replicas it reports the metadata of
  // a single node.
  CLICKHOUSE_CLUSTER_MODE_SINGLE_NODE = 2;
}
