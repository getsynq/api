syntax = "proto3";

package synq.entities.typedefs.v1;

import "google/api/annotations.proto";
import "synq/entities/typedefs/v1/type_defs.proto";
import "synq/v1/scope_authorization.proto";

option go_package = "github.com/getsynq/api/entities/typedefs/v1";

// TypeDefsService tells you what the type values in every other endpoint mean.
//
// Responses across the API describe things by enum — an entity is an
// `ENTITY_TYPE_BQ_TABLE`, it belongs to `DATA_PLATFORM_TYPE_BIGQUERY`, a run is an
// `EXECUTION_TYPE_DBT_INVOCATION`. This service turns each of those into a name you
// can display and a set of facts you can act on: is this a transformation model,
// does it live in a warehouse, can it be monitored.
//
// Read it instead of keeping your own copy of the list. New entity types and new
// platforms are added as Coalesce Quality supports more tools, and a hard-coded
// table in your code will label them with whatever its fallback produces and miss
// that an existing type gained a capability. Everything here comes from the server,
// so you pick both up without changing your code.
//
// A typical integration calls all three once at startup, keeps them in a map, and
// looks types up as responses arrive.
//
// Scoping and freshness:
//
//   * ListEntityTypeDefs is per workspace, because the types you defined yourself
//     are part of your workspace's vocabulary. It returns the built-in types and
//     your own custom types together.
//   * ListPlatformDefs and ListExecutionTypeDefs are the same for everyone.
//   * The built-in half changes only when Coalesce Quality is upgraded, so caching
//     it for the life of your process is fine. You can add or edit your own custom
//     types at any time, so if a newly created type needs to appear promptly, cache
//     the entity types for minutes rather than hours, or re-read after you change
//     one.
//
// The workspace comes from your credentials; there is nothing to pass.
//
// Each list is small — hundreds of entries — so every call returns the whole set
// and none of them page.
service TypeDefsService {
  // List every kind of entity in your workspace, the built-in types and your own.
  //
  // The built-in half covers every value of `synq.entities.v1.EntityType` this
  // server serves, so this is also how you discover a type that your generated code
  // is too old to name. Your own types have no enum value of their own — each one
  // is identified by its `type_id`.
  rpc ListEntityTypeDefs(ListEntityTypeDefsRequest) returns (ListEntityTypeDefsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_ENTITY_READ,
        SCOPE_ENTITY_TYPE_READ,
        SCOPE_SRE_AGENT
      ]
    };
    option (google.api.http) = {
      post: "/api/entities/typedefs/v1/entity-types/list"
      body: "*"
    };
  }

  // List every platform Coalesce Quality connects to, with its display name.
  //
  // Use it to name the platform on an entity — "BigQuery", "Microsoft SQL Server" —
  // rather than deriving a name from the enum value.
  rpc ListPlatformDefs(ListPlatformDefsRequest) returns (ListPlatformDefsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_ENTITY_READ,
        SCOPE_ENTITY_TYPE_READ,
        SCOPE_SRE_AGENT
      ]
    };
    option (google.api.http) = {
      post: "/api/entities/typedefs/v1/platforms/list"
      body: "*"
    };
  }

  // List every kind of run Coalesce Quality records against an entity.
  //
  // A dbt invocation, a warehouse query job, a detected schema change. Use it to
  // name the `execution_type` that execution and run endpoints return.
  rpc ListExecutionTypeDefs(ListExecutionTypeDefsRequest) returns (ListExecutionTypeDefsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_ENTITY_READ,
        SCOPE_ENTITY_TYPE_READ,
        SCOPE_SRE_AGENT
      ]
    };
    option (google.api.http) = {
      post: "/api/entities/typedefs/v1/execution-types/list"
      body: "*"
    };
  }
}

message ListEntityTypeDefsRequest {}

message ListEntityTypeDefsResponse {
  // Every entity type in your workspace, built-in and your own, ordered by entity
  // type value. Your own types sort together after the built-in ones, and two calls
  // against an unchanged workspace return the same order.
  repeated EntityTypeDef entity_type_defs = 1;
}

message ListPlatformDefsRequest {}

message ListPlatformDefsResponse {
  // Every platform, ordered by platform value.
  repeated PlatformDef platform_defs = 1;
}

message ListExecutionTypeDefsRequest {}

message ListExecutionTypeDefsResponse {
  // Every kind of run, ordered by execution type value.
  repeated ExecutionTypeDef execution_type_defs = 1;
}
