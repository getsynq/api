syntax = "proto3";

package synq.entities.orchestration.v1;

import "google/api/annotations.proto";
import "synq/entities/orchestration/v1/orchestration.proto";
import "synq/entities/v1/identifier.proto";
import "synq/v1/scope_authorization.proto";

option go_package = "github.com/getsynq/api/entities/orchestration/v1";

// OrchestrationService tells which jobs, job steps and tasks run an entity, and which entities a
// job, job step or task runs, from the runs of the last 31 days. It covers Airflow tasks and DAGs,
// dbt Cloud job steps and Coalesce jobs.
service OrchestrationService {
  // BatchOrchestration returns, for each requested entity, the jobs, job steps and tasks that ran it
  // in the last 31 days (upstream), and the entities it ran (downstream).
  rpc BatchOrchestration(BatchOrchestrationRequest) returns (BatchOrchestrationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_LINEAGE_READ,
        SCOPE_SRE_AGENT,
        SCOPE_MCP_READ
      ]
    };
    option (google.api.http) = {get: "/api/orchestration/v1"};
  }
}

message BatchOrchestrationRequest {
  // Entities to query for orchestration relationships (e.g., Airflow tasks, dbt Cloud job steps, Coalesce jobs, dbt models, tables)
  repeated entities.v1.Identifier entities = 1;
}

message BatchOrchestrationResponse {
  // Orchestration relationships for each requested entity, in the order of the request.
  // An entity requested twice is answered once, and an entity the workspace does not hold is left out.
  repeated Orchestration orchestrations = 1;
}
