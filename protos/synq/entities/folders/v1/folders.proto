syntax = "proto3";

package synq.entities.folders.v1;

import "synq/entities/v1/entity_types.proto";
import "synq/platforms/v1/data_platform_types.proto";

option go_package = "github.com/getsynq/api/entities/folders/v1";

// FolderRef is the human-friendly, structured address of a folder: the entity it
// hangs under (`root_entity_id`) plus the ordered folder names from that root
// down to the folder (`folders`).
//
// It is the stable way to name a folder across responses. Prefer it over the
// opaque `Folder.folder_entity_id` when you want to log, display, or reconstruct
// a location — the segments are the same names a user sees in the catalog, and
// they survive changes to the underlying id encoding.
//
// A `FolderRef` with an empty `folders` list names the root entity itself (a
// top-level integration or container the hierarchy hangs from).
message FolderRef {
  // Opaque id of the entity the folder hierarchy hangs under — an integration
  // root or container (for example a warehouse instance, a database, or a
  // transformation project). Take it verbatim from `FolderRef.root_entity_id`
  // of a folder you already read, or from an entity id returned elsewhere.
  string root_entity_id = 1;

  // Ordered folder names from the root down to this folder (root first, leaf
  // last), for example ["staging", "sales"]. Empty means the ref points at the
  // root entity itself. Folder names are kept as separate segments (not joined
  // with "/") because some platforms allow "/" inside a single folder name.
  repeated string folders = 2;
}

// FolderRole describes how a folder placement participates in browsing. It
// mirrors the placement roles carried by the catalog.
enum FolderRole {
  // Unknown / not reported. Treat as VISIBLE.
  FOLDER_ROLE_UNSPECIFIED = 0;
  // Browsable and the default display location (breadcrumb) for its members.
  FOLDER_ROLE_PRIMARY = 1;
  // Browsable, but not the default display location.
  FOLDER_ROLE_VISIBLE = 2;
  // Match-only: folder filters still match entities through this placement, but
  // it is not shown when browsing. Kept for legacy hierarchies.
  FOLDER_ROLE_HIDDEN = 3;
}

// Folder is one node in the folder / containment hierarchy: an integration root,
// a container (database, schema, project), or a nested folder. Members that are
// not themselves folders (tables, models, …) are returned as entity ids, not as
// `Folder`s.
message Folder {
  // Opaque, authoritative id of this folder. Round-trip it verbatim as the
  // `parent` of `Browse` or the `folder` of `ListMembers`; do not parse it. It
  // is the canonical handle for a folder — always prefer it over rebuilding a
  // location from `ref` when calling back in.
  string folder_entity_id = 1;

  // Structured, human-friendly address of this folder. Populated when it can be
  // derived from the surrounding hierarchy (always for `GetFolderOf`, and for
  // `Browse` when the parent location is known). When it cannot be derived,
  // `folder_entity_id` remains the authoritative handle.
  FolderRef ref = 2;

  // Display name of this folder (its own leaf name, e.g. "sales").
  string name = 3;

  // Full display path from the root down to this folder (root first, leaf last),
  // e.g. ["clickhouse-prod", "default", "sales"]. Suitable for rendering a
  // breadcrumb.
  repeated string full_name = 4;

  // Entity type of this node. Folders synthesized purely for grouping report an
  // unspecified type; container entities that also act as folders (databases,
  // schemas, projects) report their real type.
  synq.entities.v1.EntityType type = 5;

  // Platform this folder belongs to, when known.
  synq.platforms.v1.DataPlatformType platform = 6;

  // Number of direct sub-folders. Best-effort: it may be reported as a collapsed
  // count for lazily-loaded folders and can be 0 when the count was not loaded.
  uint32 child_folder_count = 7;

  // Number of direct, non-folder members (entities that sit directly in this
  // folder). Best-effort and may be 0 when not loaded.
  uint32 member_count = 8;

  // How this folder participates in browsing.
  FolderRole role = 9;
}
