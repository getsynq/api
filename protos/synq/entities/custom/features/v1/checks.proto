syntax = "proto3";

package synq.entities.custom.features.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/getsynq/api/entities/custom/features/v1";

// Checks feature indicates that the entity is testing in some way different entity.
// To define the kind of the check use the `kind` field. The `package` field is optional.
// It is used to categorize the entities which check other entities.
message CheckCategory {
  // Grouping of check kinds. e.g. "gcs", "sql", "queue"
  string package = 1 [(buf.validate.field) = {
    required: false
    string: {max_len: 50}
  }];
  // Kind of the check. e.g "not_null", "unique", "foreign_key", "row_count".
  string kind = 2 [(buf.validate.field) = {
    required: true
    string: {max_len: 50}
  }];
  // Explicit technical category of the check — what kind of check this is,
  // mechanically (e.g. "nullness", "uniqueness", "freshness"), so the same
  // check expressed on another platform shares one category.
  //
  // Presence is meaningful on update: omit the field to leave the current
  // value untouched, send an empty string to clear it, send a non-empty
  // string to set or replace it. Leaving it unset means the check is
  // uncategorised for this dimension and the workspace's categorisation
  // rules decide it from package + kind; the `quality.check_category`
  // annotation on the entity is read as the lower-precedence fallback.
  optional string category = 3 [(buf.validate.field) = {
    required: false
    string: {max_len: 50}
  }];
  // Explicit governance category of the check — what the check is for, the
  // data-quality dimension a governance function tracks coverage against
  // (e.g. "Completeness", "Accuracy", "Timeliness").
  //
  // Resolves independently of `category` and follows the same presence
  // semantics: omitted leaves it unchanged, empty clears it, non-empty sets
  // it. Unset means uncategorised for this dimension; the
  // `quality.governance_category` annotation on the entity is the
  // lower-precedence fallback.
  optional string governance_category = 4 [(buf.validate.field) = {
    required: false
    string: {max_len: 50}
  }];
}
