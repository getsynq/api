syntax = "proto3";

package synq.entities.custom.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "synq/entities/custom/v1/relationships_service.proto";
import "synq/entities/v1/identifier.proto";
import "synq/v1/pagination.proto";
import "synq/v1/scope_authorization.proto";

option go_package = "github.com/getsynq/api/entities/custom/v1";

service ChecksRelationshipsService {
  // Create or update relationships that attach a check (e.g. a SQL test) to the
  // entities it validates. Idempotent per (check, checked) pair: an existing
  // relationship is updated, otherwise it is created.
  //
  // The response reports what each requested relationship did, and under which
  // (check, checked) pair of entities it was stored.
  rpc UpsertCheckRelationships(UpsertCheckRelationshipsRequest) returns (UpsertCheckRelationshipsResponse) {
    option idempotency_level = IDEMPOTENT;
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_ENTITY_EDIT]
    };
    option (google.api.http) = {
      post: "/api/entities/custom/v1/check-relationships"
      body: "*"
    };
  }

  // Delete relationships between checks and the entities they validate.
  // Relationships that do not exist are ignored.
  //
  // The response says which of them actually removed something.
  rpc DeleteCheckRelationships(DeleteCheckRelationshipsRequest) returns (DeleteCheckRelationshipsResponse) {
    option idempotency_level = IDEMPOTENT;
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_ENTITY_EDIT]
    };
    option (google.api.http) = {
      delete: "/api/entities/custom/v1/check-relationships"
      body: "*"
    };
  }

  // List every relationship that attaches a check to the entities it
  // validates, across the whole workspace.
  rpc ListCheckRelationships(ListCheckRelationshipsRequest) returns (ListCheckRelationshipsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_ENTITY_READ,
        SCOPE_SRE_AGENT,
        SCOPE_MCP_READ
      ]
    };
    option (google.api.http) = {
      post: "/api/entities/custom/v1/check-relationships/list"
      body: "*"
    };
  }
}

message UpsertCheckRelationshipsRequest {
  repeated CheckRelationship check_relationships = 1 [(buf.validate.field).required = true];
}

message UpsertCheckRelationshipsResponse {
  // One result per check relationship in the request, in request order.
  repeated CheckRelationshipWriteResult results = 1;
}

message DeleteCheckRelationshipsRequest {
  repeated CheckRelationship check_relationships = 1 [(buf.validate.field).required = true];
}

message DeleteCheckRelationshipsResponse {
  // One result per check relationship in the request, in request order.
  repeated CheckRelationshipWriteResult results = 1;
}

// CheckRelationshipWriteResult reports what one requested check relationship
// did to the stored graph.
message CheckRelationshipWriteResult {
  // The check relationship this result answers for, as sent, with `entity_id`
  // filled in on both endpoints.
  //
  // The pair of entities the endpoints resolve to is what the relationship is
  // held under, so compare these two ids rather than the identifiers you sent
  // to tell whether two of them are the same relationship. `checked_columns`
  // is part of the payload, not of that pair: restating the same pair with a
  // different column list replaces the stored one.
  CheckRelationship check_relationship = 1;

  // What the write did to that relationship.
  RelationshipWriteOutcome outcome = 2;
}

message ListCheckRelationshipsRequest {
  // Pagination. Omitting this, or sending a zero page_size, returns every
  // check relationship in one response — there is no server-side default page
  // size. Set page_size to bound the response; pass page_info.last_id from the
  // previous response as the cursor to fetch the next page.
  optional synq.v1.Pagination pagination = 1;
}

message ListCheckRelationshipsResponse {
  repeated CheckRelationship check_relationships = 1;

  // Paging information for this response. Always populated. Repeat the request
  // passing page_info.last_id as pagination.cursor until last_id comes back
  // empty to walk the whole workspace.
  synq.v1.PageInfo page_info = 2;
}

message CheckRelationship {
  synq.entities.v1.Identifier check = 1 [(buf.validate.field).required = true];
  synq.entities.v1.Identifier checked = 2 [(buf.validate.field).required = true];
  repeated string checked_columns = 3;
}
