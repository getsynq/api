syntax = "proto3";

package synq.entities.custom.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "synq/entities/v1/type.proto";
import "synq/v1/pagination.proto";
import "synq/v1/scope_authorization.proto";

option go_package = "github.com/getsynq/api/entities/custom/v1";

// TypesService is a service for managing custom entity types.
service TypesService {
  // Create or update a custom entity type. A type is identified by its `type_id`
  // in the workspace: an existing type with the same id and name is replaced,
  // otherwise a new one is created. Upserting a deleted type restores it, under
  // any name. If a live type already uses the `type_id` under another name, the
  // call fails with `ALREADY_EXISTS` and the type is left unchanged, unless
  // `allow_rename` is set.
  rpc UpsertType(UpsertTypeRequest) returns (UpsertTypeResponse) {
    option idempotency_level = IDEMPOTENT;
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_ENTITY_TYPE_EDIT]
    };
    option (google.api.http) = {
      post: "/api/entities/custom/v1/types"
      body: "*"
    };
  }

  // Delete a custom entity type by its `type_id`. The request is refused while an
  // entity still uses the type. Deleting a type that does not exist succeeds.
  rpc DeleteType(DeleteTypeRequest) returns (DeleteTypeResponse) {
    option idempotency_level = IDEMPOTENT;
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_ENTITY_TYPE_EDIT]
    };
    option (google.api.http) = {
      delete: "/api/entities/custom/v1/types"
      body: "*"
    };
  }

  // List the custom entity types of the workspace.
  rpc ListTypes(ListTypesRequest) returns (ListTypesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_ENTITY_READ,
        SCOPE_ENTITY_TYPE_READ,
        SCOPE_SRE_AGENT
      ]
    };
    option (google.api.http) = {
      post: "/api/entities/custom/v1/types/list"
      body: "*"
    };
  }
}

message UpsertTypeRequest {
  // Custom entity type to create or update.
  synq.entities.v1.Type type = 1 [(buf.validate.field).required = true];
  // Rename a live type that uses the same `type_id` under another name, instead
  // of failing with `ALREADY_EXISTS`. Set it only for a type you own: the
  // check is what stops two integrations that picked the same `type_id` from
  // overwriting each other.
  bool allow_rename = 2;
}
message UpsertTypeResponse {}

message DeleteTypeRequest {
  // Identifier of the custom entity type to delete.
  int32 type_id = 2 [(buf.validate.field) = {
    required: true
    int32: {
      gte: 1
      lte: 1000
    }
  }];
}
message DeleteTypeResponse {}

message ListTypesRequest {
  // Pagination. Omitting this, or sending a zero page_size, returns every type
  // in one response — there is no server-side default page size. Set page_size
  // to bound the response; pass page_info.last_id from the previous response as
  // the cursor to fetch the next page.
  optional synq.v1.Pagination pagination = 1;
}
message ListTypesResponse {
  // Custom entity types.
  repeated synq.entities.v1.Type types = 1;

  // Paging information for this response. Always populated. Repeat the request
  // passing page_info.last_id as pagination.cursor until last_id comes back
  // empty to walk the whole workspace.
  synq.v1.PageInfo page_info = 2;
}
