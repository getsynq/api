syntax = "proto3";

package synq.entities.custom.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "synq/entities/v1/identifier.proto";
import "synq/v1/pagination.proto";
import "synq/v1/scope_authorization.proto";

option go_package = "github.com/getsynq/api/entities/custom/v1";

// RelationshipsService allow management of relationships between entities. Relationships can
// be created, updated, and deleted between 2 custom entities, or between a custom entity and Coalesce Quality native entity.enum
// There is no option to create relationships between 2 Coalesce Quality native entities (dbt model, BI dashboard, etc.).
service RelationshipsService {
  // Create or update relationships between entities. If the relationship already exists, it will be updated, otherwise it will be created.
  //
  // The response reports what each requested relationship did to the stored
  // graph, and under which pair of entities it was stored. Read it: a
  // relationship whose endpoints resolve to a pair another relationship in the
  // same batch also resolves to is one edge, and only the last write to it
  // survives.
  rpc UpsertRelationships(UpsertRelationshipsRequest) returns (UpsertRelationshipsResponse) {
    option idempotency_level = IDEMPOTENT;
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_LINEAGE_EDIT]
    };
    option (google.api.http) = {
      post: "/api/entities/custom/v1/relationships"
      body: "*"
    };
  }

  // Delete relationships between entities. If the relationship does not exist, it will be ignored.
  //
  // The response says which of them actually removed something, so a caller
  // reconciling a set of edges can tell a withdrawal from a no-op.
  rpc DeleteRelationships(DeleteRelationshipsRequest) returns (DeleteRelationshipsResponse) {
    option idempotency_level = IDEMPOTENT;
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_LINEAGE_EDIT]
    };
    option (google.api.http) = {
      delete: "/api/entities/custom/v1/relationships"
      body: "*"
    };
  }

  // List relationships touching the given entities, or every relationship in
  // the workspace when ids is left empty.
  rpc ListRelationships(ListRelationshipsRequest) returns (ListRelationshipsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_LINEAGE_READ,
        SCOPE_SRE_AGENT,
        SCOPE_MCP_READ
      ]
    };
    option (google.api.http) = {
      post: "/api/entities/custom/v1/relationships/list"
      body: "*"
    };
  }
}

message UpsertRelationshipsRequest {
  repeated Relationship relationships = 1 [(buf.validate.field).required = true];
}

message UpsertRelationshipsResponse {
  // One result per relationship in the request, in request order.
  repeated RelationshipWriteResult results = 1;
}

message DeleteRelationshipsRequest {
  repeated Relationship relationships = 1 [(buf.validate.field).required = true];
}

message DeleteRelationshipsResponse {
  // One result per relationship in the request, in request order.
  repeated RelationshipWriteResult results = 1;
}

// RelationshipWriteResult reports what one requested relationship did to the
// stored graph.
message RelationshipWriteResult {
  // The relationship this result answers for, as sent, with `entity_id` filled
  // in on both endpoints.
  //
  // An edge is held between the two entities the endpoints resolve to, not
  // between the identifiers as written, and one entity accepts several
  // spellings — a warehouse name that differs only in case or punctuation
  // usually names the same table. So compare these two ids, rather than the
  // identifiers you sent, to tell whether two relationships are the same edge.
  Relationship relationship = 1;

  // What the write did to that edge.
  RelationshipWriteOutcome outcome = 2;
}

// RelationshipWriteOutcome is the effect one requested write had.
enum RelationshipWriteOutcome {
  RELATIONSHIP_WRITE_OUTCOME_UNSPECIFIED = 0;

  // Nothing joined these two entities; the relationship was created.
  RELATIONSHIP_WRITE_OUTCOME_CREATED = 1;

  // The two entities were already joined; the relationship was replaced.
  RELATIONSHIP_WRITE_OUTCOME_UPDATED = 2;

  // The relationship existed and has been removed.
  RELATIONSHIP_WRITE_OUTCOME_DELETED = 3;

  // Nothing joined these two entities, so the delete removed nothing.
  RELATIONSHIP_WRITE_OUTCOME_NOT_FOUND = 4;
}

message Relationship {
  synq.entities.v1.Identifier upstream = 1 [(buf.validate.field).required = true];
  synq.entities.v1.Identifier downstream = 2 [(buf.validate.field).required = true];
}

message ListRelationshipsRequest {
  // Return relationships for the given entity_id. Either upstream or downstream.
  // Leave empty to return every relationship in the workspace: an edge hangs
  // off endpoints a caller may not know up front, so enumerating them by id
  // requires already knowing every entity an edge can touch.
  repeated synq.entities.v1.Identifier ids = 1;

  // Pagination. Omitting this, or sending a zero page_size, returns every
  // matching relationship in one response — there is no server-side default
  // page size. Set page_size to bound the response; pass page_info.last_id from
  // the previous response as the cursor to fetch the next page.
  optional synq.v1.Pagination pagination = 2;
}

message ListRelationshipsResponse {
  repeated Relationship relationships = 1;

  // Paging information for this response. Always populated. Repeat the request
  // passing page_info.last_id as pagination.cursor until last_id comes back
  // empty to walk the whole result set.
  synq.v1.PageInfo page_info = 2;
}
