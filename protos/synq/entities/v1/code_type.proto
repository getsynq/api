syntax = "proto3";
package synq.entities.v1;

option go_package = "github.com/getsynq/api/entities/v1";

// CodeType describes how to read the body of a Code — which language or
// format its `content` is written in, so a client can highlight, parse or
// hand it to the right tool.
//
// A producer that cannot tell leaves CODE_TYPE_UNSPECIFIED rather than
// guessing; treat that as plain text.
enum CodeType {
  CODE_TYPE_UNSPECIFIED = 0;
  // SQL code (e.g., SELECT, INSERT, UPDATE statements)
  CODE_TYPE_SQL = 1;
  // Python code (e.g., scripts, functions, classes)
  CODE_TYPE_PYTHON = 2;
  // JSON data or configuration files
  CODE_TYPE_JSON = 3;
  // YAML configuration or data files
  CODE_TYPE_YAML = 4;
  // dbt (data build tool) models and configurations
  CODE_TYPE_DBT = 5;
  // SQLMesh models and configurations. In most cases this will be similar to SQL code.
  CODE_TYPE_SQLMESH = 6;
  // LookML (Looker Modeling Language) files
  CODE_TYPE_LOOKML = 7;
  // JavaScript, as used for the body of a Snowflake stored procedure or
  // user-defined function declared LANGUAGE JAVASCRIPT.
  CODE_TYPE_JAVASCRIPT = 8;
  // Shell script, as used by an orchestrator task that shells out instead of
  // running SQL or Python.
  CODE_TYPE_BASH = 9;
  // DAX, the expression language behind Power BI measures and calculated
  // columns.
  CODE_TYPE_DAX = 10;
  // Java source, as used for the body of a Snowflake routine declared
  // LANGUAGE JAVA.
  CODE_TYPE_JAVA = 11;
  // Scala source, as used for the body of a Snowflake routine declared
  // LANGUAGE SCALA.
  CODE_TYPE_SCALA = 12;
  // Plain text with no known syntax. Distinct from CODE_TYPE_UNSPECIFIED:
  // this is a producer stating the body has no language, rather than a
  // producer that could not tell.
  CODE_TYPE_TEXT = 13;
  // Markdown, as used by a notebook cell or a documentation block that ships
  // beside a model.
  CODE_TYPE_MARKDOWN = 14;
}
