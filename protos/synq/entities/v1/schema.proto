syntax = "proto3";

package synq.entities.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "synq/entities/v1/identifier.proto";
import "synq/entities/v1/numeric_category.proto";
import "synq/entities/v1/schema_tag_kind.proto";

option go_package = "github.com/getsynq/api/entities/v1";

message SchemaColumnField {
  // Human readable name of the column as present in dbt or data warehouse.
  string name = 1 [(buf.validate.field) = {
    required: true
    string: {
      min_len: 1
      max_len: 255
    }
  }];
  // Native data type of the column as present in data warehouse.
  string native_type = 2 [(buf.validate.field) = {
    string: {max_len: 255}
  }];
  // Description of the column
  string description = 3 [(buf.validate.field) = {
    string: {max_len: 1000}
  }];
  // Ordinal position of the column in the struct, starting from 1
  int32 ordinal_position = 4 [(buf.validate.field) = {
    int32: {
      gte: 0
      lte: 1001
    }
  }];
  // Indicates that the field type could be used as a struct/json in a data warehouse
  bool is_struct = 5;
  // Indicates that the field is a repeated field in a data warehouse (e.g. array)
  bool is_repeated = 6;
  // Fields inside of the struct/record like field
  repeated SchemaColumnField fields = 7 [(buf.validate.field) = {
    repeated: {max_items: 100}
  }];
}

// SchemaTag is a tag or label the data warehouse assigns to a table or a column.
// Its kind says which of the platform's tags it is, and the name is the
// platform's own.
message SchemaTag {
  // Name of the tag, in the form its kind describes.
  string tag_name = 1 [(buf.validate.field) = {
    required: true
    string: {
      min_len: 1
      max_len: 512
    }
  }];
  // Value of the tag, empty for a tag that carries none.
  string tag_value = 2 [(buf.validate.field) = {
    string: {max_len: 1000}
  }];
  // What the data warehouse means by the tag.
  SchemaTagKind kind = 3;
}

message SchemaColumn {
  // Human readable name of the column as present in dbt or data warehouse.
  string name = 1 [(buf.validate.field) = {
    required: true
    string: {
      min_len: 1
      max_len: 255
    }
  }];
  // Native data type of the column as present in data warehouse.
  string native_type = 2 [(buf.validate.field) = {
    string: {max_len: 255}
  }];
  // Description of the column
  string description = 3 [(buf.validate.field) = {
    string: {max_len: 1000}
  }];
  // Ordinal position of the column in the table, starting from 1
  int32 ordinal_position = 4 [(buf.validate.field) = {
    int32: {
      gte: 0
      lte: 1001
    }
  }];
  // Indicates that the column type could be used as a struct/json in a data warehouse
  bool is_struct = 5;
  // Indicates that the column is a repeated field in a data warehouse (e.g. array)
  bool is_repeated = 6;
  // Fields inside of the struct/record like column
  repeated SchemaColumnField fields = 7 [(buf.validate.field) = {
    repeated: {max_items: 100}
  }];
  // Declared precision of an exact numeric column (NUMERIC, DECIMAL, NUMBER), in
  // decimal digits. Set whichever category the column reads as, so a NUMBER(38,0)
  // is NUMERIC_CATEGORY_INTEGER with precision 38 and scale 0. Unset for every
  // other column, and for an exact numeric whose size the data warehouse does
  // not report.
  optional int64 precision = 8 [(buf.validate.field) = {
    int64: {
      gte: 1
      lte: 1000
    }
  }];
  // Declared scale of an exact numeric column, set together with precision.
  // Unset is not a scale of 0: it means the scale is not known.
  optional int64 scale = 9 [(buf.validate.field) = {
    int64: {
      gte: 0
      lte: 1000
    }
  }];
  // What kind of number the column holds. Unspecified for a non-numeric column,
  // and for one whose type is not recognised.
  NumericCategory numeric_category = 10;
  // Tags the data warehouse assigns to the column, sorted by name and then
  // value. Only top-level columns carry tags.
  repeated SchemaTag tags = 11 [(buf.validate.field) = {
    repeated: {max_items: 100}
  }];
  // True when the column accepts NULL, false when it is declared NOT NULL.
  // Unset when the data warehouse does not report it.
  optional bool is_nullable = 12;
}

// Schema represents a schema of a table like entity
message Schema {
  // Immutable workspace identifier that this entity belongs to.
  string workspace = 1;

  // Unique identifier for this entity.
  Identifier id = 2 [(buf.validate.field).required = true];

  // Coalesce Quality Path to the entity. This is a unique path that can be used to access the entity in the Coalesce Quality UI.
  string synq_path = 6;

  // Time when the schema was defined.
  google.protobuf.Timestamp state_at = 3;

  // Optional description of the schema, might differ from the entity itself
  optional string description = 4;

  // Columns of the schema
  repeated SchemaColumn columns = 5 [(buf.validate.field) = {
    repeated: {max_items: 1000}
  }];

  // Tags the data warehouse assigns to the table, view or other object itself,
  // sorted by name and then value.
  repeated SchemaTag tags = 7 [(buf.validate.field) = {
    repeated: {max_items: 100}
  }];
}
