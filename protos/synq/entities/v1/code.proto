syntax = "proto3";

package synq.entities.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "synq/entities/v1/code_type.proto";
import "synq/entities/v1/entity_types.proto";
import "synq/entities/v1/identifier.proto";
import "synq/entities/v1/sql_dialect.proto";
import "synq/platforms/v1/data_platform_types.proto";

option go_package = "github.com/getsynq/api/entities/v1";

// Code represents a piece of code or configuration that can be processed by Coalesce Quality.
// This message is used to store and manage various types of code artifacts, such as SQL queries,
// Python scripts, dbt models, and other code configurations. Each code piece is associated with
// a specific entity that defines or owns it, and includes metadata about its type and state.
message Code {
  // Identifier of the entity that defines or owns this code piece. This could be a dbt model,
  // SQLMesh model, or any other entity type that contains code.
  synq.entities.v1.Identifier definer_identifier = 1 [(buf.validate.field) = {required: true}];

  // Coalesce Quality Path to the entity. This is a unique path that can be used to access the entity in the Coalesce Quality UI.
  string definer_synq_path = 7;

  // Information about entity type of the entity defining code
  synq.entities.v1.EntityType definer_entity_type = 9;

  // Timestamp indicating when this specific version of the code was captured or last modified.
  // This helps track the evolution of code over time.
  google.protobuf.Timestamp state_at = 2 [(buf.validate.field) = {required: true}];

  // Type of code being stored, which determines how Coalesce Quality will process and analyze it.
  // This can be SQL, Python, dbt, SQLMesh, or other supported code types.
  synq.entities.v1.CodeType code_type = 3;

  // SQL dialect used in the code, if the code_type is SQL. This helps Coalesce Quality understand
  // the specific SQL syntax and features being used.
  optional synq.entities.v1.SqlDialect sql_dialect = 4;

  // The actual content of the code. This can be SQL queries, Python scripts,
  // dbt models, or any other supported code format.
  string content = 5 [(buf.validate.field) = {
    string: {
      min_len: 0
      max_len: 1000000
    }
  }];

  // Optional human-readable name for the code piece that can be used for display purposes. Might also indicate name of the file.
  optional string code_name = 6;

  // Optional path in e.g. git or project directory which is source of the code
  optional string file_path = 8;

  // Data platform of the entity that defines this code — dbt, SQLMesh,
  // Snowflake, and so on. `definer_entity_type` says what kind of thing
  // defines the code; this says which tool it belongs to.
  //
  // Use it to order the code an entity has when it has more than one piece:
  // a warehouse table modelled by a transformation framework carries both the
  // framework's source and the warehouse's own DDL, and the framework source
  // is what a reader normally wants first.
  synq.platforms.v1.DataPlatformType definer_platform = 10;

  // True when the definer failed to produce this code the last time it ran —
  // a model that did not compile, a routine whose body could not be read.
  // The `content` is then the last body that was captured, which may be stale
  // or empty; `execution_error` says what went wrong.
  bool has_execution_error = 11;

  // Message describing the failure `has_execution_error` reports. Empty when
  // there is no failure, and may also be empty when the producer recorded a
  // failure without a message.
  string execution_error = 12;

  // True when `content` holds only the first part of the file. Files above
  // the ingestion size cap are stored as a prefix, and a client showing this
  // code should say so rather than presenting the prefix as the whole body.
  // `original_size_bytes` gives the untruncated size.
  bool is_truncated = 13;

  // Size in bytes of the code before any truncation. Read it together with
  // `is_truncated`, which is what makes it meaningful: where `content` was cut,
  // this is the size of the whole body, and a truncated body always has one.
  // Zero where nothing measured the source, which is the normal case for code
  // that is not read from a file and never happens for a truncated body.
  uint64 original_size_bytes = 14;
}

// CodeSource names one of the places an entity's code is read from. An entity
// usually has code in more than one of them — a dbt model has its own source
// and the warehouse table's DDL — and each is read independently, so one
// being unavailable does not hide the others.
enum CodeSource {
  CODE_SOURCE_UNSPECIFIED = 0;
  // The compiled SQL definition of a table or view.
  CODE_SOURCE_SQL_DEFINITION = 1;
  // Code carried by the entity itself: a transformation model's source, a
  // stored routine's body, an orchestration task's script.
  CODE_SOURCE_ENTITY_DEFINITION = 2;
  // A file read from a connected repository.
  CODE_SOURCE_REPOSITORY_FILE = 3;
  // Code attached to a custom entity.
  CODE_SOURCE_CUSTOM_ENTITY = 4;
  // The expression of a SQL test.
  CODE_SOURCE_SQL_TEST = 5;
  // The configuration of a deployed reconciliation suite or case.
  CODE_SOURCE_RECONCILIATION = 6;
  // The query a monitor runs against the warehouse.
  CODE_SOURCE_MONITOR = 7;
}

// CodeSourceError reports one source that could not be read while the rest of
// the response was assembled. That source's code is missing or incomplete in
// `codes`; every other source in the response is complete.
//
// Retry the same request to pick the missing source up — these are transient
// by nature. A request in which every source failed returns an error instead.
message CodeSourceError {
  // Which source was unavailable.
  synq.entities.v1.CodeSource source = 1;

  // Human-readable reason, for logging and for telling a reader why part of
  // the code is missing. Not a stable string; do not branch on it.
  string message = 2;
}
