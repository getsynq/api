syntax = "proto3";

package synq.entities.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/getsynq/api/entities/v1";

// Annotations can be used to annotate any entity with a key:value pair.
// These annotations can be used for filtering and searching entities.
message Annotation {
  // String key for the annotation.
  string name = 1 [(buf.validate.field) = {
    required: true
    string: {
      min_len: 1
      max_len: 50
    }
  }];

  // Optional list of values that the annotation can carry.
  //
  // A value is something entities are filtered and searched by, not free-form
  // metadata, so keep it to a label a person would pick out of a list. The limit
  // is set to hold an identifier or a link the annotated system generated —
  // truncating one of those produces a value that no longer resolves, and no
  // longer matches the filter it exists for. Put prose in the entity
  // description instead.
  repeated string values = 2 [(buf.validate.field) = {
    repeated: {
      min_items: 0
      max_items: 20
      items: {
        string: {
          min_len: 1
          max_len: 100
        }
      }
    }
  }];
}
