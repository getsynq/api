syntax = "proto3";

package synq.entities.semantic_models.v1alpha;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "synq/issues/actor/v1/actor.proto";
import "synq/entities/marks/v1alpha/entity_mark.proto";
import "synq/entities/semantic_models/v1alpha/semantic_model.proto";
import "synq/entities/v1/identity_group.proto";
import "synq/v1/pagination.proto";
import "synq/v1/scope_authorization.proto";

option go_package = "github.com/getsynq/api/entities/semantic_models/v1alpha";

// MetricDuplicatesService reads the duplicate groups of metrics. A duplicate group is a set of
// metric fields, each in a different semantic model, that can be one metric: for example `arr` in a
// dbt metric, in a Snowflake semantic view and in a Tableau data source. The signals of a group say
// why its fields are in it.
//
// Coalesce Quality finds the groups in the background, from the semantic models of the workspace.
// It compares metrics and measures only. Dimensions are not compared. A person can say that two
// fields are not one metric, and Coalesce Quality then keeps the two in different groups.
//
// Copies of one model count as one model: the same model in another catalog or schema, with the
// same field definitions, is a copy and not a duplicate. A field of a Looker explore is the field
// of the view that the explore joins, so a group shows it once and lists no explore.
//
// This API is in alpha: its shape may change without notice.
service MetricDuplicatesService {
  // List the ids of the duplicate groups of the workspace, the highest rank first. Read the groups
  // with BatchGetDuplicateGroups.
  rpc ListDuplicateGroups(ListDuplicateGroupsRequest) returns (ListDuplicateGroupsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_ENTITY_READ,
        SCOPE_SRE_AGENT,
        SCOPE_MCP_READ
      ]
    };
    option (google.api.http) = {
      post: "/api/entities/semantic-models/v1alpha/duplicate-groups/list"
      body: "*"
    };
  }

  // Read duplicate groups by id, with the certified and deprecated marks of each model.
  rpc BatchGetDuplicateGroups(BatchGetDuplicateGroupsRequest) returns (BatchGetDuplicateGroupsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_ENTITY_READ,
        SCOPE_SRE_AGENT,
        SCOPE_MCP_READ
      ]
    };
    option (google.api.http) = {
      post: "/api/entities/semantic-models/v1alpha/duplicate-groups/by-id"
      body: "*"
    };
  }

  // List the duplicate groups of the fields of each of several semantic models. Any member of the
  // identity group of an entity addresses its model. The response has one entry for each identity
  // group of the request.
  rpc BatchListEntityDuplicateGroups(BatchListEntityDuplicateGroupsRequest) returns (BatchListEntityDuplicateGroupsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_ENTITY_READ,
        SCOPE_SRE_AGENT,
        SCOPE_MCP_READ
      ]
    };
    option (google.api.http) = {
      post: "/api/entities/semantic-models/v1alpha/duplicate-groups/by-entity-id"
      body: "*"
    };
  }

  // Say that two fields are not one metric. The groups change on the next pass, which starts at
  // once. Saying it again records the new person and time.
  //
  // A user with SCOPE_ENTITY_MARKS_EDIT says it of any two fields. Any other user says it only of
  // two fields whose entities both have an owner that lists the user as a contact.
  rpc SetDistinctMetrics(SetDistinctMetricsRequest) returns (SetDistinctMetricsResponse) {
    option idempotency_level = IDEMPOTENT;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_ENTITY_MARKS_EDIT,
        SCOPE_ENTITY_MARKS_OWNED_EDIT,
        SCOPE_MCP_WRITE
      ]
    };
    option (google.api.http) = {
      post: "/api/entities/semantic-models/v1alpha/duplicate-groups/set-distinct"
      body: "*"
    };
  }

  // Take back that two fields are not one metric. A pair with no such answer is left as it is.
  rpc RemoveDistinctMetrics(RemoveDistinctMetricsRequest) returns (RemoveDistinctMetricsResponse) {
    option idempotency_level = IDEMPOTENT;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_ENTITY_MARKS_EDIT,
        SCOPE_ENTITY_MARKS_OWNED_EDIT,
        SCOPE_MCP_WRITE
      ]
    };
    option (google.api.http) = {
      post: "/api/entities/semantic-models/v1alpha/duplicate-groups/remove-distinct"
      body: "*"
    };
  }

  // List the answers that two fields are not one metric, the newest first. The two fields of an
  // answer are in no group together, so a group does not show its answers: read them here, and take
  // one back with RemoveDistinctMetrics.
  rpc ListDistinctMetrics(ListDistinctMetricsRequest) returns (ListDistinctMetricsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_ENTITY_READ,
        SCOPE_SRE_AGENT,
        SCOPE_MCP_READ
      ]
    };
    option (google.api.http) = {
      post: "/api/entities/semantic-models/v1alpha/duplicate-groups/list-distinct"
      body: "*"
    };
  }
}

// FieldRef addresses one field of a semantic model.
message FieldRef {
  // Opaque id of the entity whose semantic model holds the field. Any member of its identity group
  // addresses it. A response gives the canonical entity id of the identity group.
  string entity_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1024
  }];
  // The name of the field: Field.name of the semantic model read.
  string field_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1024
  }];
}

// DuplicateSignalKind is why two fields can be one metric.
enum DuplicateSignalKind {
  DUPLICATE_SIGNAL_KIND_UNSPECIFIED = 0;
  // The name, the display label or a synonym is equal. Case, and spaces, underscores and hyphens
  // between words, do not count. A name alone is a weak signal: a `count` is in many models.
  DUPLICATE_SIGNAL_KIND_NAME = 1;
  // The expression, the aggregation, the filter and the table the field reads are equal. An
  // aggregation that the declarer names beside the expression counts as part of it, so a dbt measure
  // with `agg: sum` and `expr: amount` matches `SUM(amount)`. Case, whitespace and comments in the
  // expression do not count. A different literal is a different expression.
  DUPLICATE_SIGNAL_KIND_EXPRESSION = 2;
  // The fields read the same columns, from the column lineage. A field that reads another metric
  // has no such signal, as two metrics can read one metric with different filters.
  DUPLICATE_SIGNAL_KIND_INPUT_COLUMNS = 3;
}

// DuplicateSignal is one signal that two or more fields of a group share.
message DuplicateSignal {
  DuplicateSignalKind kind = 1;
  // Deprecated: read name, expression or input_columns, by the kind.
  string value = 2 [
    deprecated = true,
    (buf.validate.field).string.max_len = 100000
  ];
  // The fields of the group that share it.
  repeated FieldRef fields = 3 [(buf.validate.field).repeated.max_items = 10000];
  // The columns that the fields read, sorted. Set only for DUPLICATE_SIGNAL_KIND_INPUT_COLUMNS.
  repeated ColumnRef input_columns = 4 [(buf.validate.field).repeated.max_items = 10000];
  // The name that the fields share, lowercased, with each run of spaces, underscores and hyphens
  // as one space. Set only for DUPLICATE_SIGNAL_KIND_NAME.
  string name = 5 [(buf.validate.field).string.max_len = 100000];
  // The expression that the fields share, in its normalised form, with the aggregation around it.
  // Set only for DUPLICATE_SIGNAL_KIND_EXPRESSION.
  string expression = 6 [(buf.validate.field).string.max_len = 100000];
}

// DuplicateGroupStrength says which signals the fields of a group share.
enum DuplicateGroupStrength {
  DUPLICATE_GROUP_STRENGTH_UNSPECIFIED = 0;
  // The name only. A weak group: a `count` is in many models.
  DUPLICATE_GROUP_STRENGTH_NAME_ONLY = 1;
  // The name, and the expression or the input columns.
  DUPLICATE_GROUP_STRENGTH_NAME_AND_DEFINITION = 2;
  // The expression or the input columns, and not the name.
  DUPLICATE_GROUP_STRENGTH_DEFINITION_ONLY = 3;
}

// ColumnRef is one column of an entity.
message ColumnRef {
  // Opaque id of the entity: the canonical entity id of its identity group.
  string entity_id = 1 [(buf.validate.field).string.max_len = 1024];
  // The name of the column.
  string column = 2 [(buf.validate.field).string.max_len = 1024];
}

// DuplicateField is one field of a duplicate group.
message DuplicateField {
  // The name of the field: Field.name of the semantic model read.
  string field_name = 1 [(buf.validate.field).string.max_len = 1024];
  // The name of the group of the field in its model.
  string group_name = 2 [(buf.validate.field).string.max_len = 1024];
  // The kind of the group of the field: FIELD_GROUP_KIND_MEASURES or FIELD_GROUP_KIND_METRICS.
  FieldGroupKind group_kind = 3;
  // The field name as the declarer spells it.
  string native_name = 4 [(buf.validate.field).string.max_len = 1024];
  // The label the declarer shows its users. Empty when it is the native name.
  string display_name = 5 [(buf.validate.field).string.max_len = 1024];
}

// DuplicateModel is one semantic model of a duplicate group, with its fields in the group.
message DuplicateModel {
  // The identity group of the model. Its canonical entity id is the entity_id of the FieldRef of
  // each of its fields.
  synq.entities.v1.IdentityGroup identity_group = 1;
  // The certified and the deprecated marks of the model. Unset when the marks could not be read:
  // read them with synq.entities.marks.v1alpha.EntityMarksService/BatchGetEntityMarks. Never take
  // an unset value as "not certified". Do not read EntityMarks.identity_group here: it repeats
  // identity_group of this message.
  synq.entities.marks.v1alpha.EntityMarks marks = 2;
  // The fields of the model in the group.
  repeated DuplicateField fields = 3 [(buf.validate.field).repeated.max_items = 10000];
  // The copies of the model: models of the same platform and name in other locations, for example
  // another catalog or schema, whose fields in the group have the same name and definition. The
  // group shows the model once. A copy addresses the group in BatchListEntityDuplicateGroups.
  repeated synq.entities.v1.IdentityGroup copies = 4 [(buf.validate.field).repeated.max_items = 10000];
}

// DuplicateGroup is a set of metric fields that can be one metric, each in a different semantic
// model.
message DuplicateGroup {
  reserved 3;
  reserved "fields";
  // The id of the group. It stays the same while the group has the same fields.
  string group_id = 1 [(buf.validate.field).string.max_len = 255];
  // The rank of the group in the list of the workspace. A higher rank is a stronger group. A group
  // with only the name signal has the lowest ranks.
  int32 rank = 2;
  // The models of the group, in the order of their canonical entity id.
  repeated DuplicateModel models = 6 [(buf.validate.field).repeated.max_items = 10000];
  // The signals that the fields share, the strongest kind first.
  repeated DuplicateSignal signals = 4 [(buf.validate.field).repeated.max_items = 10000];
  // When Coalesce Quality first found the group with these fields.
  google.protobuf.Timestamp found_at = 5;
  // Which signals the fields share. Use it to tell a group with a fact from a group by name. Use
  // rank for the order.
  DuplicateGroupStrength strength = 7;
}

message ListDuplicateGroupsRequest {
  // The page to read. The default page size is 100, and the largest is 1000. A cursor continues
  // only a list with the same filter.
  synq.v1.Pagination pagination = 1;
  // List only the groups of these strengths. Empty lists every group.
  repeated DuplicateGroupStrength strengths = 2 [(buf.validate.field).repeated = {
    max_items: 16
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
}

message ListDuplicateGroupsResponse {
  // The ids of the groups, the highest rank first.
  repeated string group_ids = 1;
  synq.v1.PageInfo page_info = 2;
}

message BatchGetDuplicateGroupsRequest {
  // The ids of the groups, from ListDuplicateGroups or BatchListEntityDuplicateGroups.
  repeated string group_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 255
      }
    }
  }];
}

message BatchGetDuplicateGroupsResponse {
  // The groups by id. A group id that no group has is left out, as the groups change on each pass.
  map<string, DuplicateGroup> groups = 1;
}

message BatchListEntityDuplicateGroupsRequest {
  // Opaque ids of the entities whose semantic models hold the fields. Any member of an identity
  // group addresses its model.
  repeated string entity_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 1024
      }
    }
  }];
  // Return only the fields with these names: Field.name of the semantic model read. Empty returns
  // every field of the model that is in a group.
  repeated string field_names = 2 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {
        min_len: 1
        max_len: 1024
      }
    }
  }];
}

// DuplicateGroupRef names one duplicate group.
message DuplicateGroupRef {
  string group_id = 1 [(buf.validate.field).string.max_len = 255];
  // The number of models in the group.
  uint32 model_count = 2;
}

// FieldDuplicateGroups are the duplicate groups of one field.
message FieldDuplicateGroups {
  // The name of the field: Field.name of the semantic model read.
  string field_name = 1 [(buf.validate.field).string.max_len = 1024];
  // The groups of the field, the highest rank first.
  repeated DuplicateGroupRef groups = 2 [(buf.validate.field).repeated.max_items = 10000];
}

// EntityDuplicateGroups are the duplicate groups of the fields of one semantic model.
message EntityDuplicateGroups {
  // The identity group of the model.
  synq.entities.v1.IdentityGroup identity_group = 1;
  // The ids of the request that address this identity group, in request order.
  repeated string requested_entity_ids = 2 [(buf.validate.field).repeated.max_items = 100];
  // The fields of the model that are in a group, in field name order. Empty when no field of the
  // model is in a group.
  repeated FieldDuplicateGroups fields = 3 [(buf.validate.field).repeated.max_items = 100000];
}

message BatchListEntityDuplicateGroupsResponse {
  // One entry for each identity group of the request, in the order of its first asked id.
  repeated EntityDuplicateGroups entities = 1;
}

message SetDistinctMetricsRequest {
  option (buf.validate.message).cel = {
    id: "distinct_fields"
    message: "field and other_field must be two different fields"
    expression: "this.field.entity_id != this.other_field.entity_id || this.field.field_name != this.other_field.field_name"
  };
  // The two fields that are not one metric. They must be two different fields.
  FieldRef field = 1 [(buf.validate.field).required = true];
  FieldRef other_field = 2 [(buf.validate.field).required = true];
  // Why the two are not one metric. Empty when the person gives no reason.
  string reason = 3 [(buf.validate.field).string.max_len = 2000];
  // The person who says it.
  synq.issues.actor.v1.Actor actor = 4 [(buf.validate.field) = {required: true}];
}

message SetDistinctMetricsResponse {}

message RemoveDistinctMetricsRequest {
  FieldRef field = 1 [(buf.validate.field).required = true];
  FieldRef other_field = 2 [(buf.validate.field).required = true];
  // The person who takes it back.
  synq.issues.actor.v1.Actor actor = 3 [(buf.validate.field) = {required: true}];
}

message RemoveDistinctMetricsResponse {}

// DistinctMetrics is the answer of a person that two fields are not one metric.
message DistinctMetrics {
  // The two fields, each with the canonical entity id of the identity group of its model.
  FieldRef field = 1;
  FieldRef other_field = 2;
  // Why the two are not one metric. Empty when the person gave no reason.
  string reason = 3 [(buf.validate.field).string.max_len = 2000];
  // The person who said it. Unset when the person is not known.
  synq.issues.actor.v1.Actor set_by = 4;
  // When the person said it.
  google.protobuf.Timestamp set_at = 5;
}

message ListDistinctMetricsRequest {
  // Return only the answers that name a field of the semantic models of these entities. Any member
  // of an identity group addresses its model. Empty returns every answer of the workspace.
  repeated string entity_ids = 1 [(buf.validate.field).repeated = {
    max_items: 1000
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 1024
      }
    }
  }];
}

message ListDistinctMetricsResponse {
  // The answers, the newest first.
  repeated DistinctMetrics distinct_metrics = 1;
}
