syntax = "proto3";

package synq.entities.semantic_models.v1alpha;

import "buf/validate/validate.proto";
import "synq/entities/v1/schema.proto";
import "synq/platforms/v1/data_platform_types.proto";

option go_package = "github.com/getsynq/api/entities/semantic_models/v1alpha";

// SemanticModel is the semantic-layer model of an entity: its fields in groups, what each field
// computes, and the joins between the groups. It is the model one declarer states for the entity,
// taken whole. A field name is the column name of the entity's schema, so the schema and the model
// join on it.
//
// The shape follows the Open Semantic Interchange (OSI) model. A group is an OSI dataset, or the
// part of a dataset that plays one role.
message SemanticModel {
  // Opaque id of the entity whose declaration states the model, when another entity declares it,
  // for example the dbt project that defines a semantic model. Empty when the entity states it
  // itself.
  string declarer_entity_id = 1 [(buf.validate.field).string.max_len = 1024];
  // Name of the model as the declarer spells it.
  string native_name = 2 [(buf.validate.field).string.max_len = 1024];
  // Description of the model.
  string description = 3 [(buf.validate.field).string.max_len = 10000];
  // The platform whose SQL the expressions are written in, when an expression does not name its
  // own.
  synq.platforms.v1.DataPlatformType sql_platform = 4;
  // The field groups, in the declarer's order.
  repeated FieldGroup groups = 5 [(buf.validate.field).repeated.max_items = 10000];
  // The joins between the groups.
  repeated Relationship relationships = 6 [(buf.validate.field).repeated.max_items = 10000];
  // Context for an AI agent that reads the model.
  AIContext ai_context = 7;
  // Vendor data the declarer carries with the model.
  repeated CustomExtension custom_extensions = 8 [(buf.validate.field).repeated.max_items = 100];
}

// OsiDocument is a semantic model as an Open Semantic Interchange document.
message OsiDocument {
  // The OSI specification version of the document.
  string osi_version = 1 [(buf.validate.field).string.max_len = 64];
  // The YAML document.
  string document = 2 [(buf.validate.field).string.max_len = 10000000];
}

// SemanticModelSummary counts what a semantic model holds beyond plain columns. An entity with no
// semantic model has an empty summary.
message SemanticModelSummary {
  // The number of fields of one group kind.
  message KindCount {
    FieldGroupKind kind = 1;
    uint32 count = 2;
  }
  // Fields per group kind, in kind order. Plain columns are left out.
  repeated KindCount field_counts = 1 [(buf.validate.field).repeated.max_items = 100];
  // The number of joins between the groups.
  uint32 relationship_count = 2;
}

// FieldGroupKind is the role the fields of a group play. It is the role of each of its fields.
enum FieldGroupKind {
  FIELD_GROUP_KIND_UNSPECIFIED = 0;
  // Plain columns. OSI: a dataset field without a dimension.
  FIELD_GROUP_KIND_COLUMNS = 1;
  // OSI: a dataset field with a dimension.
  FIELD_GROUP_KIND_DIMENSIONS = 2;
  // Aggregations over the rows of a group.
  FIELD_GROUP_KIND_MEASURES = 3;
  // OSI: a model-level metric.
  FIELD_GROUP_KIND_METRICS = 4;
  FIELD_GROUP_KIND_ENTITIES = 5;
  FIELD_GROUP_KIND_FACTS = 6;
  // Named row filters, for example Looker filter fields and Cube segments.
  FIELD_GROUP_KIND_FILTERS = 7;
  // Values a user sets at query time, for example Looker parameters and Snowflake variables.
  FIELD_GROUP_KIND_PARAMETERS = 8;
}

// FieldGroup is a named set of fields of one kind. OSI: a dataset. One dataset can be several
// groups that share a name, one for each kind of field it holds. Then the dataset-level fields are
// set on one of them only.
message FieldGroup {
  // Name of the group: the sub-container of the declarer (a Power BI table, a LookML view, an OSI
  // dataset), or a label for the kind when the declarer has no sub-containers.
  string name = 1 [(buf.validate.field).string.max_len = 1024];
  FieldGroupKind kind = 2;
  // The fields, in the declarer's order.
  repeated Field fields = 3 [(buf.validate.field).repeated.max_items = 100000];
  // The label the declarer shows for the group, when it differs from the name.
  string display_name = 4 [(buf.validate.field).string.max_len = 1024];
  // What the group reads.
  DatasetSource source = 5;
  string description = 6 [(buf.validate.field).string.max_len = 10000];
  // Names of the fields that together identify a row.
  repeated string primary_key = 7 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {max_len: 1024}
    }
  }];
  repeated UniqueKey unique_keys = 8 [(buf.validate.field).repeated.max_items = 100];
  AIContext ai_context = 9;
  repeated CustomExtension custom_extensions = 10 [(buf.validate.field).repeated.max_items = 100];
}

// Field is one field of a semantic model.
message Field {
  // The address of the field: lowercased, and qualified by the sub-container when the declarer has
  // one. It is the column name in the entity's schema, and it is unique within the model.
  string name = 1 [(buf.validate.field).string.max_len = 1024];
  // The field name as the declarer spells it, unqualified.
  string native_name = 2 [(buf.validate.field).string.max_len = 1024];
  // The data type as the declarer spells it.
  string native_type = 3 [(buf.validate.field).string.max_len = 1024];
  string description = 4 [(buf.validate.field).string.max_len = 10000];
  // Position of the field in the declarer's list, starting from 1.
  int32 ordinal_position = 5;
  // Tags the declarer gives the field.
  repeated synq.entities.v1.SchemaTag tags = 6 [(buf.validate.field).repeated.max_items = 100];
  // What the field computes. Unset for a plain stored column, and when the request leaves the
  // definitions out.
  FieldDefinition definition = 7;
}

// FieldDefinition says how a semantic-layer field is defined.
message FieldDefinition {
  // The declarer's own name for the kind of object, lowercased, for example "measure",
  // "calculated_column" or "derived_metric". For display only.
  string native_kind = 1 [(buf.validate.field).string.max_len = 255];
  // What the field computes. Unset for a measure whose declarer gives only an aggregation.
  Expression expression = 2;
  // The aggregation the declarer applies on top of the expression. Unspecified when the aggregate is
  // inside the expression, or when the field is not aggregated.
  Aggregation aggregation = 3;
  // The declarer's spelling of the aggregation, when `aggregation` cannot say it exactly.
  string native_aggregation = 4 [(buf.validate.field).string.max_len = 255];
  // The finest grain of a time dimension.
  TimeGranularity time_granularity = 5;
  // The key role of the field within its group.
  KeyKind key = 6;
  Visibility visibility = 7;
  // The folder the declarer shows the field in.
  string display_folder = 8 [(buf.validate.field).string.max_len = 1024];
  // The display format, as the declarer spells it.
  string format = 9 [(buf.validate.field).string.max_len = 1024];
  // A row filter that is part of the definition.
  Expression filter = 10;
  // Names of the dimensions this measure cannot be added up over.
  repeated string non_additive_dimensions = 11 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {max_len: 1024}
    }
  }];
  // The declarer's spelling of the key role, when `key` is KEY_KIND_OTHER.
  string native_key = 12 [(buf.validate.field).string.max_len = 255];
  // True for a time field, false for a field the declarer says is not one. Unset when the declarer
  // does not say.
  optional bool is_time = 13;
  // The declarer's stable id for the field, when it has one.
  string native_id = 14 [(buf.validate.field).string.max_len = 1024];
  AIContext ai_context = 15;
  repeated CustomExtension custom_extensions = 16 [(buf.validate.field).repeated.max_items = 100];
  // The label the declarer shows its users, when it differs from the native name.
  string display_name = 17 [(buf.validate.field).string.max_len = 1024];
}

// Expression is one definition, in one or more dialects.
message Expression {
  repeated DialectExpression dialects = 1 [(buf.validate.field).repeated.max_items = 100];
}

// DialectExpression is an expression in one dialect.
message DialectExpression {
  // Where the expression is evaluated, which also gives its language: the SQL of a data warehouse,
  // DAX for Power BI, LookML for Looker. Unspecified when `native_dialect` names the language, or
  // when it is the SQL of the model's sql_platform.
  synq.platforms.v1.DataPlatformType platform = 1;
  // Names the language when the platform cannot, for example ANSI_SQL or MDX.
  string native_dialect = 2 [(buf.validate.field).string.max_len = 255];
  // The expression text. A text longer than the limit is cut, and is_truncated is set.
  string expression = 3 [(buf.validate.field).string.max_len = 10000];
  // True when the expression text was cut to fit its limit.
  bool is_truncated = 4;
}

// AIContext is context written for an AI agent that reads the model.
message AIContext {
  // The context as one text. The other fields are then empty.
  string text = 1 [(buf.validate.field).string.max_len = 10000];
  string instructions = 2 [(buf.validate.field).string.max_len = 10000];
  repeated string synonyms = 3 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {max_len: 1024}
    }
  }];
  repeated string examples = 4 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {max_len: 10000}
    }
  }];
  // Any other keys, as one JSON object.
  string extra_json = 5 [(buf.validate.field).string.max_len = 100000];
}

// CustomExtension is vendor data carried with the model as the declarer gave it.
message CustomExtension {
  string vendor_name = 1 [(buf.validate.field).string.max_len = 255];
  // A JSON string.
  string data = 2 [(buf.validate.field).string.max_len = 100000];
}

// DatasetSource is what a group reads. The declarer sets each field that it knows, so one source
// can hold a name, the entity it resolves to and a query at the same time.
message DatasetSource {
  // Opaque id of the entity that the group reads.
  optional string entity_id = 1 [(buf.validate.field).string.max_len = 1024];
  // The `database.schema.table` name as the declarer spells it.
  optional string native_name = 2 [(buf.validate.field).string.max_len = 1024];
  // A query.
  Expression query = 3;
}

// UniqueKey is a set of fields that identify a row.
message UniqueKey {
  // Field names, in key order.
  repeated string fields = 1 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {max_len: 1024}
    }
  }];
}

// Relationship is a join between two groups of a model.
message Relationship {
  // Name of the join. Empty when the declarer has none.
  string name = 1 [(buf.validate.field).string.max_len = 1024];
  // Group name of the many side.
  string from = 2 [(buf.validate.field).string.max_len = 1024];
  // Field names of the many side, in the same order as `to_fields`.
  repeated string from_fields = 3 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {max_len: 1024}
    }
  }];
  // Group name of the one side, or the opaque id of another entity.
  string to = 4 [(buf.validate.field).string.max_len = 1024];
  repeated string to_fields = 5 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {max_len: 1024}
    }
  }];
  Cardinality cardinality = 6;
  RelationshipState state = 7;
  // The join condition, when it is not a list of equal fields.
  Expression on = 8;
  JoinType join_type = 9;
  // The declarer's spelling of the join type, when `join_type` is JOIN_TYPE_OTHER.
  string native_join_type = 10 [(buf.validate.field).string.max_len = 255];
  AIContext ai_context = 11;
  repeated CustomExtension custom_extensions = 12 [(buf.validate.field).repeated.max_items = 100];
}

enum Aggregation {
  AGGREGATION_UNSPECIFIED = 0;
  AGGREGATION_SUM = 1;
  AGGREGATION_COUNT = 2;
  AGGREGATION_COUNT_DISTINCT = 3;
  AGGREGATION_AVERAGE = 4;
  AGGREGATION_MIN = 5;
  AGGREGATION_MAX = 6;
  AGGREGATION_MEDIAN = 7;
  AGGREGATION_PERCENTILE = 8;
  AGGREGATION_SUM_BOOLEAN = 9;
  AGGREGATION_LIST = 10;
  AGGREGATION_STDDEV = 11;
  AGGREGATION_VARIANCE = 12;
  // The declarer says explicitly not to aggregate.
  AGGREGATION_NONE = 13;
  // Another aggregation. `native_aggregation` says which.
  AGGREGATION_OTHER = 14;
}

enum TimeGranularity {
  TIME_GRANULARITY_UNSPECIFIED = 0;
  TIME_GRANULARITY_NANOSECOND = 1;
  TIME_GRANULARITY_MICROSECOND = 2;
  TIME_GRANULARITY_MILLISECOND = 3;
  TIME_GRANULARITY_SECOND = 4;
  TIME_GRANULARITY_MINUTE = 5;
  TIME_GRANULARITY_HOUR = 6;
  TIME_GRANULARITY_DAY = 7;
  TIME_GRANULARITY_WEEK = 8;
  TIME_GRANULARITY_MONTH = 9;
  TIME_GRANULARITY_QUARTER = 10;
  TIME_GRANULARITY_YEAR = 11;
  // Fiscal and custom grains.
  TIME_GRANULARITY_OTHER = 12;
}

enum KeyKind {
  // Not a key.
  KEY_KIND_UNSPECIFIED = 0;
  KEY_KIND_PRIMARY = 1;
  KEY_KIND_UNIQUE = 2;
  KEY_KIND_FOREIGN = 3;
  KEY_KIND_NATURAL = 4;
  // Another key role. `native_key` says which.
  KEY_KIND_OTHER = 5;
}

enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;
  // The declarer hides the field from its end users.
  VISIBILITY_HIDDEN = 1;
}

enum Cardinality {
  // The declarer does not say.
  CARDINALITY_UNSPECIFIED = 0;
  CARDINALITY_MANY_TO_ONE = 1;
  CARDINALITY_ONE_TO_ONE = 2;
  CARDINALITY_ONE_TO_MANY = 3;
  CARDINALITY_MANY_TO_MANY = 4;
}

enum JoinType {
  JOIN_TYPE_UNSPECIFIED = 0;
  JOIN_TYPE_LEFT_OUTER = 1;
  JOIN_TYPE_INNER = 2;
  JOIN_TYPE_FULL_OUTER = 3;
  JOIN_TYPE_CROSS = 4;
  // Another join type. `native_join_type` says which.
  JOIN_TYPE_OTHER = 5;
}

enum RelationshipState {
  // Usable.
  RELATIONSHIP_STATE_UNSPECIFIED = 0;
  // The declarer keeps the join but does not use it by default.
  RELATIONSHIP_STATE_INACTIVE = 1;
}
