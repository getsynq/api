syntax = "proto3";

package synq.entities.semantic_models.v1alpha;

import "buf/validate/validate.proto";
import "synq/entities/v1/schema.proto";
import "synq/platforms/v1/data_platform_types.proto";

option go_package = "github.com/getsynq/api/entities/semantic_models/v1alpha";

// SemanticModel is the semantic-layer model of an entity: its fields in groups, what each field
// computes, and the joins between the groups. It is the model one declarer states for the entity,
// taken whole. A field name is the column name of the entity's schema, so the schema and the model
// join on it.
//
// The shape follows the Open Semantic Interchange (OSI) model. A group is an OSI dataset, or the
// part of a dataset that plays one role.
message SemanticModel {
  // Opaque id of the entity whose declaration states the model, when another entity declares it,
  // for example the dbt project that defines a semantic model. Empty when the entity states it
  // itself.
  string declarer_entity_id = 1 [(buf.validate.field).string.max_len = 1024];
  // Name of the model as the declarer spells it.
  string native_name = 2 [(buf.validate.field).string.max_len = 1024];
  // Description of the model.
  string description = 3 [(buf.validate.field).string.max_len = 10000];
  // The platform whose SQL the expressions are written in, when an expression does not name its
  // own.
  synq.platforms.v1.DataPlatformType sql_platform = 4;
  // The field groups, in the declarer's order.
  repeated FieldGroup groups = 5 [(buf.validate.field).repeated.max_items = 10000];
  // The joins between the groups.
  repeated Relationship relationships = 6 [(buf.validate.field).repeated.max_items = 10000];
  // Context for an AI agent that reads the model.
  AIContext ai_context = 7;
  // Vendor data the declarer carries with the model.
  repeated CustomExtension custom_extensions = 8 [(buf.validate.field).repeated.max_items = 100];
  // The tables of the model, in the declarer's order: the logical tables of a Snowflake semantic
  // view, the views of a Looker explore, the tables of a Power BI model. A table with no field is in
  // this list and has no group. A model whose declarer has no tables has none.
  repeated Table tables = 9 [(buf.validate.field).repeated.max_items = 10000];
}

// Table is one table of a semantic model: what it reads and how its rows are identified. Its fields
// are in the field groups that name it.
message Table {
  // Name of the table in the model. FieldGroup.table, Relationship.from and Relationship.to name it.
  // Empty for the one table that a model with no table names reads, for example the source of a
  // Databricks metric view.
  string name = 1 [(buf.validate.field).string.max_len = 1024];
  // What the table reads. Unset when the declarer does not say.
  DatasetSource source = 2;
  // Names of the fields that together identify a row.
  repeated string primary_key = 3 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {max_len: 1024}
    }
  }];
  repeated UniqueKey unique_keys = 4 [(buf.validate.field).repeated.max_items = 100];
  // The lines of the table in the declaration text: its table, its join, or the source of the
  // model. Unset when the text does not name the table, or when the request does not ask for the
  // text.
  LineRange declared_lines = 5;
}

// DeclarationText is the declaration of a semantic model as the platform holds it.
message DeclarationText {
  enum Language {
    LANGUAGE_UNSPECIFIED = 0;
    LANGUAGE_SQL = 1;
    LANGUAGE_YAML = 2;
  }
  // MissingReason says why a model has no declaration text.
  enum MissingReason {
    MISSING_REASON_UNSPECIFIED = 0;
    // The platform of the model has no text form of a declaration that Coalesce Quality reads.
    MISSING_REASON_PLATFORM_HAS_NO_TEXT = 1;
    // The platform has a text for a model of this kind, and Coalesce Quality holds none for this
    // model.
    MISSING_REASON_TEXT_NOT_HELD = 2;
    // The warehouse refused the text to the role of the integration, for example a Snowflake role
    // with no REFERENCES grant on the semantic view.
    // SemanticModelEntry.declaration_text_recommendation_id names the recommendation that gives the
    // grant.
    MISSING_REASON_TEXT_REFUSED = 3;
  }
  string text = 1 [(buf.validate.field).string.max_len = 10000000];
  Language language = 2;
}

// LineRange is a range of lines in a text, numbered from 1. end_line is the last line of the range.
message LineRange {
  uint32 start_line = 1;
  uint32 end_line = 2;
}

// DefinitionFinding is one problem of the definition of a semantic model that a fixed rule finds
// from the declaration alone, with no query.
message DefinitionFinding {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // A field sums a value of a table that a join repeats: each row of that table counts once for
    // each matching row of the field's own table.
    KIND_SUM_AFTER_FAN_OUT = 1;
    // An expression names a member of a table of the model that the model does not declare.
    KIND_UNDECLARED_FIELD = 2;
    // A relationship joins on a field that the model computes from an expression.
    KIND_JOIN_ON_COMPUTED_FIELD = 3;
    // Two different join paths connect the same two tables. The level is LEVEL_PROBLEM when a field
    // reads both tables and does not name its path, so a query can take either path. It is
    // LEVEL_NOTE when no field does.
    KIND_TWO_JOIN_PATHS = 4;
  }
  enum Level {
    LEVEL_UNSPECIFIED = 0;
    // The model can give a wrong value.
    LEVEL_PROBLEM = 1;
    // Something is missing that a reader needs to trust the model.
    LEVEL_GAP = 2;
    // A fact that a model builder can act on, with no wrong value.
    LEVEL_NOTE = 3;
  }
  Kind kind = 1;
  Level level = 2;
  // The finding as one sentence, from a fixed rule.
  string text = 3 [(buf.validate.field).string.max_len = 10000];
  // The fields that the finding is about, in the order of the model.
  repeated FieldReference fields = 4 [(buf.validate.field).repeated.max_items = 10000];
  // The relationships that the finding is about, by their position in SemanticModel.relationships.
  repeated uint32 relationship_indexes = 5 [(buf.validate.field).repeated.max_items = 10000];
  // The tables that the finding is about, as Table.name.
  repeated string tables = 6 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {max_len: 1024}
    }
  }];
  // The names in an expression that the finding is about, as the steps of a reading write them.
  repeated string names = 7 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {max_len: 1024}
    }
  }];
  // The lines of the fields and the relationships of the finding in the declaration text. Set only
  // when the request asks for the text and the text names them.
  repeated LineRange declared_lines = 8 [(buf.validate.field).repeated.max_items = 10000];
}

// FieldReference names one field of a semantic model.
message FieldReference {
  // The group of the field, as FieldGroup.name.
  string group = 1 [(buf.validate.field).string.max_len = 1024];
  // The name of the field, as Field.name.
  string field_name = 2 [(buf.validate.field).string.max_len = 1024];
}

// OsiDocument is a semantic model as an Open Semantic Interchange document.
message OsiDocument {
  // The OSI specification version of the document.
  string osi_version = 1 [(buf.validate.field).string.max_len = 64];
  // The YAML document.
  string document = 2 [(buf.validate.field).string.max_len = 10000000];
}

// SemanticModelSummary counts what a semantic model holds beyond plain columns. An entity with no
// semantic model has an empty summary.
message SemanticModelSummary {
  // The number of fields of one group kind.
  message KindCount {
    FieldGroupKind kind = 1;
    uint32 count = 2;
  }
  // Fields per group kind, in kind order. Plain columns are left out.
  repeated KindCount field_counts = 1 [(buf.validate.field).repeated.max_items = 100];
  // The number of joins between the groups.
  uint32 relationship_count = 2;
  // The number of tables that the model reads. Groups that read one table are one table. Two
  // logical tables over one table, as in a self join, are two tables.
  uint32 table_count = 3;
  // What kind of model the entity is.
  SemanticModelKind kind = 4;
}

// SemanticModelKind says if an entity is a model with fields, or one metric that is its own entity.
enum SemanticModelKind {
  SEMANTIC_MODEL_KIND_UNSPECIFIED = 0;
  // A model: a semantic view, a metric view, an explore, a data source, a dbt semantic model.
  SEMANTIC_MODEL_KIND_MODEL = 1;
  // One metric that the declarer keeps as an entity of its own, for example a dbt metric. Its
  // model holds that one field.
  SEMANTIC_MODEL_KIND_SINGLE_METRIC = 2;
}

// FieldGroupKind is the role the fields of a group play. It is the role of each of its fields.
enum FieldGroupKind {
  FIELD_GROUP_KIND_UNSPECIFIED = 0;
  // Plain columns. OSI: a dataset field without a dimension.
  FIELD_GROUP_KIND_COLUMNS = 1;
  // OSI: a dataset field with a dimension.
  FIELD_GROUP_KIND_DIMENSIONS = 2;
  // Aggregations over the rows of a group.
  FIELD_GROUP_KIND_MEASURES = 3;
  // OSI: a model-level metric.
  FIELD_GROUP_KIND_METRICS = 4;
  FIELD_GROUP_KIND_ENTITIES = 5;
  FIELD_GROUP_KIND_FACTS = 6;
  // Named row filters, for example Looker filter fields and Cube segments.
  FIELD_GROUP_KIND_FILTERS = 7;
  // Values a user sets at query time, for example Looker parameters and Snowflake variables.
  FIELD_GROUP_KIND_PARAMETERS = 8;
}

// FieldGroup is a named set of fields of one kind. OSI: the fields of a dataset that play one role.
// One table can have several groups that share its name, one for each kind of field it holds. What
// the table reads and its keys are on the Table.
message FieldGroup {
  // Name of the group: the sub-container of the declarer (a Power BI table, a LookML view, an OSI
  // dataset), or a label for the kind when the declarer has no sub-containers.
  string name = 1 [(buf.validate.field).string.max_len = 1024];
  FieldGroupKind kind = 2;
  // The fields, in the declarer's order.
  repeated Field fields = 3 [(buf.validate.field).repeated.max_items = 100000];
  // The label the declarer shows for the group, when it differs from the name.
  string display_name = 4 [(buf.validate.field).string.max_len = 1024];
  // Deprecated: read Table.source of the table that the group names.
  DatasetSource source = 5 [deprecated = true];
  string description = 6 [(buf.validate.field).string.max_len = 10000];
  // Deprecated: read Table.primary_key of the table that the group names.
  repeated string primary_key = 7 [
    deprecated = true,
    (buf.validate.field).repeated = {
      max_items: 100
      items: {
        string: {max_len: 1024}
      }
    }
  ];
  // Deprecated: read Table.unique_keys of the table that the group names.
  repeated UniqueKey unique_keys = 8 [
    deprecated = true,
    (buf.validate.field).repeated.max_items = 100
  ];
  AIContext ai_context = 9;
  repeated CustomExtension custom_extensions = 10 [(buf.validate.field).repeated.max_items = 100];
  // Deprecated: read Table.declared_lines of the table that the group names.
  LineRange declared_lines = 11 [deprecated = true];
  // The table of the group, as Table.name. The group has a table when SemanticModel.tables holds a
  // table of this name. A group of model-level fields, such as OSI metrics, has none.
  string table = 12 [(buf.validate.field).string.max_len = 1024];
  // The number of fields of the group in the model, whatever the request keeps. It is larger than
  // the number of returned fields when a field limit or a field filter cuts the group.
  uint32 field_count = 13;
}

// Field is one field of a semantic model.
message Field {
  // The address of the field: lowercased, and qualified by the sub-container when the declarer has
  // one. It is the column name in the entity's schema. Two groups can hold a field of one name when
  // the tool does not qualify its names (a Power BI or Tableau table), so a field is one name within
  // its group.
  string name = 1 [(buf.validate.field).string.max_len = 1024];
  // The field name as the declarer spells it, unqualified.
  string native_name = 2 [(buf.validate.field).string.max_len = 1024];
  // The data type as the declarer spells it.
  string native_type = 3 [(buf.validate.field).string.max_len = 1024];
  string description = 4 [(buf.validate.field).string.max_len = 10000];
  // Position of the field in the declarer's list, starting from 1.
  int32 ordinal_position = 5;
  // Tags the declarer gives the field.
  repeated synq.entities.v1.SchemaTag tags = 6 [(buf.validate.field).repeated.max_items = 100];
  // What the field computes. Unset for a plain stored column, and when the request leaves the
  // definitions out.
  FieldDefinition definition = 7;
  // The computation of the field as steps in words, and how much of its expression was read. Set
  // only when the request asks for readings, and only for a field with an expression or an
  // aggregation.
  FieldReading reading = 8;
  // The lines of the field in the declaration text. Unset when the text does not name the field,
  // or when the request does not ask for the text.
  LineRange declared_lines = 9;
}

// FieldReading is the computation of a field as steps in words. Each step comes from a fixed rule,
// and no step is written for a part of the expression that was not read.
message FieldReading {
  enum ReadState {
    READ_STATE_UNSPECIFIED = 0;
    // Each part of the expression is in a step.
    READ_STATE_COMPLETE = 1;
    // The steps hold the parts that were read. unread_texts holds the parts that were not.
    READ_STATE_PARTIAL = 2;
    // There are no steps. not_read_reason_kind says why.
    READ_STATE_NOT_READ = 3;
    // The declaration names an aggregation and no expression. The steps hold the aggregation.
    READ_STATE_NO_EXPRESSION = 4;
  }
  // NotReadReason says why an expression was not read.
  enum NotReadReason {
    NOT_READ_REASON_UNSPECIFIED = 0;
    // Coalesce Quality has no reader for the language of the expression.
    NOT_READ_REASON_LANGUAGE_NOT_SUPPORTED = 1;
    // The language has a reader, and the reader could not read this expression.
    NOT_READ_REASON_READER_FAILED = 2;
  }
  ReadState read_state = 1;
  // The steps of the computation, in order.
  repeated FieldReadingStep steps = 2 [(buf.validate.field).repeated.max_items = 1000];
  // The parts of the expression that were not read, as text. Set only for READ_STATE_PARTIAL.
  repeated string unread_texts = 3 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {max_len: 10000}
    }
  }];
  // Deprecated: read not_read_reason_kind.
  string not_read_reason = 4 [
    deprecated = true,
    (buf.validate.field).string.max_len = 1024
  ];
  // The language of the expression that was read.
  synq.platforms.v1.DataPlatformType platform = 5;
  // The computation as one sentence, for a list. Empty if a part of it was not read.
  string summary = 6 [(buf.validate.field).string.max_len = 10000];
  // What the expression and the filter read, each name once, in the order of the expression: the
  // other fields of the model, and the columns of the table of the field. When a name is a field of
  // the model and a column of the table, the rule of the platform decides. In a Snowflake semantic
  // view the field wins, and a field that reads its own name reads the column.
  repeated FieldInput inputs = 7 [(buf.validate.field).repeated.max_items = 1000];
  // Why the expression was not read. Set only for READ_STATE_NOT_READ.
  NotReadReason not_read_reason_kind = 8;
}

// FieldInput is one thing that a field reads: another field of the model, or a column of a table.
message FieldInput {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // Another field of the model. group and field_name address it. The field is an input also if
    // the field options of the request do not return it, so a client must not expect to find it in
    // the returned groups.
    KIND_FIELD = 1;
    // A column of a table of the model, which is not a field of the model. table and column
    // address it.
    KIND_COLUMN = 2;
  }
  // The name as the steps write it.
  string text = 1 [(buf.validate.field).string.max_len = 1024];
  // The group of the input field, as FieldGroup.name. Set only for KIND_FIELD.
  string group = 2 [(buf.validate.field).string.max_len = 1024];
  // The name of the input field, as in Field.name. Set only for KIND_FIELD.
  string field_name = 3 [(buf.validate.field).string.max_len = 1024];
  Kind kind = 4;
  // The table of the column, as Table.name. Set only for KIND_COLUMN.
  string table = 5 [(buf.validate.field).string.max_len = 1024];
  // The name of the column, as the expression writes it without its table. Set only for
  // KIND_COLUMN.
  string column = 6 [(buf.validate.field).string.max_len = 1024];
}

// FieldReadingStep is one step of a computation.
message FieldReadingStep {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // Which rows count: a filter of the field, FILTER (WHERE ...), or a CASE WHEN with no ELSE.
    KIND_ROWS = 1;
    // The value that each row gives.
    KIND_VALUE = 2;
    // How the rows combine: the aggregation.
    KIND_COMBINE = 3;
    // One side of a division. The label says which.
    KIND_PART = 4;
    // What happens after the aggregation, such as scaling.
    KIND_THEN = 5;
    // The rows that a window function reads for each row: the partition, the order and the frame.
    KIND_WINDOW = 6;
  }
  Kind kind = 1;
  // A label for a step that needs one, such as "Numerator". Empty otherwise.
  string label = 2 [(buf.validate.field).string.max_len = 255];
  // The step in words.
  string text = 3 [(buf.validate.field).string.max_len = 10000];
}

// FieldDefinition says how a semantic-layer field is defined.
message FieldDefinition {
  // The declarer's own name for the kind of object, lowercased, for example "measure",
  // "calculated_column" or "derived_metric". For display only.
  string native_kind = 1 [(buf.validate.field).string.max_len = 255];
  // What the field computes. Unset for a measure whose declarer gives only an aggregation.
  Expression expression = 2;
  // The aggregation the declarer applies on top of the expression. Unspecified when the aggregate is
  // inside the expression, or when the field is not aggregated.
  Aggregation aggregation = 3;
  // The declarer's spelling of the aggregation, when `aggregation` cannot say it exactly.
  string native_aggregation = 4 [(buf.validate.field).string.max_len = 255];
  // The finest grain of a time dimension.
  TimeGranularity time_granularity = 5;
  // The key role of the field within its group.
  KeyKind key = 6;
  Visibility visibility = 7;
  // The folder the declarer shows the field in.
  string display_folder = 8 [(buf.validate.field).string.max_len = 1024];
  // The display format, as the declarer spells it.
  string format = 9 [(buf.validate.field).string.max_len = 1024];
  // A row filter that is part of the definition.
  Expression filter = 10;
  // Names of the dimensions this measure cannot be added up over.
  repeated string non_additive_dimensions = 11 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {max_len: 1024}
    }
  }];
  // The declarer's spelling of the key role, when `key` is KEY_KIND_OTHER.
  string native_key = 12 [(buf.validate.field).string.max_len = 255];
  // True for a time field, false for a field the declarer says is not one. Unset when the declarer
  // does not say.
  optional bool is_time = 13;
  // The declarer's stable id for the field, when it has one.
  string native_id = 14 [(buf.validate.field).string.max_len = 1024];
  AIContext ai_context = 15;
  repeated CustomExtension custom_extensions = 16 [(buf.validate.field).repeated.max_items = 100];
  // The label the declarer shows its users, when it differs from the native name.
  string display_name = 17 [(buf.validate.field).string.max_len = 1024];
}

// Expression is one definition, in one or more dialects.
message Expression {
  repeated DialectExpression dialects = 1 [(buf.validate.field).repeated.max_items = 100];
}

// DialectExpression is an expression in one dialect.
message DialectExpression {
  // Where the expression is evaluated, which also gives its language: the SQL of a data warehouse,
  // DAX for Power BI, LookML for Looker. Unspecified when `native_dialect` names the language, or
  // when it is the SQL of the model's sql_platform.
  synq.platforms.v1.DataPlatformType platform = 1;
  // Names the language when the platform cannot, for example ANSI_SQL or MDX.
  string native_dialect = 2 [(buf.validate.field).string.max_len = 255];
  // The expression text. A text longer than the limit is cut, and is_truncated is set.
  string expression = 3 [(buf.validate.field).string.max_len = 10000];
  // True when the expression text was cut to fit its limit.
  bool is_truncated = 4;
}

// AIContext is context written for an AI agent that reads the model.
message AIContext {
  // The context as one text. The other fields are then empty.
  string text = 1 [(buf.validate.field).string.max_len = 10000];
  string instructions = 2 [(buf.validate.field).string.max_len = 10000];
  repeated string synonyms = 3 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {max_len: 1024}
    }
  }];
  repeated string examples = 4 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {max_len: 10000}
    }
  }];
  // Any other keys, as one JSON object.
  string extra_json = 5 [(buf.validate.field).string.max_len = 100000];
}

// CustomExtension is vendor data carried with the model as the declarer gave it.
message CustomExtension {
  string vendor_name = 1 [(buf.validate.field).string.max_len = 255];
  // A JSON string.
  string data = 2 [(buf.validate.field).string.max_len = 100000];
}

// DatasetSource is what a group reads. The declarer sets each field that it knows, so one source
// can hold a name, the entity it resolves to and a query at the same time.
message DatasetSource {
  // Opaque id of the entity that the group reads. The declarer sets it, or the read finds it from
  // native_name, as entity_id_matched says.
  optional string entity_id = 1 [(buf.validate.field).string.max_len = 1024];
  // The `database.schema.table` name as the declarer spells it.
  optional string native_name = 2 [(buf.validate.field).string.max_len = 1024];
  // A query.
  Expression query = 3;
  // True when the declarer gave only native_name, and the read set entity_id to the one entity of
  // the workspace at that address on the platform of the model. The entity can be in another
  // integration than the model. False when the declarer set entity_id, or when there is no
  // entity_id.
  bool entity_id_matched = 4;
}

// UniqueKey is a set of fields that identify a row.
message UniqueKey {
  // Field names, in key order.
  repeated string fields = 1 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {max_len: 1024}
    }
  }];
}

// Relationship is a join between two groups of a model.
message Relationship {
  // Name of the join. Empty when the declarer has none, and for a name that the platform
  // generates for a join with no name.
  string name = 1 [(buf.validate.field).string.max_len = 1024];
  // Table name of the many side, as Table.name.
  string from = 2 [(buf.validate.field).string.max_len = 1024];
  // Field names of the many side, in the same order as `to_fields`.
  repeated string from_fields = 3 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {max_len: 1024}
    }
  }];
  // Table name of the one side, as Table.name, or the opaque id of another entity.
  string to = 4 [(buf.validate.field).string.max_len = 1024];
  repeated string to_fields = 5 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {max_len: 1024}
    }
  }];
  Cardinality cardinality = 6;
  RelationshipState state = 7;
  // The join condition, when it is not a list of equal fields.
  Expression on = 8;
  JoinType join_type = 9;
  // The declarer's spelling of the join type, when `join_type` is JOIN_TYPE_OTHER.
  string native_join_type = 10 [(buf.validate.field).string.max_len = 255];
  AIContext ai_context = 11;
  repeated CustomExtension custom_extensions = 12 [(buf.validate.field).repeated.max_items = 100];
  // The lines of the relationship in the declaration text. Unset when the text does not name it,
  // or when the request does not ask for the text.
  LineRange declared_lines = 13;
}

enum Aggregation {
  AGGREGATION_UNSPECIFIED = 0;
  AGGREGATION_SUM = 1;
  AGGREGATION_COUNT = 2;
  AGGREGATION_COUNT_DISTINCT = 3;
  AGGREGATION_AVERAGE = 4;
  AGGREGATION_MIN = 5;
  AGGREGATION_MAX = 6;
  AGGREGATION_MEDIAN = 7;
  AGGREGATION_PERCENTILE = 8;
  AGGREGATION_SUM_BOOLEAN = 9;
  AGGREGATION_LIST = 10;
  AGGREGATION_STDDEV = 11;
  AGGREGATION_VARIANCE = 12;
  // The declarer says explicitly not to aggregate.
  AGGREGATION_NONE = 13;
  // Another aggregation. `native_aggregation` says which.
  AGGREGATION_OTHER = 14;
}

enum TimeGranularity {
  TIME_GRANULARITY_UNSPECIFIED = 0;
  TIME_GRANULARITY_NANOSECOND = 1;
  TIME_GRANULARITY_MICROSECOND = 2;
  TIME_GRANULARITY_MILLISECOND = 3;
  TIME_GRANULARITY_SECOND = 4;
  TIME_GRANULARITY_MINUTE = 5;
  TIME_GRANULARITY_HOUR = 6;
  TIME_GRANULARITY_DAY = 7;
  TIME_GRANULARITY_WEEK = 8;
  TIME_GRANULARITY_MONTH = 9;
  TIME_GRANULARITY_QUARTER = 10;
  TIME_GRANULARITY_YEAR = 11;
  // Fiscal and custom grains.
  TIME_GRANULARITY_OTHER = 12;
}

enum KeyKind {
  // Not a key.
  KEY_KIND_UNSPECIFIED = 0;
  KEY_KIND_PRIMARY = 1;
  KEY_KIND_UNIQUE = 2;
  KEY_KIND_FOREIGN = 3;
  KEY_KIND_NATURAL = 4;
  // Another key role. `native_key` says which.
  KEY_KIND_OTHER = 5;
}

enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;
  // The declarer hides the field from its end users.
  VISIBILITY_HIDDEN = 1;
}

enum Cardinality {
  // The declarer does not say.
  CARDINALITY_UNSPECIFIED = 0;
  CARDINALITY_MANY_TO_ONE = 1;
  CARDINALITY_ONE_TO_ONE = 2;
  CARDINALITY_ONE_TO_MANY = 3;
  CARDINALITY_MANY_TO_MANY = 4;
}

enum JoinType {
  JOIN_TYPE_UNSPECIFIED = 0;
  JOIN_TYPE_LEFT_OUTER = 1;
  JOIN_TYPE_INNER = 2;
  JOIN_TYPE_FULL_OUTER = 3;
  JOIN_TYPE_CROSS = 4;
  // Another join type. `native_join_type` says which.
  JOIN_TYPE_OTHER = 5;
}

enum RelationshipState {
  // Usable.
  RELATIONSHIP_STATE_UNSPECIFIED = 0;
  // The declarer keeps the join but does not use it by default.
  RELATIONSHIP_STATE_INACTIVE = 1;
}
