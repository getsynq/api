syntax = "proto3";

package synq.entities.semantic_models.v1alpha;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "synq/entities/semantic_models/v1alpha/semantic_model.proto";
import "synq/entities/marks/v1alpha/entity_mark.proto";
import "google/protobuf/timestamp.proto";
import "synq/entities/v1/identity_group.proto";
import "synq/v1/pagination.proto";
import "synq/v1/scope_authorization.proto";

option go_package = "github.com/getsynq/api/entities/semantic_models/v1alpha";

// SemanticModelsService reads the semantic-layer model of entities: the measures, dimensions,
// metrics and other fields a semantic layer or BI tool declares, what each one computes, and the
// joins between them.
//
// The schema of an entity (synq.entities.schemas.v1) lists the same fields as flat columns. A field
// name here is the column name there.
service SemanticModelsService {
  // Read the semantic model of each asked entity. Any member of an identity group addresses the
  // group, so a dbt model and the table it builds give the same model. Every asked id has an
  // answer: an entity with no semantic model gets its identity group and no model.
  rpc BatchGetSemanticModels(BatchGetSemanticModelsRequest) returns (BatchGetSemanticModelsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_ENTITY_READ,
        SCOPE_SRE_AGENT,
        SCOPE_MCP_READ
      ]
    };
    option (google.api.http) = {
      post: "/api/entities/semantic-models/v1alpha/by-id"
      body: "*"
    };
  }

  // List the semantic models of the workspace: one entry for each identity group whose winning
  // schema declaration has a semantic model, ordered by the canonical entity id. An entry has the
  // summary, the name and the marks of the model, and no fields. Read the fields with
  // BatchGetSemanticModels.
  rpc ListSemanticModels(ListSemanticModelsRequest) returns (ListSemanticModelsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_ENTITY_READ,
        SCOPE_SRE_AGENT,
        SCOPE_MCP_READ
      ]
    };
    option (google.api.http) = {
      post: "/api/entities/semantic-models/v1alpha/list"
      body: "*"
    };
  }
}

// SemanticModelFormat is the form a semantic model is returned in.
enum SemanticModelFormat {
  // The structured SemanticModel message.
  SEMANTIC_MODEL_FORMAT_UNSPECIFIED = 0;
  // An Open Semantic Interchange (OSI) YAML document.
  SEMANTIC_MODEL_FORMAT_OSI = 1;
}

message BatchGetSemanticModelsRequest {
  // Opaque ids of the entities to read. Get an id from another response, or resolve an identifier
  // with synq.entities.resolve.v1.IdentifierResolveService first.
  repeated string entity_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 1024
      }
    }
  }];
  // Return only the fields with these names. Empty returns every field. A group with no field left
  // is left out. Ignored for SEMANTIC_MODEL_FORMAT_OSI, which always returns the whole model.
  repeated string field_names = 2 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {
        min_len: 1
        max_len: 1024
      }
    }
  }];
  // Return the definition of each field: its expression, aggregation and the rest. False returns
  // the structure only, which keeps the response small for a large model. Ignored for
  // SEMANTIC_MODEL_FORMAT_OSI, which always returns the definitions.
  bool include_definitions = 3;
  // The form of the model in the response.
  SemanticModelFormat format = 4;
  // Return Field.reading: the computation of each field as steps in words. Each reading parses an
  // expression, so ask only when the steps are shown. Ignored for SEMANTIC_MODEL_FORMAT_OSI.
  bool include_readings = 5;
  // Return SemanticModelEntry.declaration_text, and the declared_lines of each group, field and
  // relationship. Ignored for SEMANTIC_MODEL_FORMAT_OSI.
  bool include_declaration_text = 6;
}

message BatchGetSemanticModelsResponse {
  // One entry for each asked entity id, in request order.
  repeated SemanticModelEntry semantic_models = 1;
}

// SemanticModelEntry is the answer for one asked entity.
message SemanticModelEntry {
  // The entity id that was asked for.
  string entity_id = 1 [(buf.validate.field).string.max_len = 1024];
  // The identity group of the asked entity.
  synq.entities.v1.IdentityGroup identity_group = 2;
  // The member of the identity group whose declaration gave the model. Unset when there is no
  // model.
  synq.entities.v1.AspectProvenance provenance = 3;
  // What the model holds. Empty when the entity has no semantic model.
  SemanticModelSummary summary = 4;
  // The model, in the asked format. Unset when the entity has no semantic model.
  oneof model {
    SemanticModel semantic_model = 5;
    OsiDocument osi = 6;
  }
  // The certified and the deprecated marks of the model. Unset when there is no
  // model. Unset with a model when the marks could not be read: read them with
  // synq.entities.marks.v1alpha.EntityMarksService/BatchGetEntityMarks. Never
  // take an unset value as "not certified".
  synq.entities.marks.v1alpha.EntityMarks marks = 7;
  // The text that the platform holds for the model, as its author wrote it: the DDL of a Snowflake
  // semantic view, the YAML of a Databricks metric view. Set only when the request asks for it and
  // the text is known. Unset means that no text is known for the model. It is never a generated
  // text.
  DeclarationText declaration_text = 8;
}

message ListSemanticModelsRequest {
  // The page to read. The default page size is 100, and the largest is 1000.
  synq.v1.Pagination pagination = 1;
}

message ListSemanticModelsResponse {
  // The semantic models, ordered by entity_id.
  repeated SemanticModelListEntry semantic_models = 1;
  synq.v1.PageInfo page_info = 2;
}

// SemanticModelListEntry is one semantic model of the workspace, without its fields.
message SemanticModelListEntry {
  // The canonical entity id of the identity group. It addresses the model in
  // BatchGetSemanticModels.
  string entity_id = 1 [(buf.validate.field).string.max_len = 1024];
  synq.entities.v1.IdentityGroup identity_group = 2;
  // The member of the identity group whose declaration gave the model.
  synq.entities.v1.AspectProvenance provenance = 3;
  // Name of the model as the declarer spells it. Empty when the declarer gives no name.
  string native_name = 4 [(buf.validate.field).string.max_len = 1024];
  // What the model holds.
  SemanticModelSummary summary = 5;
  // The certified and the deprecated marks of the model. Unset when the marks could not be read:
  // read them with synq.entities.marks.v1alpha.EntityMarksService/BatchGetEntityMarks. Never take
  // an unset value as "not certified".
  synq.entities.marks.v1alpha.EntityMarks marks = 6;
  // When the declarer observed the declaration as it is. A declarer sends the same declaration on
  // each run, and an unchanged declaration is not stored again, so this is the time of the last
  // change of the model in most cases.
  google.protobuf.Timestamp state_at = 7;
  // The number of tables of the model: the distinct names of its field groups. The group with no
  // name, which holds model-level fields such as OSI metrics, is not a table.
  uint32 table_count = 8;
}
