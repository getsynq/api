syntax = "proto3";

package synq.entities.platformusers.v1alpha;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "synq/entities/activity/v1alpha/activity.proto";
import "synq/entities/platformusers/v1alpha/platform_users.proto";
import "synq/entities/platformusers/v1alpha/service_accounts.proto";
import "synq/platforms/v1/data_platform_types.proto";
import "synq/v1/scope_authorization.proto";

option go_package = "github.com/getsynq/api/entities/platformusers/v1alpha";

// ServiceAccountsService maintains a workspace's service accounts, person links and popularity
// policies: which logins act for a tool, which belong to a person, and whose reads count toward an
// entity's popularity.
//
// Every change goes through a plan first. A typical loop is: ListPlatformUsers with unclassified_only
// to see the logins nothing classifies, ListServiceAccountSuggestions for the accounts their evidence
// points at, PlanServiceAccountChanges to see what a change set moves, then
// ApplyServiceAccountChanges with the plan's token. A change takes effect on the next read.
//
// Exact matchers, suggestion evidence and plans name logins, which are often personal data. A caller
// without the platform users scope gets them with every platform user id, login and person identity
// cleared, and the counts kept. A suggestion's account name and login patterns come from the logins it
// saw, so that caller gets those cleared too, and a suggestion named after its one login is named
// "Service login".
service ServiceAccountsService {
  // List every workspace service account, then every built-in one, in the order they apply, and the
  // person links in a second list.
  rpc ListServiceAccounts(ListServiceAccountsRequest) returns (ListServiceAccountsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_SERVICE_ACCOUNTS_READ,
        SCOPE_SERVICE_ACCOUNTS_EDIT,
        SCOPE_MCP_READ
      ]
    };
    option (google.api.http) = {
      post: "/api/entities/service-accounts/v1alpha/list"
      body: "*"
    };
  }

  // Read service accounts by id, built-in ids included. Ids that do not exist are left out.
  rpc BatchGetServiceAccounts(BatchGetServiceAccountsRequest) returns (BatchGetServiceAccountsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_SERVICE_ACCOUNTS_READ,
        SCOPE_SERVICE_ACCOUNTS_EDIT,
        SCOPE_MCP_READ
      ]
    };
    option (google.api.http) = {
      post: "/api/entities/service-accounts/v1alpha/batch-get"
      body: "*"
    };
  }

  // Suggest service accounts for the logins nothing classifies, each as a change set with its
  // evidence. A suggestion changes nothing by itself: edit it if needed, plan it with
  // PlanServiceAccountChanges, then apply it.
  rpc ListServiceAccountSuggestions(ListServiceAccountSuggestionsRequest) returns (ListServiceAccountSuggestionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_SERVICE_ACCOUNTS_READ,
        SCOPE_SERVICE_ACCOUNTS_EDIT,
        SCOPE_MCP_READ
      ]
    };
    option (google.api.http) = {
      post: "/api/entities/service-accounts/v1alpha/suggestions"
      body: "*"
    };
  }

  // Report what a change set would change, without writing it: every login slice whose
  // classification moves, how many counted reads each adds or removes, and the entities whose rank
  // moves most. The plan_token it returns is what ApplyServiceAccountChanges takes.
  rpc PlanServiceAccountChanges(PlanServiceAccountChangesRequest) returns (PlanServiceAccountChangesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_SERVICE_ACCOUNTS_EDIT,
        SCOPE_MCP_WRITE
      ]
    };
    option (google.api.http) = {
      post: "/api/entities/service-accounts/v1alpha/plan"
      body: "*"
    };
  }

  // Write a planned change set, all of it or nothing. It is refused with FAILED_PRECONDITION when the
  // token is not from a plan of exactly this change set against the workspace as it is now: plan it
  // again. A change to an account or person link whose etag no longer matches is refused with
  // ABORTED, and nothing is written. Caller-supplied ids and etags make a retry converge.
  rpc ApplyServiceAccountChanges(ApplyServiceAccountChangesRequest) returns (ApplyServiceAccountChangesResponse) {
    option idempotency_level = IDEMPOTENT;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_SERVICE_ACCOUNTS_EDIT,
        SCOPE_MCP_WRITE
      ]
    };
    option (google.api.http) = {
      post: "/api/entities/service-accounts/v1alpha/apply"
      body: "*"
    };
  }
}

message ListServiceAccountsRequest {}

message ListServiceAccountsResponse {
  // The workspace's accounts by priority, highest first, then the last update, newest first, then id.
  // Then the built-in accounts, in the order they apply, `built_in.coalesce-quality` first.
  repeated ServiceAccount service_accounts = 1;
  // By priority, highest first, then the last update, newest first, then id.
  repeated PersonLink person_links = 2;
}

message BatchGetServiceAccountsRequest {
  repeated string ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 1000
    items: {
      string: {
        min_len: 1
        max_len: 128
      }
    }
  }];
}

message BatchGetServiceAccountsResponse {
  // The accounts among the asked ids, keyed by id.
  map<string, ServiceAccount> service_accounts = 1;
}

message ListServiceAccountSuggestionsRequest {
  // The days of query history the evidence is read over, back from the current hour. Unset is 30.
  uint32 window_days = 1 [(buf.validate.field).uint32.lte = 92];
}

// SuggestionSource is the evidence a suggestion rests on, most confident first.
enum SuggestionSource {
  SUGGESTION_SOURCE_UNSPECIFIED = 0;
  // Coalesce Quality's tag on the queries of a login Coalesce Quality does not know as its own.
  SUGGESTION_SOURCE_COALESCE_QUALITY_MARKER = 1;
  // Another tool's tag on the login's queries.
  SUGGESTION_SOURCE_TOOL_MARKER = 2;
  // A kind of login the platform states is not a person, such as Snowflake's `SERVICE`.
  SUGGESTION_SOURCE_PLATFORM_KIND = 3;
  // A login name a tool's setup guide tells you to create, such as `FIVETRAN_USER`.
  SUGGESTION_SOURCE_NAME_PATTERN = 4;
  // The tables the login writes carry a loader's columns, such as Fivetran's `_fivetran_synced`.
  SUGGESTION_SOURCE_LOADER_FOOTPRINT = 5;
  // The login writes on a fixed cadence, or touches far more entities than people do.
  SUGGESTION_SOURCE_BEHAVIOUR = 6;
}

message ServiceAccountSuggestion {
  SuggestionSource source = 1;
  // The account to create, with one matcher. Its ids are generated, so applying it twice creates it
  // once.
  ServiceAccountChanges changes = 2;
  // Why each login is in it, one entry per login.
  repeated Evidence evidence = 3;
}

message ListServiceAccountSuggestionsResponse {
  // By source, then by how much of the logins' activity carries the evidence, highest first.
  repeated ServiceAccountSuggestion suggestions = 1;
}

message PlanServiceAccountChangesRequest {
  ServiceAccountChanges changes = 1 [(buf.validate.field).required = true];
  // The days of query history the plan is read over, back from the current hour. Unset is 30.
  uint32 window_days = 2 [(buf.validate.field).uint32.lte = 92];
}

// SliceReading is how one login slice reads under a classification.
message SliceReading {
  Classification classification = 1;
  // The service accounts the slice is in, the first one deciding its group, built-in ones included.
  repeated string service_account_ids = 2;
  // The identity of its person, for a slice a person link or the platform's email links.
  string person_identity = 3;
  bool counts_toward_popularity = 4;
  bool listed_as_frequent_user = 5;
}

// SliceChange is one login slice whose classification the change set moves.
message SliceChange {
  string platform_user_id = 1;
  string login = 2;
  // The tool whose queries the slice is, DATA_PLATFORM_TYPE_UNSPECIFIED for queries with no tag.
  synq.platforms.v1.DataPlatformType issuer = 3;
  SliceReading before = 4;
  SliceReading after = 5;
  // Reads of the slice in the window that start counting toward popularity, negative when they stop.
  int64 counted_reads_delta = 6;
}

// RankChange is one entity whose rank in one pool the change set moves.
message RankChange {
  string entity_id = 1;
  synq.entities.activity.v1alpha.PopularityPool pool = 2;
  synq.platforms.v1.DataPlatformType platform = 3;
  string instance = 4;
  uint64 reads_before = 5;
  uint64 reads_after = 6;
  // From 0 to 1, 0 when the entity was not ranked.
  double percentile_before = 7;
  double percentile_after = 8;
}

message PlanServiceAccountChangesResponse {
  // By the size of counted_reads_delta, largest first, then login and issuer.
  repeated SliceChange slice_changes = 1;
  // The counted reads the change set adds, negative when it removes them.
  int64 counted_reads_delta = 2;
  // At most 20, in the SYSTEM pool, by how far the percentile moves, largest first. Empty when the
  // ranks could not be computed, with ranks_unavailable set.
  repeated RankChange rank_changes = 3;
  bool ranks_unavailable = 4;
  // What ApplyServiceAccountChanges takes for exactly this change set.
  string plan_token = 5;
  // The window planned over, [from, to).
  google.protobuf.Timestamp from = 6;
  google.protobuf.Timestamp to = 7;
}

message ApplyServiceAccountChangesRequest {
  ServiceAccountChanges changes = 1 [(buf.validate.field).required = true];
  string plan_token = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
}

message ApplyServiceAccountChangesResponse {
  // The accounts and person links as written, with their new etags.
  repeated ServiceAccount service_accounts = 1;
  repeated PersonLink person_links = 2;
}
