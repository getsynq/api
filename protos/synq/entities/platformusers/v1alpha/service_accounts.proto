syntax = "proto3";

package synq.entities.platformusers.v1alpha;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "synq/entities/activity/v1alpha/activity.proto";
import "synq/issues/actor/v1/actor.proto";
import "synq/platforms/v1/data_platform_types.proto";

option go_package = "github.com/getsynq/api/entities/platformusers/v1alpha";

// PopularityPolicy says whether the reads of a service account's logins count. An unset field takes
// the default of the account's purpose: loader, orchestrator, transformer, observability, catalog and
// CI reads do not count, every other purpose's do. Coalesce Quality's own queries never count,
// whatever a policy says.
message PopularityPolicy {
  // Whether the logins' reads count toward an entity's popularity. Unset takes the purpose default.
  optional bool counts_toward_popularity = 1;
  // Whether the logins may be listed among an entity's frequent users. Unset is false, as a service
  // account is not a person.
  optional bool listed_as_frequent_user = 2;
  // Output only: what applies, the policy or the purpose default.
  bool counts_toward_popularity_resolved = 3;
  // Output only: what applies.
  bool listed_as_frequent_user_resolved = 4;
}

// AdvancedMatch narrows a matcher by what the platform states about a login and by what the login
// did. Every non-empty field must match, and an empty one matches everything.
message AdvancedMatch {
  // The platform of the login.
  repeated synq.platforms.v1.DataPlatformType platforms = 1 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      enum: {defined_only: true}
    }
  }];
  // The platform instance the login lives on, such as the Snowflake account's entity id.
  repeated string platform_root_entity_ids = 2 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 2048
      }
    }
  }];
  // The kind of login the platform states, such as Snowflake's `SERVICE` or BigQuery's
  // `serviceAccount`, ignoring case.
  repeated string user_types = 3 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];
  // The domain of the email the platform states, ignoring case.
  repeated string email_domains = 4 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 256
      }
    }
  }];
  // The tools whose queries the matcher takes, from the tag a tool puts on its queries. Empty takes
  // every query of a matching login. DATA_PLATFORM_TYPE_UNSPECIFIED names the queries with no tag.
  repeated synq.platforms.v1.DataPlatformType issuers = 5 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      enum: {defined_only: true}
    }
  }];
  // The least share of the login's queries in the window, from 0 to 1, that a tool named in issuers
  // must have. Only with issuers.
  double min_issuer_share = 6 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  // Loaders whose columns the tables the login writes carry, such as Fivetran's `_fivetran_synced`.
  repeated synq.platforms.v1.DataPlatformType footprints = 7 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      enum: {defined_only: true}
    }
  }];
  // The least share, from 0 to 1, of the tables the login wrote in the window that carry a loader's
  // columns. Only with footprints.
  double min_footprint_share = 8 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
}

// Matcher selects logins. Set the simple fields first: most service accounts need only login
// patterns. Every non-empty field must match.
//
// A matcher with only platform_user_ids, and optionally advanced.issuers, is an exact matcher: it
// names logins, and wins over every other matcher and over the logins Coalesce Quality connects as.
// platform_user_ids cannot be combined with any other field, and each login and issuer can be in only
// one exact matcher of an account.
message Matcher {
  // Caller-supplied uuid, unique within the workspace.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Exact logins, by the platform_user_id PlatformUsersService returns.
  repeated string platform_user_ids = 2 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {
        min_len: 1
        max_len: 2048
      }
    }
  }];
  // Patterns over the login, `*` for any run of characters, ignoring case, such as `FIVETRAN_*`.
  repeated string logins = 3 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 256
      }
    }
  }];
  // Patterns over the email the platform states, `*` for any run of characters, ignoring case, such
  // as `*@example.com`. On BigQuery the login is the email.
  repeated string emails = 4 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 256
      }
    }
  }];
  AdvancedMatch advanced = 5;
  // Output only: the matcher uses a condition this API cannot express. Its account reads as is, and
  // a change to it is refused.
  bool internal_only = 6;
}

// ServiceAccount is a group of logins that act for one tool or purpose, such as the logins Airflow
// runs as. A login slice that a service account takes reads as the tool, not as a person, and counts
// toward popularity as the account's policy says.
//
// A login's queries are split by the tool that issued them, from the tag on each query. Each part is
// matched on its own, so a person's Looker Studio queries can belong to a shared Looker Studio
// account while the rest of their queries stay theirs.
//
// Accounts apply in order: exact matchers first, then every other matcher by the account's priority,
// highest first, then the last update, newest first, then the id. Built-in accounts apply after every
// workspace account.
message ServiceAccount {
  // A caller-supplied uuid for a workspace account. A built-in account's id starts with
  // `built_in.`, such as `built_in.fivetran`.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // The tool the logins act for, DATA_PLATFORM_TYPE_UNSPECIFIED when there is none or it is not
  // known.
  synq.platforms.v1.DataPlatformType tool_platform = 3 [(buf.validate.field).enum.defined_only = true];
  // The tool's integration entity, if the workspace has one.
  optional string tool_entity_id = 4 [(buf.validate.field).string.max_len = 2048];
  synq.entities.activity.v1alpha.Purpose purpose = 5 [(buf.validate.field).enum.defined_only = true];
  PopularityPolicy policy = 6;
  // Higher first, between accounts.
  int32 priority = 7;
  repeated Matcher matchers = 8 [(buf.validate.field).repeated.max_items = 100];
  // Output only: the account is built in. Its matchers cannot be changed, and its policy is changed
  // through ServiceAccountChanges.built_in_policies.
  bool built_in = 9;
  // Output only, on `built_in.coalesce-quality`: the former logins of Coalesce Quality, and the logins
  // claimed through ServiceAccountChanges.claim_coalesce_logins, that a person said are no longer
  // ours. Changed through ServiceAccountChanges.coalesce_logins.
  repeated string excluded_platform_user_ids = 10;
  // Output only: pass it back on a change of the account, so a concurrent change is refused rather
  // than overwritten.
  string etag = 11 [(buf.validate.field).string.max_len = 256];
  // Output only.
  synq.issues.actor.v1.Actor updated_by = 12;
  // Output only.
  google.protobuf.Timestamp created_at = 13;
  // Output only.
  google.protobuf.Timestamp updated_at = 14;
}

// PersonLink links logins to a person: the identity it makes from each login, such as
// `email:{login}@example.com`. It applies only to logins no service account takes.
//
// A person link takes only the queries a login ran with no tool's tag, unless its matcher names
// issuers. So a person who runs a BI tool on their own credentials keeps those queries as the tool's.
message PersonLink {
  // Caller-supplied uuid, unique within the workspace.
  string id = 1 [(buf.validate.field).string.uuid = true];
  string title = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // Higher first, between person links.
  int32 priority = 3;
  // Its id is the link's own, whatever is sent. platform_user_ids is not allowed here.
  Matcher matcher = 4 [(buf.validate.field).required = true];
  // The identity of the person, `{login}` standing for the login, lower-cased. Such as
  // `email:{login}@example.com`, to resolve with synq.users.v1.
  string identity_pattern = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
  // Output only: pass it back on a change of the link.
  string etag = 6 [(buf.validate.field).string.max_len = 256];
  // Output only.
  synq.issues.actor.v1.Actor updated_by = 7;
  // Output only.
  google.protobuf.Timestamp created_at = 8;
  // Output only.
  google.protobuf.Timestamp updated_at = 9;
}

// BuiltInPolicyChange sets the popularity policy of a built-in account, the one thing of a built-in
// account a workspace can change.
message BuiltInPolicyChange {
  string built_in_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // A policy with neither field set goes back to the purpose default.
  PopularityPolicy policy = 2 [(buf.validate.field).required = true];
}

// CoalesceLoginExclusion says whether a former login of Coalesce Quality, or a login claimed through
// ServiceAccountChanges.claim_coalesce_logins, is still ours. A login that a Coalesce Quality
// integration connects as now cannot be excluded.
message CoalesceLoginExclusion {
  string platform_user_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
  // True takes the login out of the Coalesce Quality account, false puts it back.
  bool excluded = 2;
}

// ServiceAccountChanges is any mix of changes to a workspace's service accounts, person links and
// policies, planned and applied as one.
message ServiceAccountChanges {
  // Each replaces the account with its id, matchers included, or creates it. Pass the etag you read
  // to replace one.
  repeated ServiceAccount upsert_service_accounts = 1 [(buf.validate.field).repeated.max_items = 1000];
  // Deleting an account deletes its matchers. Deleting one that is not there succeeds.
  repeated string delete_service_account_ids = 2 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {uuid: true}
    }
  }];
  repeated PersonLink upsert_person_links = 3 [(buf.validate.field).repeated.max_items = 1000];
  repeated string delete_person_link_ids = 4 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {uuid: true}
    }
  }];
  repeated BuiltInPolicyChange built_in_policies = 5 [(buf.validate.field).repeated.max_items = 1000];
  // Takes a former login of Coalesce Quality out of the Coalesce Quality account, or puts it back. A
  // claimed login is taken out and put back the same way.
  repeated CoalesceLoginExclusion coalesce_logins = 6 [(buf.validate.field).repeated.max_items = 1000];
  // Platform user ids of logins that run Coalesce Quality's queries although no Coalesce Quality
  // integration of the workspace connects as them. A claimed login joins the Coalesce Quality
  // account: every slice of it reads as CLASSIFICATION_COALESCE, as a login an integration connects
  // as does, and its queries never count. Each must be a platform user of the workspace. To undo a
  // claim, exclude the login through coalesce_logins: the account then lists it in
  // excluded_platform_user_ids, as an excluded former login. Claiming an excluded login puts it back.
  repeated string claim_coalesce_logins = 7 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {
        min_len: 1
        max_len: 2048
      }
    }
  }];
}
