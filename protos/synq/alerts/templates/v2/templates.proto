syntax = "proto3";

package synq.alerts.templates.v2;

import "buf/validate/validate.proto";

option go_package = "github.com/getsynq/api/alerts/templates/v2";

// AlertTemplate customises the message rendered for an alert.
//
// The body is either verbatim text (`plain`), rendered exactly as given, or a
// structured template (`structured`) assembled from named blocks written in
// Jinja-compatible syntax and grouped by where they render.
message AlertTemplate {
  // Optional custom title for the rendered message.
  string title = 1;

  // The message body. Exactly one form must be set.
  oneof body {
    option (buf.validate.oneof).required = true;

    // Verbatim message text, rendered as-is with no templating.
    string plain = 2;

    // A structured, dynamically rendered body.
    StructuredTemplate structured = 3;
  }
}

// StructuredTemplate is a dynamic template split into the two tiers a message
// renders in. Within each tier, blocks render in list order.
//
// A block that should appear in both tiers is listed in both `summary` and
// `issue_details` with the same `name`.
message StructuredTemplate {
  // Blocks rendered once, in the group/summary message.
  repeated TemplateBlock summary = 1;

  // Blocks rendered per issue, in the per-issue attachment or card.
  repeated TemplateBlock issue_details = 2;
}

// TemplateBlock is one unit of Jinja-compatible source.
message TemplateBlock {
  // Optional block name. A block listed in both `summary` and `issue_details`
  // under the same name is one shared block. Leave it unset and the server
  // assigns and returns a stable name. Names reserved for built-in catalog
  // blocks render under the server's own layout rather than emitting your
  // content verbatim, so give a custom block a distinct name.
  optional string name = 1 [(buf.validate.field).string.min_len = 1];

  // Jinja-compatible source of the block body.
  string content = 2;
}
