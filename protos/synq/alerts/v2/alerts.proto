syntax = "proto3";

package synq.alerts.v2;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "synq/alerts/templates/v2/templates.proto";
import "synq/alerts/v2/targets.proto";
import "synq/incidents/v1/incidents.proto";
import "synq/queries/v1/query.proto";
import "synq/v1/severity.proto";

option go_package = "github.com/getsynq/api/alerts/v2";

// Alert represents the configuration for an alert.
//
// An alert is exactly one concrete kind, distinguished by the `kind` oneof:
//   - `issue_lifecycle`: fires on the issues of selected entities.
//   - `schema_change`: fires on the schema changes of selected entities.
//   - `incident_lifecycle`: fires on incident state transitions.
// The identity, template and ownership fields are shared; everything specific to
// how an alert triggers and delivers lives on its kind message.
//
// Incident-owner alerts (which notify each incident's owner) are not configurable
// and are not represented here; they are turned on or off with
// AlertsService.ToggleIncidentOwnerAlert.
message Alert {
  reserved 4, 5, 6, 7;
  reserved "trigger", "targets", "settings", "owner";

  // Unique identifier for the alert config (system-generated).
  string id = 1 [(buf.validate.field).string = {min_len: 1}];

  // Human-readable name for the alert configuration.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];

  // User-provided fully qualified name for the alert config.
  // This is a unique identifier that users can specify to reference the alert.
  optional string fqn = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];

  // Timestamp when the alert config was created.
  google.protobuf.Timestamp created_at = 8 [(buf.validate.field).required = true];

  // Whether the alert config is currently disabled.
  bool is_disabled = 9;

  // Optional custom template for the rendered alert message. Common to every
  // alert kind. Currently applied only to issue alerts; on other kinds it is
  // accepted and ignored until templating is supported for them.
  optional synq.alerts.templates.v2.AlertTemplate template = 10;

  // The alert kind. Exactly one must be specified.
  oneof kind {
    option (buf.validate.oneof).required = true;

    // Fires on the issues of selected entities.
    IssueLifecycleAlert issue_lifecycle = 11;
    // Fires on the schema changes of selected entities.
    SchemaChangeAlert schema_change = 12;
    // Fires on incident state transitions.
    IncidentLifecycleAlert incident_lifecycle = 13;
  }
}

// Owner attributes an alert to an owner and ownership. Only entity-scoped alerts
// (issue and schema change) can be owned.
message Owner {
  // Path identifying the owner of this alert config.
  string owner_path = 1 [(buf.validate.field).string = {min_len: 1}];
  // Ownership identifier.
  string ownership_id = 2 [(buf.validate.field).string = {min_len: 1}];
}

// IssueLifecycleAlert fires on the issues of the entities its trigger selects.
message IssueLifecycleAlert {
  option (buf.validate.message).cel = {
    id: "issue_lifecycle_alert.webhook_incompatible_with_ongoing_alerts"
    message: "Webhook targets are not compatible with the schedule ongoing strategy. Use the disabled or stream ongoing strategy when sending alerts to webhook targets."
    expression:
      "!this.targets.exists(t, has(t.webhook)) || "
      "!has(this.settings.ongoing.schedule)"
  };
  option (buf.validate.message).cel = {
    id: "issue_lifecycle_alert.webhook_incompatible_with_grouped_alerts"
    message: "Webhook targets are not compatible with grouped alerts. Use the no_grouping strategy when sending alerts to webhook targets."
    expression:
      "!this.targets.exists(t, has(t.webhook)) || "
      "!has(this.settings.grouping) || "
      "has(this.settings.grouping.no_grouping)"
  };

  // Selects the entities that can trigger this alert.
  Trigger trigger = 1 [(buf.validate.field).required = true];

  // Targets where alerts will be sent. At least one is required.
  repeated AlertingTarget targets = 2 [(buf.validate.field).repeated = {min_items: 1}];

  // Issue alert settings.
  IssueAlertSettings settings = 3 [(buf.validate.field).required = true];

  // Optional owner information. The owner is fixed when the alert is created.
  optional Owner owner = 4;
}

// SchemaChangeAlert fires on the schema changes of the entities its trigger
// selects.
message SchemaChangeAlert {
  option (buf.validate.message).cel = {
    id: "schema_change_alert.webhook_unsupported"
    message: "Webhook targets are not supported on schema change alerts. Use email, Slack, or Microsoft Teams targets."
    expression: "!this.targets.exists(t, has(t.webhook))"
  };

  // Selects the entities that can trigger this alert.
  Trigger trigger = 1 [(buf.validate.field).required = true];

  // Targets where alerts will be sent. At least one is required.
  repeated AlertingTarget targets = 2 [(buf.validate.field).repeated = {min_items: 1}];

  // Schema change alert settings.
  SchemaChangeAlertSettings settings = 3 [(buf.validate.field).required = true];

  // Optional owner information. The owner is fixed when the alert is created.
  optional Owner owner = 4;
}

// IncidentLifecycleAlert fires when an incident transitions into one of the
// selected states. It takes no entity selection.
message IncidentLifecycleAlert {
  option (buf.validate.message).cel = {
    id: "incident_lifecycle_alert.email_or_msteams_unsupported"
    message: "Email and Microsoft Teams targets are not supported on incident lifecycle alerts. Use Slack or webhook targets."
    expression: "!this.targets.exists(t, has(t.email) || has(t.ms_teams))"
  };

  // Targets where alerts will be sent. At least one is required.
  repeated AlertingTarget targets = 1 [(buf.validate.field).repeated = {min_items: 1}];

  // Incident lifecycle alert settings.
  IncidentLifecycleAlertSettings settings = 2 [(buf.validate.field).required = true];
}

// Trigger selects the entities whose issues or schema changes fire this alert:
// a structured `query`, an optional ResolverQL string that takes precedence when
// set, and a read-only canonical rendering.
message Trigger {
  option (buf.validate.message).cel = {
    id: "trigger.requires_selection"
    message: "at least one of query or resolver_ql must be set"
    expression: "this.query.parts.size() > 0 || this.resolver_ql.size() > 0"
  };

  // Structured selection of the entities that can trigger this alert. On write it is
  // the selection unless `resolver_ql` is set, which takes precedence. Always populated
  // on read, best-effort — a part with no public form is carried as `unsupported`.
  synq.queries.v1.Query query = 1;

  // ResolverQL selection string, a more expressive alternative to `query` for selections
  // it cannot express (e.g. lineage walks, column predicates). When set on write it takes
  // precedence and `query` is ignored. On read it is echoed back verbatim for alerts
  // authored via ResolverQL and empty for structured alerts, so writing a read response
  // back unchanged preserves the authored form. See `rendered_resolver_ql` for the
  // ResolverQL form of a structured alert.
  string resolver_ql = 2 [(buf.validate.field).string = {max_len: 20000}];

  // Output-only canonical ResolverQL rendering of this alert's selection, populated
  // regardless of how it was authored (it equals `resolver_ql` for ResolverQL-authored
  // alerts). Ignored on write. Empty only for selections with no ResolverQL representation.
  string rendered_resolver_ql = 3;
}

// IncidentLifecycleAlertSettings configures an alert that fires when an incident
// enters one of the selected states.
message IncidentLifecycleAlertSettings {
  // Incident states whose transitions fire this alert; an empty list would
  // create an alert that never fires.
  repeated synq.incidents.v1.Incident.State states = 1 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
}

// IssueAlertSettings is the unified alert settings type for issue-based alerts.
message IssueAlertSettings {
  // The severity levels that should trigger this alert.
  repeated synq.v1.Severity severities = 1 [(buf.validate.field).repeated = {min_items: 1}];

  // Whether to notify upstream dependencies when this alert triggers.
  bool notify_upstream = 2;

  // Whether to allow SQL test audit links in alert notifications.
  bool allow_sql_test_audit_link = 3;

  // Strategy for handling ongoing/repeated alerts.
  OngoingAlertsStrategy ongoing = 4 [(buf.validate.field).required = true];

  // Strategy for grouping issues in alert notifications.
  IssueGroupingStrategy grouping = 5;

  // Optional customisation of the sender and reply-to addresses on email alerts.
  optional EmailCustomizationOptions email_customization_options = 6;
}

// EmailCustomizationOptions customises the addresses used when an alert is
// delivered by email. Unset addresses fall back to the workspace defaults.
message EmailCustomizationOptions {
  // Sender address emails are sent from.
  optional EmailSender from = 1;
  // Reply-to address for emails.
  optional EmailSender reply_to = 2;
}

// EmailSender is an email address paired with an optional display name.
message EmailSender {
  // Email address.
  string email = 1 [(buf.validate.field).string = {min_len: 1}];
  // Display name shown alongside the address.
  string name = 2;
}

// IssueGroupingStrategy controls how issues are grouped for alerting purposes.
message IssueGroupingStrategy {
  // NoGrouping - each issue triggers a separate alert.
  message NoGrouping {}
  // SystemDetected - the system automatically groups related issues.
  message SystemDetected {}

  // The grouping strategy to use. Exactly one must be specified.
  oneof strategy {
    option (buf.validate.oneof).required = true;

    NoGrouping no_grouping = 1;
    SystemDetected system_detected = 2;
  }
}

// SchemaChangeAlertSettings configures alerts for schema changes.
// This alert triggers when the schema of monitored entities changes.
message SchemaChangeAlertSettings {
  option (buf.validate.message).cel = {
    id: "schema_change_alert_settings.ongoing_disabled_unsupported"
    message: "Schema change alerts do not support the disabled ongoing strategy. Leave ongoing unset for per-change streaming, or set stream or schedule."
    expression: "!has(this.ongoing) || !has(this.ongoing.disabled)"
  };

  // Whether to notify upstream dependencies when schema changes occur.
  bool notify_upstream = 2;

  // Delivery strategy. Unset or stream sends one alert per schema change; a schedule
  // batches them into a periodic digest on the given cron cadence.
  OngoingAlertsStrategy ongoing = 3;
}

// OngoingAlertsStrategy defines how to handle ongoing/repeated alerts.
// This prevents alert spam by controlling notification frequency.
message OngoingAlertsStrategy {
  // Disabled strategy - no ongoing alerts will be sent after the initial alert.
  message Disabled {
    // No configuration needed - alerts are simply disabled after the first one.
  }

  // Stream strategy - alerts are sent continuously as issues persist.
  message Stream {
    // No configuration needed - alerts stream continuously.
  }

  // Schedule strategy - alerts are sent on a scheduled basis.
  message Schedule {
    // Cron expression defining when ongoing alerts should be sent.
    // Must be a valid cron expression (e.g., "0 9 * * MON" for every Monday at 9 AM).
    string cron = 1 [(buf.validate.field).string = {min_len: 1}];
  }

  // The strategy to use for ongoing alerts. Exactly one must be specified.
  oneof strategy {
    option (buf.validate.oneof).required = true;

    Disabled disabled = 1;
    Stream stream = 2;
    Schedule schedule = 3;
  }
}
