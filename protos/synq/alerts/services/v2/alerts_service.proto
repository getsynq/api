syntax = "proto3";

package synq.alerts.services.v2;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "synq/alerts/templates/v2/templates.proto";
import "synq/alerts/v2/alerts.proto";
import "synq/alerts/v2/targets.proto";
import "synq/v1/scope_authorization.proto";

option go_package = "github.com/getsynq/api/alerts/services/v2";

// AlertsService provides operations for managing alert configurations.
//
// It supersedes synq.alerts.services.v1.AlertsService: entities are selected with
// the canonical synq.queries.v1.Query + resolver_ql trigger rather than the bespoke
// EntityGroupQuery.
service AlertsService {
  // Create a new alert configuration.
  rpc Create(CreateRequest) returns (CreateResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {
      post: "/api/alerts/v2"
      body: "*"
    };
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_ALERTS_EDIT]
    };
  }

  // Retrieves a list of alert configurations based on filters.
  rpc List(ListRequest) returns (ListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      post: "/api/alerts/v2/list"
      body: "*"
    };
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_ALERTS_READ]
    };
  }

  // Get multiple alert configurations by their identifiers.
  rpc BatchGet(BatchGetRequest) returns (BatchGetResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      post: "/api/alerts/v2/get"
      body: "*"
    };
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_ALERTS_READ]
    };
  }

  // Rename an existing alert configuration.
  // The config can be identified by either ID or FQN.
  rpc Rename(RenameRequest) returns (RenameResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {
      post: "/api/alerts/v2/rename"
      body: "*"
    };
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_ALERTS_EDIT]
    };
  }

  // Replace the delivery targets of an existing alert configuration.
  // The config can be identified by either ID or FQN.
  rpc UpdateTargets(UpdateTargetsRequest) returns (UpdateTargetsResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {
      post: "/api/alerts/v2/targets"
      body: "*"
    };
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_ALERTS_EDIT]
    };
  }

  // Update the trigger and/or the kind-specific settings of an alert.
  // The config can be identified by either ID or FQN.
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {
      post: "/api/alerts/v2/settings"
      body: "*"
    };
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_ALERTS_EDIT]
    };
  }

  // Set or clear the message template of an existing alert configuration.
  // The config can be identified by either ID or FQN.
  rpc UpdateTemplate(UpdateTemplateRequest) returns (UpdateTemplateResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {
      post: "/api/alerts/v2/template"
      body: "*"
    };
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_ALERTS_EDIT]
    };
  }

  // Delete an existing alert configuration.
  // The config can be identified by either ID or FQN.
  rpc Delete(DeleteRequest) returns (DeleteResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {
      delete: "/api/alerts/v2"
      body: "*"
    };
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_ALERTS_EDIT]
    };
  }

  // Enables or disables an existing alert configuration.
  // The config can be identified by either ID or FQN.
  rpc ToggleEnabled(ToggleEnabledRequest) returns (ToggleEnabledResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {
      post: "/api/alerts/v2/toggle"
      body: "*"
    };
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_ALERTS_EDIT]
    };
  }

  // Turns the workspace's incident-owner alert on or off. This alert notifies
  // each incident's owner on its configured channels and has no other
  // configuration, so it is managed here rather than through Create / Delete and
  // does not appear in List or BatchGet.
  rpc ToggleIncidentOwnerAlert(ToggleIncidentOwnerAlertRequest) returns (ToggleIncidentOwnerAlertResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {
      post: "/api/alerts/v2/incident-owner"
      body: "*"
    };
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_ALERTS_EDIT]
    };
  }

  // Delivers a static test message to the given targets so you can confirm that
  // delivery reaches each channel before relying on a real alert. Nothing is
  // stored and the targets need not belong to a saved alert, so this can be
  // called while an alert is still being authored.
  rpc SendTestAlert(SendTestAlertRequest) returns (SendTestAlertResponse) {
    // Every call sends real messages, so a retry sends again.
    option idempotency_level = IDEMPOTENCY_UNKNOWN;
    option (google.api.http) = {
      post: "/api/alerts/v2/test"
      body: "*"
    };
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_ALERTS_EDIT]
    };
  }
}

// CreateRequest creates a new alert configuration. The `kind` oneof carries the
// full specification of the alert; its target and trigger constraints are
// enforced on the concrete kind messages.
//
// Incident-owner alerts are not created here — turn them on with
// ToggleIncidentOwnerAlert.
message CreateRequest {
  reserved 3, 4, 5, 6;
  reserved "trigger", "targets", "settings", "owner";

  // Human-readable name for the alert configuration.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];

  // User-provided fully qualified name for the alert config.
  // This is a unique identifier that users can specify to reference the alert.
  string fqn = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];

  // Optional custom template for the rendered alert message. Common to every
  // alert kind; currently applied only to issue alerts.
  optional synq.alerts.templates.v2.AlertTemplate template = 7;

  // The alert to create. Exactly one kind must be specified.
  oneof kind {
    option (buf.validate.oneof).required = true;

    // An issue alert on selected entities.
    synq.alerts.v2.IssueLifecycleAlert issue_lifecycle = 8;
    // A schema change alert on selected entities.
    synq.alerts.v2.SchemaChangeAlert schema_change = 9;
    // An incident lifecycle alert.
    synq.alerts.v2.IncidentLifecycleAlert incident_lifecycle = 10;
  }
}

// CreateResponse returns the created alert configuration.
message CreateResponse {
  // The alert configuration that was created.
  synq.alerts.v2.Alert alert = 1 [(buf.validate.field).required = true];
}

message AlertIdentifier {
  oneof identifier {
    option (buf.validate.oneof).required = true;

    // ID of the alert configuration to update.
    string id = 1 [(buf.validate.field).string = {min_len: 1}];
    // FQN of the alert configuration to update.
    string fqn = 2 [(buf.validate.field).string = {
      min_len: 1
      max_len: 500
    }];
  }
}

// RenameRequest changes an alert's human-readable name.
message RenameRequest {
  // Identifier for the config to rename.
  AlertIdentifier identifier = 1 [(buf.validate.field).required = true];

  // New human-readable name for the alert configuration.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
}

// RenameResponse returns the renamed alert configuration.
message RenameResponse {
  // The alert configuration that was renamed.
  synq.alerts.v2.Alert alert = 1 [(buf.validate.field).required = true];
}

// UpdateTargetsRequest replaces an alert's delivery targets.
message UpdateTargetsRequest {
  // Identifier for the config to update.
  AlertIdentifier identifier = 1 [(buf.validate.field).required = true];

  // The complete set of delivery targets, replacing the existing ones. At least
  // one target is required; the allowed target types depend on the alert's kind.
  repeated synq.alerts.v2.AlertingTarget targets = 2;
}

// UpdateTargetsResponse returns the updated alert configuration.
message UpdateTargetsResponse {
  // The alert configuration that was updated.
  synq.alerts.v2.Alert alert = 1 [(buf.validate.field).required = true];
}

// UpdateSettingsRequest updates an alert's trigger and/or its kind-specific
// settings. At least one of the two must be provided; whichever is omitted is
// left unchanged (neither can be cleared). The provided settings must match the
// alert's existing kind — switching an alert from one kind to another is not
// permitted.
message UpdateSettingsRequest {
  option (buf.validate.message).cel = {
    id: "update_settings.at_least_one_facet"
    message: "At least one of trigger or settings must be set."
    expression:
      "has(this.trigger) || has(this.issue_lifecycle) || "
      "has(this.schema_change) || has(this.incident_lifecycle)"
  };
  option (buf.validate.message).cel = {
    id: "update_settings.trigger_requires_entity"
    message: "A trigger applies to entity alerts only and cannot be set together with incident lifecycle settings."
    expression: "!has(this.trigger) || !has(this.incident_lifecycle)"
  };

  // Identifier for the config to update.
  AlertIdentifier identifier = 1 [(buf.validate.field).required = true];

  // New entity selection. Issue and schema change alerts only. Omit to keep the
  // current trigger; it cannot be cleared.
  optional synq.alerts.v2.Trigger trigger = 2;

  // New kind-specific settings. Omit to keep the current settings. Must match
  // the alert's existing kind.
  oneof settings {
    // Settings for an issue alert.
    synq.alerts.v2.IssueAlertSettings issue_lifecycle = 3;
    // Settings for a schema change alert.
    synq.alerts.v2.SchemaChangeAlertSettings schema_change = 4;
    // Settings for an incident lifecycle alert.
    synq.alerts.v2.IncidentLifecycleAlertSettings incident_lifecycle = 5;
  }
}

// UpdateSettingsResponse returns the updated alert configuration.
message UpdateSettingsResponse {
  // The alert configuration that was updated.
  synq.alerts.v2.Alert alert = 1 [(buf.validate.field).required = true];
}

// UpdateTemplateRequest sets or clears an alert's message template.
message UpdateTemplateRequest {
  // Identifier for the config to update.
  AlertIdentifier identifier = 1 [(buf.validate.field).required = true];

  // New custom template for the rendered alert message. Omit to clear the
  // template and revert to the default rendering. Currently applied only to
  // issue alerts; accepted and ignored for other kinds.
  optional synq.alerts.templates.v2.AlertTemplate template = 2;
}

// UpdateTemplateResponse returns the updated alert configuration.
message UpdateTemplateResponse {
  // The alert configuration that was updated.
  synq.alerts.v2.Alert alert = 1 [(buf.validate.field).required = true];
}

// DeleteRequest specifies which alert configuration to delete.
// The config can be identified by either ID or FQN.
message DeleteRequest {
  // Identifier for the config to delete.
  AlertIdentifier identifier = 1 [(buf.validate.field).required = true];
}

// DeleteResponse confirms the deletion (empty response).
message DeleteResponse {
  // Empty response - successful deletion is indicated by HTTP 200 status.
}

// ToggleEnabledRequest enables or disables an alert configuration.
// The config can be identified by either ID or FQN.
message ToggleEnabledRequest {
  // Identifier for the config to toggle.
  AlertIdentifier identifier = 1 [(buf.validate.field).required = true];

  // Whether the alert configuration should be enabled.
  // true = enable the alert, false = disable the alert.
  bool is_enabled = 2;
}

// ToggleEnabledResponse confirms the toggle operation (empty response).
message ToggleEnabledResponse {
  // Empty response - successful toggle is indicated by HTTP 200 status.
}

// ToggleIncidentOwnerAlertRequest turns the workspace's incident-owner alert on
// or off.
message ToggleIncidentOwnerAlertRequest {
  // true turns the incident-owner alert on (creating it if absent); false turns
  // it off (removing it). Setting the current state is a no-op.
  bool is_enabled = 1;
}

// ToggleIncidentOwnerAlertResponse reports the resulting state.
message ToggleIncidentOwnerAlertResponse {
  // Whether the incident-owner alert is on after the call.
  bool is_enabled = 1;
}

// ListRequest filters alert configurations to retrieve.
message ListRequest {
  // Optional filter by owner of the alert configurations. Only issue and schema
  // change alerts carry an owner; filtering by owner therefore returns those only.
  optional synq.alerts.v2.Owner owner = 1;
}

// ListResponse returns the filtered list of alert configurations.
message ListResponse {
  // The list of alert configurations matching the filter criteria.
  repeated string alerts_ids = 1;
}

message BatchGetRequest {
  // IDs of the alerts to get.
  repeated AlertIdentifier identifiers = 1 [(buf.validate.field).repeated = {min_items: 1}];
}

message BatchGetResponse {
  // Alerts mapped by their identifiers.
  map<string, synq.alerts.v2.Alert> alerts = 1;
}

// The alert kind a test message stands in for. It only selects the wording of
// the message; the targets receive the same static test regardless.
enum TestAlertKind {
  // Generic wording ("your alerts will be sent here").
  TEST_ALERT_KIND_UNSPECIFIED = 0;
  // Wording for an alert on issues.
  TEST_ALERT_KIND_ISSUE_LIFECYCLE = 1;
  // Wording for an alert on schema changes.
  TEST_ALERT_KIND_SCHEMA_CHANGE = 2;
  // Wording for an alert on incidents.
  TEST_ALERT_KIND_INCIDENT_LIFECYCLE = 3;
}

// SendTestAlertRequest delivers a static test message to the given targets.
message SendTestAlertRequest {
  // Alert name shown in the test message. Optional — leave empty while an alert
  // is still being created; the message then omits the name.
  string name = 1 [(buf.validate.field).string.max_len = 255];

  // The alert kind the test stands in for. Optional; selects the message wording
  // only, so an unspecified kind produces a generic test message.
  TestAlertKind kind = 2 [(buf.validate.field).enum.defined_only = true];

  // The targets to deliver the test message to. At least one is required. Owner
  // targets are expanded to each owner's configured channels.
  repeated synq.alerts.v2.AlertingTarget targets = 3 [(buf.validate.field).repeated.min_items = 1];
}

// SendTestAlertResponse reports the per-target outcome of the test send.
message SendTestAlertResponse {
  // One entry per delivered target, in the order they were resolved. Owner
  // targets contribute one entry per resolved channel.
  repeated TestAlertDispatch dispatches = 1;
}

// TestAlertDispatch is the outcome of delivering the test message to one target.
message TestAlertDispatch {
  // The resolved target this outcome refers to.
  synq.alerts.v2.AlertingTarget target = 1;

  // True once the message was handed to the delivery channel; the delivery
  // itself is asynchronous, so this does not confirm the recipient received it.
  bool dispatched = 2;

  // Why this target was not dispatched; empty when dispatched is true.
  string error = 3;
}
