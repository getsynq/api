syntax = "proto3";

package synq.overlays.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "synq/v1/scope_authorization.proto";

option go_package = "github.com/getsynq/api/overlays/v1";

// OverlaysService answers which organizational overlays claim an entity.
//
// An overlay is a grouping you lay over your catalog rather than something the
// warehouse itself knows about. Two kinds exist today: a **data product**, which
// groups the assets that make up something your organization delivers, and an
// **owner**, which names the person or team responsible for a set of assets and
// where alerts about them go. Each is defined by a membership rule, not by an
// explicit list, so what belongs to one changes as your warehouse does.
//
// "Owner" here means stewardship — who is accountable for an asset and who hears
// about it when something breaks. It is not the structural containment sense the
// word carries elsewhere in the API, where an asset can be said to own the checks
// and monitors declared on it. Nothing this service returns describes that
// relationship.
//
// This service reads that membership backwards. The defining services answer
// "what is in this data product"; this one answers "which data products and
// owners claim this table" — the question you have when you are looking at one
// asset and want to know who cares about it and what it feeds.
//
// Membership follows identity. Where the same table is represented more than
// once in your catalog — a transformation model and the warehouse table it
// builds — an overlay whose rule matches one of them claims the others too. So
// an alert routed by ownership reaches the responsible party whichever
// representation raised it, and you do not have to know which one a rule was
// written against.
//
// Two consequences worth planning around. You can ask about whichever
// representation you happen to hold and get the same answer, so there is no need
// to resolve an identity group first. And if you do ask about several members of
// one group in a single call, each comes back with its own entry carrying the
// same overlays — correct, but redundant, so ask about one member per group when
// you are near the request limit.
//
// Related services:
//   - `synq.dataproducts.v2.DataproductsService` and `synq.owners.v1.OwnersService`
//     define the overlays read here, and turn an id from a response into a name,
//     a description and its contact channels.
//   - `synq.entities.resolve.v1.IdentifierResolveService` turns an identifier you
//     already hold — a warehouse table name, a dbt model — into the `entity_id`
//     these calls take.
service OverlaysService {
  // For each entity, list every overlay that claims it.
  //
  // The response has one entry per requested id, in the order you asked, so you
  // can match results positionally and never have to tell "absent" from "empty".
  // An entity that belongs to no overlay comes back with empty lists.
  //
  // Freshness. Which overlays exist and what they are attached to is up to date
  // the moment you change it — create an overlay, delete one, point an ownership
  // at a different data product, and the next call reflects it. What each
  // overlay *contains* is recomputed periodically, so an asset that newly
  // satisfies an existing rule — a table appearing in a folder a rule watches —
  // shows up shortly afterwards rather than instantly.
  //
  // Returns PERMISSION_DENIED if your credential can read neither data products
  // nor owners. If it can read one but not the other, the call succeeds and the
  // list you may not read comes back empty rather than failing.
  rpc BatchGetEntityOverlays(BatchGetEntityOverlaysRequest) returns (BatchGetEntityOverlaysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_OWNERS_READ,
        SCOPE_DATAPRODUCT_READ,
        SCOPE_SRE_AGENT,
        SCOPE_MCP_READ
      ]
    };
    option (google.api.http) = {
      post: "/api/overlays/v1/by-id"
      body: "*"
    };
  }

  // Count the members of each named overlay.
  //
  // The cheap way to answer "how big is this" — use it for a summary line or a
  // badge. When you need the assets themselves, list them through the service
  // that defines the overlay.
  //
  // Counts distinct members, so an owner responsible for two data products that
  // overlap is not charged twice for the assets they share.
  //
  // Same freshness as `BatchGetEntityOverlays`: counts follow the periodic
  // recomputation of what each overlay contains.
  //
  // Returns PERMISSION_DENIED if your credential can read neither data products
  // nor owners.
  rpc BatchGetOverlayMemberCounts(BatchGetOverlayMemberCountsRequest) returns (BatchGetOverlayMemberCountsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_OWNERS_READ,
        SCOPE_DATAPRODUCT_READ,
        SCOPE_SRE_AGENT,
        SCOPE_MCP_READ
      ]
    };
    option (google.api.http) = {
      post: "/api/overlays/v1/member-counts"
      body: "*"
    };
  }
}

message BatchGetEntityOverlaysRequest {
  // The entities to ask about: 1 to 1000 ids, no duplicates.
  //
  // An `entity_id` is opaque. Take one from any listing or search response, or
  // from `synq.entities.resolve.v1.IdentifierResolveService` if what you hold is
  // a warehouse table name or a model name, and pass it back unchanged. Do not
  // build one yourself or parse one apart — the format carries no meaning you can
  // rely on and is not part of this contract.
  repeated string entity_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 1000
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 2048
      }
    }
  }];
}

// EntityOverlays is one entity and the overlays claiming it, one list per kind.
//
// Kinds are separate lists rather than one tagged list because what you can do
// with an id depends on its kind: an owner id reads through the owners service, a
// data-product id through the data-products service.
message EntityOverlays {
  // The entity this entry answers for, echoed back from the request.
  string entity_id = 1;

  // Owners responsible for this entity — the parties an alert about it reaches.
  // Read their names and contact channels with `synq.owners.v1.OwnersService`.
  //
  // Empty when no owner claims the entity, and also when your credential may not
  // read owners. Order is not significant and may change between calls; sort if
  // you display them.
  repeated string owner_entity_ids = 2;

  // Data products this entity belongs to. Read their names and definitions with
  // `synq.dataproducts.v2.DataproductsService`.
  //
  // Empty when the entity is in no data product, and also when your credential
  // may not read data products. Order is not significant and may change between
  // calls; sort if you display them.
  repeated string dataproduct_entity_ids = 3;
}

message BatchGetEntityOverlaysResponse {
  // One entry per requested entity, in the order they were requested.
  repeated EntityOverlays entities = 1;
}

message BatchGetOverlayMemberCountsRequest {
  // The overlays to count: 1 to 1000 ids, no duplicates.
  //
  // Opaque ids, as returned by `BatchGetEntityOverlays` or by the listing calls
  // of the service that defines the overlay. Data products and owners may be
  // mixed freely in one request.
  repeated string overlay_entity_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 1000
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 2048
      }
    }
  }];
}

message OverlayMemberCount {
  // The overlay this entry answers for, echoed back from the request.
  string overlay_entity_id = 1;

  // How many distinct entities belong to it.
  //
  // Zero covers every case where there is nothing to count: an overlay with no
  // members, an id that does not exist, and an id your credential may not read.
  // If you need to tell those apart, read the overlay itself through the service
  // that defines it.
  int64 member_count = 2;
}

message BatchGetOverlayMemberCountsResponse {
  // One entry per requested overlay, in the order they were requested.
  repeated OverlayMemberCount overlays = 1;
}
