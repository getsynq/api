syntax = "proto3";
package synq.monitors.history.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "synq/monitors/history/v1/predictions.proto";
import "synq/v1/scope_authorization.proto";
// import "synq/entities/v1/identifier.proto";

option go_package = "github.com/getsynq/api/monitors/history/v1";

service HistoryService {
  rpc History(HistoryRequest) returns (HistoryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_MONITORS_READ,
        SCOPE_SRE_AGENT,
        SCOPE_MCP_READ
      ]
    };
    // Query param, not a path capture: synq paths contain ":" which HTTP
    // transcoding treats as a custom-method verb, so /{monitor_path} 404s.
    option (google.api.http) = {get: "/api/monitors/history/v1"};
  }
}

message HistoryRequest {
  // Monitor synq path (e.g. monitor::integration::db::schema::table::volume).
  // REST clients pass this as the `monitorPath` query parameter.
  string monitor_path = 1;

  int32 metrics_version = 3;
  repeated string segments = 4;
  google.protobuf.Timestamp from = 5;
  google.protobuf.Timestamp to = 6;
}

message HistoryResponse {
  repeated synq.monitors.history.v1.Prediction predictions = 1;
}
