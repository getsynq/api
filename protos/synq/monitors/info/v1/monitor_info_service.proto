syntax = "proto3";
package synq.monitors.info.v1;

import "google/api/annotations.proto";
import "synq/entities/v1/identifier.proto";
import "synq/monitors/info/v1/monitor_info.proto";
import "synq/v1/scope_authorization.proto";

option go_package = "github.com/getsynq/api/monitors/info/v1";

service MonitorInfoService {
  rpc MonitorInfo(MonitorInfoRequest) returns (MonitorInfoResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_MONITORS_READ,
        SCOPE_SRE_AGENT,
        SCOPE_MCP_READ
      ]
    };
    option (google.api.http) = {get: "/api/monitors/info/v1"};
  }
}

message MonitorInfoRequest {
  // Identifier of the monitor, or of a monitor-like entity such as a dbt test or
  // a SQL test. Its `synq_path` spelling also accepts a custom monitor's own id,
  // in either of the forms `monitor_id` takes.
  synq.entities.v1.Identifier id = 1;

  // Id of a custom monitor, as `synq.monitors.custom_monitors.v1.ListMonitors`
  // returns it and `BatchUpdateMonitor` takes it. Accepts the bare UUID or the
  // `custom-<uuid>` form. An alternative to `id` rather than an addition to it:
  // setting both is an error.
  optional string monitor_id = 2;
}

message MonitorInfoResponse {
  optional MonitorInfo monitor_info = 2;
}
