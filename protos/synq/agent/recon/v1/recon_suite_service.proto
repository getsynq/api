syntax = "proto3";

package synq.agent.recon.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "synq/agent/recon/v1/recon_suite.proto";
import "synq/agent/recon/v1/recon_suite_config.proto";
import "synq/agent/recon/v1/recon_suite_deployment_service.proto";
import "synq/agent/recon/v1/recon_suite_validation.proto";
import "synq/issues/actor/v1/actor.proto";
import "synq/v1/pagination.proto";
import "synq/v1/scope_authorization.proto";

option go_package = "github.com/getsynq/api/agent/recon/v1";

// SuiteConfigService manages reconciliation suite configurations.
// Managed suites are long-lived, optionally scheduled configs identified by suite_name.
// Ad-hoc suites are one-off configs that get a generated UUID as suite_id.
service SuiteConfigService {
  // Upsert a managed suite config. Creates if new, updates with new version if exists.
  // The suite_id equals the suite name (from ReconciliationSuite.name).
  // Validates the ReconciliationSuite proto. Does NOT validate connections exist.
  // A suite with `reporting.level: detailed` gets INVALID_ARGUMENT with a
  // SuiteValidationFailure detail. To find all other problems before you save,
  // call YamlService.ValidateSuite.
  //
  // Use expected_state_at or create_only to save only when a condition is
  // true. Without them, the save replaces the suite that is stored.
  rpc UpsertSuiteConfig(UpsertSuiteConfigRequest) returns (UpsertSuiteConfigResponse) {
    option idempotency_level = IDEMPOTENT;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_RECON_EDIT,
        SCOPE_INGEST_RECON
      ]
    };
  }

  // Submit an ad-hoc suite for one-off execution.
  // Provide either an inline suite or a suite_id referencing an existing managed suite.
  // Optionally apply environment overrides before execution.
  // The client-provided invocation_id ensures idempotency.
  rpc SubmitAdhocSuite(SubmitAdhocSuiteRequest) returns (SubmitAdhocSuiteResponse) {
    option idempotency_level = IDEMPOTENT;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_RECON_EDIT,
        SCOPE_INGEST_RECON
      ]
    };
  }

  // Get the latest version of a suite config by suite_id.
  // Works for both managed (suite_id = suite_name) and ad-hoc (suite_id = UUID) configs.
  rpc GetSuiteConfig(GetSuiteConfigRequest) returns (GetSuiteConfigResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_RECON_READ,
        SCOPE_INGEST_RECON,
        SCOPE_MCP_READ
      ]
    };
  }

  // List latest suite configs with filtering and pagination.
  // By default returns only managed suites. Set include_adhoc to also include ad-hoc configs.
  rpc ListSuiteConfigs(ListSuiteConfigsRequest) returns (ListSuiteConfigsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_RECON_READ,
        SCOPE_INGEST_RECON,
        SCOPE_MCP_READ
      ]
    };
  }

  // Delete a managed suite config (soft delete — inserts a deleted version).
  rpc DeleteSuiteConfig(DeleteSuiteConfigRequest) returns (DeleteSuiteConfigResponse) {
    option idempotency_level = IDEMPOTENT;
    option (synq.v1.scope_authorization) = {
      scopes: [SCOPE_RECON_EDIT]
    };
  }

  // Get version history for a suite config.
  rpc ListSuiteConfigVersions(ListSuiteConfigVersionsRequest) returns (ListSuiteConfigVersionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_RECON_READ,
        SCOPE_MCP_READ
      ]
    };
  }

  // Get a specific historical version of a suite config.
  rpc GetSuiteConfigVersion(GetSuiteConfigVersionRequest) returns (GetSuiteConfigVersionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_RECON_READ,
        SCOPE_MCP_READ
      ]
    };
  }

  // CheckSuiteInWarehouse checks a suite against the warehouses of its
  // connections and gives all the problems that it finds. Each problem has the
  // path of its field, in the same form as YamlService.ValidateSuite. The
  // suite is not saved and does not run.
  //
  // CheckSuiteInWarehouse does the same checks as
  // `synq-recon check-config --db`:
  //   - It opens each connection.
  //   - It plans each source, target and cutoff query. The warehouse plans the
  //     query with `LIMIT 0` or its own describe statement, so no table is
  //     scanned. A query that refers to a table or column that does not exist
  //     is an error.
  //   - For each row_checksum reconciliation with comparison settings, it
  //     compares the column types of the two sides. Each column that its
  //     settings cannot be applied to is an error, for example a column with
  //     `numeric_scale: exact` that has a different scale on each side.
  //   - It reads the table metadata of each side that is a table. A key
  //     column that no index, partition or sort key covers is a warning.
  //
  // A suite that ValidateSuite finds an error in is not checked against a
  // warehouse. The response then has those errors.
  //
  // Each connection binds to an integration in the same way as for
  // SubmitAdhocSuite: from connection_mappings, else from the workspace
  // integration with the same name. If a connection does not bind, the call
  // fails with FAILED_PRECONDITION and a ConnectionResolutionFailure detail.
  // This includes a workspace where ad-hoc reconciliation runs are disabled.
  //
  // The check has the same time limit as a run of the suite.
  rpc CheckSuiteInWarehouse(CheckSuiteInWarehouseRequest) returns (CheckSuiteInWarehouseResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (synq.v1.scope_authorization) = {
      scopes: [
        SCOPE_RECON_EDIT,
        SCOPE_INGEST_RECON
      ]
    };
  }
}

message CheckSuiteInWarehouseRequest {
  // The suite to check.
  oneof input {
    option (buf.validate.oneof).required = true;

    // The suite_id of a saved suite. The latest version is checked.
    string suite_id = 1 [(buf.validate.field).string.min_len = 1];

    // A suite that is not saved, for example the draft in an editor. The
    // request does not apply the validation rules of ReconciliationSuite. Thus
    // an incorrect suite gets to the check, and the response has its errors.
    ReconciliationSuite suite = 2 [(buf.validate.field).ignore = IGNORE_ALWAYS];
  }

  // The integration of each connection name of the suite, as for
  // SubmitAdhocSuite. A connection name that is not in the list binds to the
  // workspace integration with the same name.
  repeated ConnectionMapping connection_mappings = 3;
}

message CheckSuiteInWarehouseResponse {
  // True when no issue has the ERROR severity.
  bool valid = 1;

  // All the problems that the check found. The errors come first, then the
  // warnings. Empty when the suite has no problems.
  //
  // A connection that does not open is an error on the connection field of
  // each side that uses it. A connection that only setup or teardown uses has
  // an empty field_path.
  repeated SuiteValidationIssue issues = 2;
}

// --- Managed suite requests ---

message UpsertSuiteConfigRequest {
  option (buf.validate.message).cel = {
    id: "create_only_without_expected_state_at"
    message: "do not set create_only and expected_state_at together: a new suite has no version to expect"
    expression: "!this.create_only || !has(this.expected_state_at)"
  };

  // The suite configuration to store. suite_id will equal suite.name.
  ReconciliationSuite suite = 1 [(buf.validate.field).required = true];

  // Human-readable summary of what changed in this version.
  optional string change_summary = 3;

  // Actor performing the upsert. Required.
  synq.issues.actor.v1.Actor actor = 4 [(buf.validate.field) = {required: true}];

  // Save the suite only if this is still its latest version. Set it to the
  // `state_at` of the SuiteConfig that the edit started from.
  //
  // If a different save changed the suite after that version, or if someone
  // deleted the suite, the request does not save. It gets FAILED_PRECONDITION
  // with a SuiteConfigConflict detail, which has the latest version.
  //
  // If you do not set it, the save replaces the latest version.
  optional google.protobuf.Timestamp expected_state_at = 5;

  // Save the suite only if no suite has this name. This prevents an upload
  // that replaces a suite by accident. If the name is in use, the request gets
  // ALREADY_EXISTS. You can use the name of a deleted suite.
  bool create_only = 6;
}

// The error details of the FAILED_PRECONDITION error that an
// UpsertSuiteConfigRequest gets when expected_state_at is not the latest
// version of the suite.
message SuiteConfigConflict {
  // The latest version of the suite. It is not set when the suite was deleted.
  optional SuiteConfig current = 1;
}

message UpsertSuiteConfigResponse {
  // The stored suite config.
  SuiteConfig suite_config = 1;
}

// --- Ad-hoc suite requests ---

message SubmitAdhocSuiteRequest {
  option (buf.validate.message).cel = {
    id: "suite_or_suite_id_required"
    message: "one of suite, suite_id or resume_from_run must be provided"
    expression: "has(this.suite) || has(this.suite_id) || has(this.resume_from_run)"
  };

  // Inline suite configuration. Required when neither suite_id nor
  // resume_from_run is set.
  optional ReconciliationSuite suite = 1;

  // Client-generated invocation ID for idempotency.
  // If an execution with this ID already exists, the call is a no-op.
  string invocation_id = 2 [(buf.validate.field) = {
    required: true
    string: {uuid: true}
  }];

  // Reference to an existing managed suite (alternative to inline suite).
  // When set, the suite config is loaded from the database.
  optional string suite_id = 3 [(buf.validate.field).string.min_len = 1];

  // Maps each connection name referenced by the suite to the
  // integration that should provide credentials at execution time.
  //
  // When omitted, the server attempts to resolve each connection name
  // against a workspace integration of the same name (legacy behaviour).
  // When the suite references connection names that the server cannot
  // resolve, the call fails with FAILED_PRECONDITION + a
  // ConnectionResolutionFailure detail listing every unresolved name and
  // candidate integrations, so the caller can prompt the user to bind
  // them.
  //
  // Both workspace-level (integration_id) and user-level
  // (user_integration_id) credentials are accepted here:
  //   - integration_id requires SCOPE_INTEGRATION_EDIT on the caller.
  //   - user_integration_id requires a user identity in the calling
  //     context and the integration's allow_reconciliation_adhoc gate
  //     enabled.
  repeated ConnectionMapping connection_mappings = 5;

  // When true (default), the runner drills into each mismatched
  // reconciliation via bisection after the quick check fails. Set to
  // false to stop after the quick check — useful for cheap smoke
  // runs, or when the caller plans to trigger a manual drill later.
  //
  // Per-reconciliation `bisection.enabled` still gates whether a given
  // recon is eligible for drill, so this flag is the run-level off
  // switch layered on top.
  optional bool run_bisection = 6;

  // Maximum wall-clock time for this ad-hoc run (quick check plus any
  // bisection drill). A run that exceeds it is cancelled and marked
  // failed. Absent uses the server default; the server clamps the
  // effective value to a supported range.
  optional google.protobuf.Duration execution_timeout = 8;

  // Continue a previous run instead of executing a suite from its config.
  // Mutually compatible with neither suite nor suite_id being set: the suite
  // is rebuilt from the parent run's audit log.
  optional ResumeFromRun resume_from_run = 9;

  // Actor submitting the run. Required.
  synq.issues.actor.v1.Actor actor = 7 [(buf.validate.field) = {required: true}];
}

// ResumeFromRun turns an ad-hoc submission into a replay of a previous run:
// either a re-validation ("do the differences it found still exist") or a
// deeper drill of the mismatches it stopped at.
//
// The suite comes from the parent run's audit log, not from a config load, so
// the replay compares the same data the parent compared — template variables
// keep the values they resolved to and a cutoff keeps the watermark it derived.
// Credentials never come from an audit log: it records connection names only,
// and those are bound to integrations exactly as for any other ad-hoc run
// (connection_mappings, else a workspace integration of the same name).
message ResumeFromRun {
  // Invocation id of the run to continue from. It must be a completed run in
  // the caller's workspace whose audit log carries a suite snapshot.
  string parent_invocation_id = 1 [(buf.validate.field) = {
    required: true
    string: {min_len: 1}
  }];

  // What to do with the parent's results.
  ResumeMode mode = 2 [(buf.validate.field) = {
    required: true
    enum: {
      defined_only: true
      not_in: [0]
    }
  }];

  // Restrict the replay to these reconciliation names. Empty replays every
  // reconciliation of the parent that is eligible for the mode.
  repeated string reconciliations = 3;

  // Re-derive every query from the suite instead of replaying the SQL the
  // parent executed. This moves the comparison window to the current clock, so
  // it answers "does the suite pass now" rather than "is that difference still
  // there". Needed for a time-travel snapshot, which can otherwise never turn
  // green.
  bool reresolve = 4;

  // RESUME_MODE_RECHECK only: re-run reconciliations that already passed.
  // The default narrows to the ones that did not, which is the point of a
  // re-validation.
  bool include_passed = 5;

  // RESUME_MODE_RECHECK only: drill into whatever still mismatches, as an
  // ordinary run with run_bisection does. A re-validation usually only needs
  // the quick check, so this is opt-in.
  bool drill_still_mismatched = 6;

  // RESUME_MODE_DRILL_DEEPER only: row count at which drilling stops, overriding the
  // reconciliation's own. Lowering it is the usual reason to resume a
  // bisection drill — the parent stopped at a coarser threshold.
  optional int32 threshold = 7 [(buf.validate.field) = {
    int32: {gte: 1}
  }];

  // RESUME_MODE_DRILL_DEEPER only: how many further levels to drill below the resumed
  // segments. Counted from the deepest resumed segment, so it means "this much
  // deeper" rather than a budget the parent already spent. Absent leaves it
  // unbounded.
  optional int32 extra_depth = 8 [(buf.validate.field) = {
    int32: {gte: 1}
  }];

  // RESUME_MODE_DRILL_DEEPER only: extra group columns to break each divergent
  // aggregate group down by. An aggregate drill already visits every configured
  // group column, so resuming an aggregate reconciliation needs at least one
  // more column to make progress.
  repeated string additional_group_columns = 9;
}

// ResumeMode selects which replay a ResumeFromRun performs.
enum ResumeMode {
  RESUME_MODE_UNSPECIFIED = 0;

  // Re-run the parent's queries and report what changed: fixed, still
  // mismatched, regressed or unchanged.
  RESUME_MODE_RECHECK = 1;

  // Continue the parent's drill from where it stopped — the mismatch segments
  // a bisection left open, or the divergent groups an aggregate found —
  // instead of re-drilling the whole dataset from the top.
  RESUME_MODE_DRILL_DEEPER = 2;
}

message SubmitAdhocSuiteResponse {
  // The stored suite config (includes the invocation_id as suite_id).
  SuiteConfig suite_config = 1;
}

// --- Common requests ---

message GetSuiteConfigRequest {
  // Suite ID to look up. For managed suites this equals the suite name,
  // for ad-hoc suites this is the generated UUID.
  string suite_id = 1 [(buf.validate.field) = {
    required: true
    string: {min_len: 1}
  }];
}

message GetSuiteConfigResponse {
  SuiteConfig suite_config = 1;
}

message ListSuiteConfigsRequest {
  // Filter suites using a specific connection name. When empty, returns all.
  optional string connection_name = 1;

  // Pagination parameters.
  optional synq.v1.Pagination pagination = 2;

  // When true, also include ad-hoc suite configs in the results.
  // By default only managed suites are returned.
  bool include_adhoc = 3;
}

message ListSuiteConfigsResponse {
  repeated SuiteConfig suite_configs = 1;

  // Pagination info for fetching the next page.
  synq.v1.PageInfo page_info = 2;
}

message DeleteSuiteConfigRequest {
  // Suite ID to delete.
  string suite_id = 1 [(buf.validate.field) = {
    required: true
    string: {min_len: 1}
  }];

  // Actor performing the delete. Required.
  synq.issues.actor.v1.Actor actor = 2 [(buf.validate.field) = {required: true}];
}

message DeleteSuiteConfigResponse {}

message ListSuiteConfigVersionsRequest {
  // Suite ID to get version history for.
  string suite_id = 1 [(buf.validate.field) = {
    required: true
    string: {min_len: 1}
  }];

  // Pagination parameters.
  optional synq.v1.Pagination pagination = 2;
}

message ListSuiteConfigVersionsResponse {
  repeated SuiteConfigVersion versions = 1;

  // Pagination info for fetching the next page.
  synq.v1.PageInfo page_info = 2;
}

message GetSuiteConfigVersionRequest {
  // Suite ID.
  string suite_id = 1 [(buf.validate.field) = {
    required: true
    string: {min_len: 1}
  }];

  // Version timestamp.
  google.protobuf.Timestamp state_at = 2 [(buf.validate.field).required = true];
}

message GetSuiteConfigVersionResponse {
  SuiteConfigVersion version = 1;
}

// --- Response messages ---

// SuiteConfig represents the latest version of a reconciliation suite configuration.
message SuiteConfig {
  // Unique identifier. Equals suite_name for managed suites, UUID for ad-hoc.
  string suite_id = 1;

  // Human-readable suite name from ReconciliationSuite.name.
  string suite_name = 2;

  optional string suite_title = 3;
  optional string suite_description = 4;

  // "managed" or "adhoc".
  string suite_type = 5;

  // The full suite configuration.
  ReconciliationSuite suite = 6;

  // Deduplicated connection names referenced by this suite.
  repeated string connection_names = 8;

  // Summary of each reconciliation in the suite.
  repeated ReconciliationConfigSummary reconciliation_summaries = 9;

  // Who last updated this config.
  //
  // `updated_by.via` tells where the save came from. It is VIA_API for a save
  // through the public API, for example from `synq-recon upload-config`. It is
  // VIA_UNSPECIFIED for a save in the Coalesce Quality app.
  optional synq.issues.actor.v1.Actor updated_by = 10;

  // When this version was created. To save an edit of this version only if
  // no other save changed the suite, send this value as
  // UpsertSuiteConfigRequest.expected_state_at.
  google.protobuf.Timestamp state_at = 11;

  // The summary of the change that the save gave. It is not set when the save
  // gave no summary.
  optional string change_summary = 12;
}

// SuiteConfigVersion represents a historical version of a suite config.
message SuiteConfigVersion {
  string suite_id = 1;
  string suite_name = 2;
  optional string suite_title = 3;
  optional string suite_description = 4;
  string suite_type = 5;

  // The full suite configuration at this version.
  ReconciliationSuite suite = 6;

  // Connection names at this version.
  repeated string connection_names = 8;

  // Reconciliation summaries at this version.
  repeated ReconciliationConfigSummary reconciliation_summaries = 9;

  // Who made this change.
  optional synq.issues.actor.v1.Actor updated_by = 10;

  // When this version was created.
  google.protobuf.Timestamp state_at = 11;

  // Whether this version represents a deletion.
  bool deleted = 12;

  // Human-readable summary of what changed.
  optional string change_summary = 13;
}
