# yaml-language-server: $schema=https://schemas.synq.io/governance-as-code/draft/governance.schema.json
#
# Coalesce Quality governance-as-code: data products, owners, ownership and
# alert routing in one file. Apply it with:  governance-as-code apply -f this.yaml
#
# This file holds no credentials. Authentication is configured separately (see
# the README).
#
# Identity works like the API: each resource has a UUID `id`. If you omit it (as
# below), the next run adopts an existing resource with the same title or
# generates a new id, and writes that id back into this file.

dataproducts:
  - title: "Sales & Orders"
    folder: "Domains"
    priority: P1
    # ResolverQL. A data product is a leaf (no in_product / in_domain).
    resolver_ql: 'and(with_type("table"), or(with_name("sales"), with_name("order")))'

  - title: "Dashboards"
    folder: "Concepts"
    priority: P2
    resolver_ql: 'with_type("dashboard")'

owners:
  - title: "Sales Team"
    contacts:
      - slack: "#sales-alerts"
      - email: ["sales@example.com"]
    ownerships:
      # Own a whole data product, referenced by title (or by its id).
      - dataproduct: "Sales & Orders"
        alert:
          severities: [ERROR, FATAL]
          notify_upstream: true
          ongoing: disabled

  - title: "BI Team"
    contacts:
      - slack: "#bi-alerts"
    ownerships:
      # Own assets selected by an ad-hoc query, with a weekly digest.
      - query:
          name: "All dashboards"
          resolver_ql: 'with_type("dashboard")'
        alert:
          severities: [FATAL]
          ongoing: { schedule: "0 9 * * MON" }
